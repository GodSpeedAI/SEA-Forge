schema: agent.current_status
schema_version: '1.0'

metadata:
  plan_id: casework-live-wiring-production
  plan_version: 0.2.0
  plan_path: .agents/plans/2026-09-23-casework-live-wiring-production.plan.yaml
  brief_path: .agents/reports/2026-09-23-case-engine-frontend-e2e-journey-mapping.md
  brief_note: Read Section 0 (Verification Errata, decisions, runner change) FIRST. Where the body disagrees with Section 0, Section 0 is correct.
  spec_path: .agents/specs/godspeed.casework-cognitive-environment-spec.yaml
  initialized: true
  last_updated: '2026-09-23'
  updated_by: plan-authoring (report verified by 5 independent subagents and hand spot-checks; operator approved all decisions)
  previous_status:
    archived_to: .agents/status-archive/current_status.godspeed-bounded-judgment.2026-09-19.yml
    note: >-
      The godspeed-bounded-judgment plan's status (last settled T28, honest early termination) was
      archived unchanged. .agents/CURRENT_STATUS.md is the historical narrative for the earlier
      casework-cognitive-environment plan. It is background only, not this plan's state.

execution:
  last_settled_task: null
  settled_tasks: []
  in_flight_task: null
  ready_tasks: [T00]
  blocked_tasks: []
  plan_blocked: false
  plan_blocker: null
  external_blockers: []

operator_decisions:
  D-1: "APPROVED 2026-09-23. The spec-04 CognitiveWorldSnapshot (interface-contracts/typescript/types.ts) is the single UI<->gateway contract."
  D-2: "APPROVED 2026-09-23. A gateway principal acts on_behalf_of allowlisted, gateway-authenticated end users. Both principals are ledgered. Needs an ADR."
  D-3: "APPROVED 2026-09-23. An explicit case.advance/item.execute verb plus an opt-in server supervisor, both calling CaseRunner in-process."
  dependencies: "APPROVED: a Go OIDC library and golang.org/x/crypto/argon2. REJECTED: Playwright; use agent-browser. Anything else is ask-first."
  git: >-
    The implementing agent may create a local branch and make local commits, following the
    agent_protocol.git rules below. It may never push, fetch, pull, rebase, reset, merge or clean.

next_action:
  task: T00
  action: >-
    Execute T00 (baseline, decision log, live-stack justfile recipes). Create
    .agents/reports/casework-live-wiring/decision-log.yaml recording D-1, D-2 and D-3 and the
    dependency decisions. Record the baseline exit state of every global gate, including the
    pre-existing red tests, before changing any code.

agent_protocol:
  read_order:
    - .agents/current_status.yml (this file)
    - .agents/plans/2026-09-23-casework-live-wiring-production.plan.yaml (whole file; the operating_contract and guardrails are binding)
    - .agents/reports/2026-09-23-case-engine-frontend-e2e-journey-mapping.md Section 0 only (read the body only when a task's hot_context points there)
    - .agents/reports/casework-live-wiring/decision-log.yaml (once T00 creates it)
    - repository AGENTS.md / CLAUDE.md files at each boundary you touch
  loop: >-
    Repeat until T12 is settled. (1) Pick the next ready task: the lowest-numbered task whose
    depends_on are all settled. Independent ready tasks on different parallel_tracks may run
    concurrently. (2) Write the preregistration when the task requires one. (3) Implement the task's
    steps. (4) Run the task gate and every global gate that existed before the task. Save logs under
    .agents/evidence/casework-live-wiring/<Txx>/. (5) Run the task's teeth attacks and record the
    results. (6) For confirmation=independent, a separate subagent that did not build the task
    re-runs the gates and teeth and writes confirmation.md. (7) Update this file: settled_tasks,
    ready_tasks, next_action and the handoff block. (8) Commit (see git). Then continue without
    waiting for the operator. T13 is a post-production increment: before starting it, split it into
    tasks in the plan and stop for operator review.
  stop_and_ask_when:
    - "A task's redesign_trigger fires, or the plan's correction_protocol applies. Record the details in the decision log and in this file's handoff.warnings, then stop."
    - "A new dependency is needed that is not pre-approved above."
    - "A change to the security or identity model goes beyond the D-2 ADR scope."
    - "Any destructive or outward-facing action (push, publish, deleting user data, touching the gauntlet or sxr repos)."
    - "A global gate that was green at baseline turns red and cannot be fixed within the task's scope."
  git:
    branch: "At T00, create a local branch casework/live-wiring from the current HEAD with `git switch -c`. The dirty tree carries over untouched."
    commits: "One or more commits per settled task. Stage only files this plan's tasks changed, by explicit path. Never use `git add -A` or `git add .`."
    preserve: "Never stage, revert, stash or delete the pre-existing dirty files (baseline: 109 porcelain entries on 2026-09-23, including deletions under apps/godspeed-cognitive-ui/src/{core,host,adapters/fixture}). Record the inventory at T00 in evidence/T00/dirty-inventory.txt."
  delegation: >-
    Follow the global CLAUDE.md. Subagents run on model haiku, passed explicitly, for recon,
    summaries and well-specified localized edits. The main agent keeps architecture, specs,
    integration and verification. Treat subagent reports as unverified until spot-checked.
  context_hygiene: >-
    This file must always be enough for a fresh agent to resume after /clear or compaction. Update
    handoff after every task, not only at the end.

baseline_warnings:
  - "The archived status recorded pre-existing red tests: sea-forge-server exits 101 on a pre-existing sfwp trio, and sea-forge-cli exits 101 on pre-existing t13_1. T00 must re-measure these and record exact test IDs so they are not mistaken for regressions."
  - "The working tree is dirty with another effort's changes (see git.preserve above)."
  - "The Cognitive UI's local ladder (bun e2e/run.ts) was 11/11 PASS per CURRENT_STATUS.md. It is a regression gate for T08 and T09."

handoff:
  changed_files:
    - .agents/reports/2026-09-23-case-engine-frontend-e2e-journey-mapping.md (added Section 0 errata, decisions and the agent-browser runner change)
    - .agents/plans/2026-09-23-casework-live-wiring-production.plan.yaml (new, status ready)
    - .agents/current_status.yml (re-pointed to this plan)
    - .agents/status-archive/current_status.godspeed-bounded-judgment.2026-09-19.yml (archived copy of the previous status)
  decisions: [D-1, D-2, D-3, "dependencies", "agent-browser over Playwright"]
  warnings: []
  evidence: []
