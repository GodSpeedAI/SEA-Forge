agent_protocol:
  read_order:
    - .agents/current_status.yml (this file)
    - .agents/plans/2026-09-23-casework-live-wiring-production.plan.yaml (whole file; the operating_contract and guardrails are binding)
    - .agents/reports/2026-09-23-case-engine-frontend-e2e-journey-mapping.md Section 0 only (read the body only when a task's hot_context points there)
    - .agents/reports/casework-live-wiring/decision-log.yaml (corrections C-1, baseline B-1, incident E-1)
    - repository AGENTS.md / CLAUDE.md files at each boundary you touch
  loop: >-
    Repeat until T12 is settled. (1) Pick the next ready task: the lowest-numbered task whose
    depends_on are all settled (execution.task_detail carries per-task notes). (2) Write the
    preregistration when the task requires one. (3) Implement the task's steps. (4) Run the task
    gate and every global gate that existed before the task; the recorded baseline floor applies
    (see warnings: ladder J1 red, Go coordinator flake). Save logs under
    .agents/evidence/casework-live-wiring/<Txx>/. (5) Run the task's teeth attacks and record the
    results. (6) confirmation=independent tasks need a separate subagent critic that did not build
    the task; it re-runs gates and teeth and writes confirmation.md. (7) Update this file:
    settled_tasks, ready_tasks, next_action and the handoff block. (8) Commit (see git). Then
    continue without waiting for the operator. T13 is a post-production increment: before starting
    it, split it into tasks in the plan and stop for operator review.
  delegation: >-
    OPERATOR STANDING INSTRUCTION (2026-09-23 session 1): aggressively delegate implementation and
    independent verification. For each meaningful unit: a builder subagent with a bounded,
    self-contained spec; then an independent critic subagent given the builder's ORIGINAL
    instructions plus the resulting implementation. The critic must verify correctness and
    completeness, identify defects/omissions, explain every material deviation, and approve ONLY
    with evidence (code, diffs, tests, commands, runtime behavior). No evidence -> no approval. On
    rejection: fresh builder addresses findings, repeat until evidence-backed approval. The
    orchestrator retains semantics, architecture, decomposition, integration, final decisions.
    Sessions 1 pattern that worked: run builders in background in parallel only when file sets are
    disjoint; commit each confirmed unit with explicit-path staging; critics re-run everything
    themselves. CAVEAT: subagent usage limits killed agents twice on 2026-09-24 — if a spawn
    fails with a usage-limit error, either wait for the reset time in the error or continue
    inline for non-settlement work, but NEVER mark a task settled on self-verification alone when
    its proof level or confirmation requires independence.
  git:
    branch: "casework/live-wiring (created 2026-09-23 from 44ffadd). Push authorized 2026-10-05; never fetch/pull/rebase/reset/merge/clean or force push."
    commits: "One or more commits per settled task (interim per-unit commits allowed with explicit pending-confirmation labeling, as 9c153b2 does). Stage only files this plan's tasks changed, by explicit path. Never `git add -A` or `git add .`."
    preserve: "The 109-entry dirty baseline was committed by the operator side as 44ffadd before session 1; the tree has been clean since. Do not revert or rewrite any of this branch's commits."
  context_hygiene: >-
    This file must always be enough for a fresh agent to resume after /clear or compaction. Update
    handoff after every task. `just context-check` must pass before any commit that changes
    project files (it requires a CURRENT_STATUS.md touch whenever project files change — append a
    dated note there and re-run it).
  stop_and_ask_when:
    - "A task's redesign_trigger fires, or the plan's correction_protocol applies (a report Section 0 fact proves wrong). Record in decision log + report Section 0 + handoff.warnings, surface to the operator, and only continue unilaterally under the operator's standing best-judgment instruction if the stop goes unanswered (precedent: correction C-1, option A)."
    - "A new dependency is needed that is not pre-approved above."
    - "A change to the security or identity model goes beyond the D-2 ADR scope."
    - "Any unauthorized destructive or outward-facing action (publish, deleting user data, touching the gauntlet or sxr repos). Meaningful branch pushes are authorized 2026-10-05."
    - "A global gate that was green at the recorded baseline floor turns red and cannot be fixed within the task's scope."

