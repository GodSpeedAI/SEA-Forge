agent_protocol:
  read_order:
    - .agents/current_status.yml (this file)
    - .agents/plans/2026-09-23-casework-live-wiring-production.plan.yaml (whole file; the operating_contract and guardrails are binding)
    - .agents/reports/2026-09-23-case-engine-frontend-e2e-journey-mapping.md Section 0 only (read the body only when a task's hot_context points there)
    - .agents/reports/casework-live-wiring/decision-log.yaml (once T00 creates it)
    - repository AGENTS.md / CLAUDE.md files at each boundary you touch
  loop: >-
    Repeat until T12 is settled. (1) Pick the next ready task: the lowest-numbered task whose
    depends_on are all settled. Independent ready tasks on different parallel_tracks may run
    concurrently. (2) Write the preregistration when the task requires one. (3) Implement the task's
    steps. (4) Run the task gate and every global gate that existed before the task. Save logs under
    .agents/evidence/casework-live-wiring/<Txx>/. (5) Run the task's teeth attacks and record the
    results. (6) For confirmation=independent, a separate subagent that did not build the task
    re-runs the gates and teeth and writes confirmation.md. (7) Update this file: settled_tasks,
    ready_tasks, next_action and the handoff block. (8) Commit (see git). Then continue without
    waiting for the operator. T13 is a post-production increment: before starting it, split it into
    tasks in the plan and stop for operator review.
  stop_and_ask_when:
    - "A task's redesign_trigger fires, or the plan's correction_protocol applies. Record the details in the decision log and in this file's handoff.warnings, then stop."
    - "A new dependency is needed that is not pre-approved above."
    - "A change to the security or identity model goes beyond the D-2 ADR scope."
    - "Any destructive or outward-facing action (push, publish, deleting user data, touching the gauntlet or sxr repos)."
    - "A global gate that was green at baseline turns red and cannot be fixed within the task's scope."
  git:
    branch: "At T00, create a local branch casework/live-wiring from the current HEAD with `git switch -c`. The dirty tree carries over untouched."
    commits: "One or more commits per settled task. Stage only files this plan's tasks changed, by explicit path. Never use `git add -A` or `git add .`."
    preserve: "Never stage, revert, stash or delete the pre-existing dirty files (baseline: 109 porcelain entries on 2026-09-23, including deletions under apps/godspeed-cognitive-ui/src/{core,host,adapters/fixture}). Record the inventory at T00 in evidence/T00/dirty-inventory.txt."
  delegation: >-
    Follow the global CLAUDE.md. Subagents run on model haiku, passed explicitly, for recon,
    summaries and well-specified localized edits. The main agent keeps architecture, specs,
    integration and verification. Treat subagent reports as unverified until spot-checked.
  context_hygiene: >-
    This file must always be enough for a fresh agent to resume after /clear or compaction. Update
    handoff after every task, not only at the end.

