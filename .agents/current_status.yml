    result: 'T00 SETTLED (P2) with CORRECTION ROUND 6 APPLIED and RE-CONFIRMATION PENDING. Frozen prereg before the first gate (one disclosed 36-second post-freeze typo fix recorded as post_freeze_amendments, with an explicit not_established list); spec sha256 reproduced; GATE_SPEC_TRACE PASS; 86/86 traceability; both teeth pass; SEA Forge baselines lint/typecheck/test/proof/build PASS, security RED, and just check (101 s)/just ci (41 s) both red ONLY at security; Gauntlet gates RESOURCE_DEFERRED with readings and exact commands; implementation brief with exact SFWP/Gauntlet/Workbench inventories; two inventory corrections preserved (GitHub verdict ABSENT -> PARTIAL; SFWP reference doc stale 18 vs 23). Independent verification rounds 1, 2 and 3 all returned NOT_CONFIRM, each finding real defects in the measurement/bookkeeping layer: round 1 found 7; round 2 found the withdrawn gitleaks wording still current in five artifacts and the unbacked proof time still displayed; round 3 found a self-destroyed prereg disclosure, disagreeing handoff rounds, a script measuring the span while the text described the value, three script vacuity/crash holes, a non-durable report path, and GB values under GiB labels throughout. Round 4 fixed that class, but round 4 verification proved the self-audit was partly theatre and found a residual unit error; round 5 fixed the audit and rebuilt it, and round 5 verification then found the decision log emptied to 0 bytes while the audit certified it present, plus thirteen injected defect classes the audit missed. Round 6 restored the decision log and hardened the audit (content assertions incl. the nine decision ids and the verdict records; punctuation-variant and wrapped wording; .csv and extensionless citations; anchored-pair arithmetic; absent/stale round claims; deleted raw logs and round records; injections proven to change the mirror; no skip-variable loophole), then deliberately narrowed it because tightening prose heuristics produced false positives on the builder own disclosure text. Current state: SELF-AUDIT: PASS (mechanical and arithmetic checks only) and SELF-TEST: PASS (9/9 injected classes detected). T00 IS NOT INDEPENDENTLY CONFIRMED: five adversarial verification rounds were run and all five returned NOT_CONFIRM; every finding was in the evidence layer and each is fixed or explicitly re-scoped. No load-bearing claim has been falsified in any round.'
