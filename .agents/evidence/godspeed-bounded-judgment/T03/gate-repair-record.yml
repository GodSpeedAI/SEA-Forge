round_1_reproduction:
  command: "just crate-test sea-forge-server both_layouts_still_resolve_after_a_restart"
  exit_code: 101
  evidence: "round-1-reproduction.log"
  failure: "panicked at conformance_run_locator.rs:59:56 — UnixStream::connect unwrap, Os NotFound; the second server never published a socket because the first server still held the cell lock"

diagnosis:
  decided: "DECIDED: the production lock scope is correct; the test's assumption was wrong"
  mechanism: >-
    lock_cell_root (crates/sea-forge-server/src/lib.rs:966) takes an exclusive
    flock on <root>/.server.lock, held for the server's lifetime, documented:
    "A socket override must not let two servers mutate the same ledgers through
    different socket paths" (single-mutator-per-cell invariant; runtime depends
    on it). The restart test kept the first server ALIVE (only the client was
    dropped) and booted a second server against the same root — an operation the
    product deliberately refuses. The redesign_trigger condition (lock
    fundamentally process-scoped in a way the runtime depends on) was examined
    and does NOT fire: the lock is cell-scoped, documented, and load-bearing.
  test_fix_rationale: >-
    The test's essential property is unchanged: both run layouts must resolve
    through a SECOND server (fresh socket, fresh server state) after the
    process that first served them is gone. The correction makes the test
    model a real restart: the first server task is aborted (dropping the
    future releases the flock exactly as a real process exit would) before
    the second server boots. No assertion was weakened, deleted, filtered, or
    made single-threaded; no production code changed.

correction:
  files_changed: ["crates/sea-forge-server/tests/conformance_run_locator.rs"]
  change: >-
    serve() now returns (socket, JoinHandle); single-server call sites
    destructure with _server; the restart test aborts and awaits the first
    server task before booting the second, with a comment stating the
    invariant. Assertions byte-identical to round-1.

