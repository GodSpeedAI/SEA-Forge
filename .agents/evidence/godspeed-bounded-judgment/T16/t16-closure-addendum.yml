  frozen_d_bar_definition: >-
    accuracy >= 0.8 on NON-ABSTAINING rows for both capable providers (prereg
    leg b). The overall accuracy (including abstentions as incorrect) is a
    DIFFERENT metric and is reported separately for transparency.
  deepseek_clinepass:
    total_rows: 25
    answered: 24
    abstentions: 3
    correct: 20
    incorrect: 1
    contract_failures: 1 (provider_timeout)
    overall_accuracy: "0.8000 (20/25, abstentions as incorrect)"
    non_abstaining_accuracy: "0.9524 (20/21)" 
    abstention_rate: 0.12
    exact_permutation_p: "49/5,200,300 = 9.4e-6"
    frozen_d_bar_leg_b: "PASS (0.9524 >= 0.8)"
    frozen_d_bar_leg_a: "FAIL (1 timeout != 0)"
  muse_spark_free:
    total_rows: 25
    answered: 25
    abstentions: 17
    correct: 7
    incorrect: 1
    contract_failures: 0
    overall_accuracy: "0.2800 (7/25, abstentions as incorrect)"
    non_abstaining_accuracy: "0.8750 (7/8)"
    abstention_rate: 0.68
    exact_permutation_p: "204204/5,200,300 = 0.039"
    frozen_d_bar_leg_b: "PASS (0.875 >= 0.8)"
    frozen_d_bar_leg_c: "FAIL (0.68 > 0.5)"
  KEY_FINDING: >-
    BOTH providers pass the frozen D-bar's accuracy metric (leg b: non-
    abstaining accuracy >= 0.8). DeepSeek: 0.9524. Muse: 0.8750. The
    conjunctive rule fails on OTHER legs: DeepSeek's 1 timeout (leg a) and
    Muse's 0.68 abstention rate (leg c). The prior narrative's "Muse
    performed at chance / 0.28" was misleading: Muse's OVERALL accuracy was
    0.28 because 17/25 abstentions scored as incorrect, but its 7/8
    non-abstaining accuracy (0.875) passes the D-bar. The distinction
    between "overall" and "non-abstaining" accuracy is the reconciled
    metric definition.
  outcome_C_justification: >-
    Outcome C is correct under the frozen conjunctive rule: leg (a) fails
    (DeepSeek 1 timeout), leg (c) fails (Muse 0.68 abstention). The accuracy
    leg (b) passes for both providers. The result is more nuanced than
    "providers can't judge": both providers CAN discriminate when they answer;
    the blockers are availability (timeout) and abstention rate.
  corrected_permutation_oracle:
    method: "exact class-preserving enumeration, corrected matches formula"
    deepseek: "p = 49/5,200,300 = 9.4e-6"
    muse: "p = 204,204/5,200,300 = 0.039"
    prior_faulty_result: "preserved; cause = matches counted settled-truths-on-wrong-answers as hits"

provider_fallback_policy_vs_evidence:
  execution_policy: >-
    The operator authorized a free-provider fallback chain: prefer an
    available free provider; if usage is exhausted, select the next suitable
    free provider. This policy selected which instruments were used.
  experimental_evidence: >-
    Each provider's scored outputs are separate and provider-specific.
    DeepSeek and Muse results are NOT merged. The fallback policy did not
    and must not cause results from different instruments to be treated as
    coming from one model.

final_t16_claim:
  outcome: C
  statement: >-
    On this frozen DecisionSurface and consequence-backed 25-run corpus, both
    capable providers demonstrated consequence-grounded signal at or above
    the frozen D-bar's accuracy threshold when they answered (DeepSeek 0.952
    non-abstaining; Muse 0.875 non-abstaining). However, the conjunctive
    frozen promotion rule was not satisfied: DeepSeek had 1 contract failure
    (timeout), and Muse abstained on 68% of rows (exceeding the 0.5
    threshold). Therefore the bounded-judgment slice does not earn
    architectural promotion on this surface. The capability-class question
    remains ESCALATED, not rejected.
  deepseek_component_finding:
    earned: >-
      DeepSeek 4.1 Flash via ClinePass showed real, permutation-confirmed
      consequence-grounded discrimination: 0.952 non-abstaining accuracy,
      exact permutation p = 9.4e-6, responsible abstention pattern (all 3
      abstentions on not_settled rows). The single non-abstaining error was
      a lying-claim acceptance (the claim-vs-observation distinction).
    not_earned: "the 0-contract-failure requirement (1 timeout)"
  muse_component_finding:
    earned: "Muse Spark 1.3 contributor-free showed 0.875 non-abstaining accuracy on the 8 rows it chose to answer"
    not_earned: "sufficient answer coverage (68% abstention rate fails the 0.5 threshold); overall accuracy 0.28 including abstentions"
  scoped: "this DecisionSurface, this 25-run corpus, these two provider legs; no capability-class, model-generalization, or calibration claim"

