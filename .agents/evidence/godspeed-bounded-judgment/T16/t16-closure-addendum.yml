provider_independence:
  assessment: >-
    DeepSeek-via-ClinePass and Muse-Spark-via-opencode are different models on
    different provider routes (ClinePass API vs opencode provider namespace),
    sharing only the opencode CLI front-end and the auth store. Backend
    independence is NOT fully provable from this seam (alias-level identity,
    opaque backends). The two-provider comparison is preserved WITH this
    caveat. The pair is more independent than a same-router pair would be,
    but not provably fully independent.
  caveats: "prime-agent's backend was also not fully observable; no provider's backend identity was independently verifiable beyond the alias level"

