# =============================================================================
# T23 round-3 confirmation packet — everything an independent verifier needs
# to re-derive the addendum-3 mechanical separation and the route goal
# WITHOUT trusting this builder.
#
# Path conventions:
#   repo:  = /home/sprime01/projects/sea-rs          (sea-rs repo root)
#   data:  = /home/sprime01/.local/share/godspeed-route-discovery/T23
#            (pinned probe data root, $HOME-scoped)
# Every repo: path below is relative to the sea-rs repo root; data: paths
# are absolute.
#
# TRUST POLICY: the verifier should NOT trust ANY item in this packet
# without recomputation. verify_trust_mode is "recompute_everything":
# every listed file must be re-hashed against its manifest pin, every
# consequence re-derived from the pinned state DBs, every label re-derived
# by the frozen rule, and the goal recomputed — exactly what
# round-3/verify_route.round3.py does (exit 0 = all recomputations agree).
# =============================================================================
