payment_counters:
  trust: recompute_everything
  items:
    - repo:.agents/evidence/godspeed-bounded-judgment/T23/route/payment-counters.yaml (round 1: 16 provider calls, 12 probes)
    - repo:.agents/evidence/godspeed-bounded-judgment/T23/round-2/payment-counters.round2.yaml (round 2: 12 re-judgment calls, 0 re-runs)
    - round-3 block in repo:.agents/evidence/godspeed-bounded-judgment/T23/round-3/route-record.round3.yaml (12 probes, 0 re-runs, 0 round-3 provider calls)

verifier_receives_also:
  - the frozen T21 preregistration and contract modules (above)
  - the T22/T23 route, probe, judgment, and selection records (above)
  - the gauntlet state databases and manifests needed to recompute terminal consequences (above)
  - the frozen selection policy and its version (selection-policy-v1, in T21/selection_policy.py)

verifier_should_not_receive:
  - the builder narrative or any provider reasoning transcript (round-2 raw provider outputs are evidence records, NOT builder reasoning; they enter only through re-parsing)

recompute_instructions:
  - command: python3 .agents/evidence/godspeed-bounded-judgment/T23/verify_route.round3.py
    cwd: /home/sprime01/projects/sea-rs
    expect: exit 0, all checks pass
    covers: >-
      (a) all 12 DB sha256 pins; (b) independent re-derivation of every
      mechanical label from DBs + hash-verified artifacts; (c) the symmetry
      property; (d) goal recomputation from labels + round-1 records;
      (e) fingerprint vs round-1; (f) round-1/round-2 unmodifiedness via
      their manifests (fail-closed); (g) round-3 manifest hashes (both
      directions).
  - env: PYTHONDONTWRITEBYTECODE=1 recommended (the gate sets sys.dont_write_bytecode itself)
