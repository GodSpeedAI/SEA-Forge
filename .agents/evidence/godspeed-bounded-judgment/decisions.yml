  - id: D-2026-09-17-T01-04
    date: "2026-09-17"
    task: T01
    kind: harness-correction-round-4
    decided: >-
      Round-3 smoke execution produced a pilot dataset that exposed HARNESS
      deficiencies (not corpus gaps): (1) evidence resolution failed 17/17
      because the resolver searched pin-file contents instead of the sharded
      object store (objects/<2-hex>/<rest> keyed by the sha256 in the ref);
      (2) temporal integrity was indeterminate 17/17 because the judgment
      timestamp used only the payload's produced_at and ignored the records.at
      epoch column, and the settlement timestamp candidates omitted
      settlements.settled_at; (3) state_before joined checkpoints by timestamp
      although checkpoints carry iteration_no, not ts. Post-freeze schema
      inspection (legitimate: freeze precedes execution) informed round-4
      corrections: direct sharded-object resolution with evidence_productions
      cross-check; judgment ts = payload.produced_at else records.at; settlement
      join by verification_ref equality first; observation_binding join by
      evidence_ref equality first; checkpoint join by iteration_no ordering
      (disclosed as iteration-order, not wall-clock); evidence_production row
      added to the consequence hop. NO measurement logic, domain, metric,
      provider, or disclosure change; the frozen preregistration's
      adaptive-join analysis algorithm anticipated exactly this class of
      schema-informed join correction. Round-3 bytes preserved verbatim at
      round-1/run_pilot.round3-crashed.py (sha256
      a4f0c611bdfd2bec868f4092bda4dfe37e30f57f4a541f27b21e9719ee451c5d).
      Round-4 harness sha256: 6526c8041750f23178600758a3f2ce267631b026adc1a663ae85082be9189532. No PROVIDER result has been observed
      yet; the F1 freeze therefore still precedes all provider evidence.
    evidence: ".agents/evidence/godspeed-bounded-judgment/T01/round-1/run_pilot.round3-crashed.py"
    round4_harness_sha256: "6526c8041750f23178600758a3f2ce267631b026adc1a663ae85082be9189532"

