  - id: D-2026-09-17-T01-07
    date: "2026-09-17"
    task: T01
    kind: harness-correction-round-7-and-tooth-classification
    decided: >-
      Post-pilot tooth battery found (a) three MECHANICAL signature bugs: the
      TEETH registry passed three arguments to strip-identity/duplicate-rows/
      reverse-time handlers that take one; fixed by uniform lambda wrappers.
      (b) One SUBSTANTIVE tooth result: shuffle-labels returned
      behaved_as_specified=false with accuracy_real=null and
      accuracy_shuffled=null. Classification per the correction protocol:
      ORACLE/PRECONDITION issue, not a measurement defect — the recorded
      deterministic baseline is single-class (PASS x17, outside the frozen
      domain, 0 pairs by the no-coercion rule), so shuffling labels is a NO-OP:
      no score can survive or collapse, and a bare False would falsely imply
      the harness computes nothing real. Round-7 makes the precondition
      explicit: with fewer than two distinct in-domain baseline labels the
      tooth reports VACUOUS_NO_BASELINE_VARIANCE with full counts and treats
      this as a surface finding feeding the outcome classification. The failed
      round-1 tooth output is PRESERVED at teeth/shuffle-labels.yml;
      corrected outputs use a --teeth-suffix (round-2 tags) and never
      overwrite. This is a disclosure, not a weakening: the declared attack was
      executed, its inapplicability is itself measured evidence, and it is
      recorded in the outcome decision. Round-6 bytes preserved at
      round-1/run_pilot.round6-crashed.py. Round-7 harness sha256: b76b7f0a5f8d91489becab090eec469a97aee74b6085922583999b872c1b6174.
    evidence: ".agents/evidence/godspeed-bounded-judgment/T01/round-1/teeth/shuffle-labels.yml"
    round7_harness_sha256: "b76b7f0a5f8d91489becab090eec469a97aee74b6085922583999b872c1b6174"

