    redesign_trigger: "Journeys need data that the contract does not carry (return to T01)."

  T10:
    title: "Live agent-browser ladder L0-L9 + L-RECOV"
    initial_status: blocked
    depends_on: [T08, T09]
    proof_level: P3
    confirmation: independent
    settles: [E2E-LIVE]
    changes: >-
      Extends the existing agent-browser harness (apps/godspeed-cognitive-ui/e2e/browser.ts,
      ladder.ts, run.ts, journeys/) with a live mode, e.g. `bun e2e/run.ts --live` driving
      e2e/journeys-live/. There is no Playwright and no new dependency. A setup hook runs
      `just casework-cell-init` and brings up the stack (server, gateway serving the production UI
      build). The ladder mirrors report §5, corrected per errata §0.2: L0 readiness (readiness.get,
      identity); L1 template -> preflight -> commit (assert CaseCreated and PlanCreated in
      cases/case-*/case-events.jsonl); L2 horizon standing; L3 discretionary add (PlanMutated,
      proposed_by); L4 execute (ItemActivated, CommandStarted, CommandFinished, ArtifactCaptured,
      ItemCompleted, then downstream ItemEnabled pushed through SSE with no reload); L5 sign-off
      approval, where the operator is denied and a second authenticated user in a separate
      agent-browser `--session` (the R-SO) approves, and approvals.jsonl shows both principals;
      L6 settlement (SettlementRecorded) and the evidence dock, with `agent-browser network requests`
      or `network har` proving that only the needed lazy renderer chunks loaded; L7 completion
      (CaseClosed) then reopen (CaseReopened), and terminate (CaseTerminated) on a second case;
      L8 thoth.ask narration with interrupt and resume; L9 L0-L8 in one session with
      `agent-browser errors` and `console` empty; L-RECOV covers a corrupt artifact, killing and
      restarting the gateway, killing and restarting the server, and SSE resync with no duplicates.
      Assertions read the durable files directly. Evidence per run comes from `agent-browser
      screenshot`, `record start/stop` (video), `trace start/stop` and HAR under the evidence root.
      The existing fixture ladder (`bun e2e/run.ts`) stays unchanged as the local regression.
    proves: "CJ01-CJ09 work end to end in a real browser against real kernel state."
    does_not_prove: "Multi-replica or remote deployment."
    hot_context:
      - "apps/godspeed-cognitive-ui/e2e/browser.ts (agent-browser wrapper), ladder.ts (Journey/Ctx, dependency blocking), run.ts, journeys/index.ts"
      - "agent-browser --help: network requests|har, console, errors, cookies, --session, record, trace"
      - "report §5 (use the TraceKinds from errata §0.2, not the body)"
    preregistration:
      required: true
      artifact: .agents/evidence/casework-live-wiring/prereg/T10.yaml
      claim: "Each ladder step's UI assertion and its durable-state assertion both pass, with no fixture adapter loaded."
      falsifier: "Any step passes while the durable delta is missing, or the served bundle contains LocalContractAdapter."
      known_confounds: ["stale cell from a prior run", "timing-dependent SSE assertions", "agent-browser session reuse leaking cookies between users"]
      confirmation_condition: "Three consecutive green runs on fresh cells, confirmed by an independent agent."
    steps:
      - "Add live-mode plumbing to browser.ts: a session name per user, cookie isolation, and network, errors and console helpers."
      - "Write a helper that tails case-events.jsonl and approvals.jsonl and waits for named TraceKinds with a timeout."
      - "Implement L0-L9 and L-RECOV as live journeys, reusing the ladder's depends_on blocking."
      - "Add the justfile recipe casework-e2e-live (stack up, then `bun e2e/run.ts --live`, then stack down, preserving evidence)."
    gate:
      - "just casework-e2e-live"
    teeth:
      - attack: "Stub the gateway to accept intents without calling the kernel."
        expected: "The durable-state assertions fail at L1."
      - attack: "Run L5 with both users in the same agent-browser session."
        expected: "The ladder detects the shared session identity and fails. It never passes by accident."
    redesign_trigger: "agent-browser cannot observe a required signal (for example per-request network timing, or EventSource frames). Record this in the decision log and ask the operator before introducing any other browser driver."

  T11:
    title: "Operational hardening and packaging"
    initial_status: blocked
    depends_on: [T10]
    proof_level: P2
    confirmation: independent
    settles: [PROD-OPS]
    changes: >-
