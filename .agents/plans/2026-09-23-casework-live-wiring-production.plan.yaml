final_acceptance:
  criteria:
    - "No production code path can load LocalContractAdapter, fakeauthority or the Northstar fixtures."
    - "L0-L9 + L-RECOV pass three times on fresh cells, with durable-state proof."
    - "Two authenticated users with distinct roles are ledgered distinctly. SoD holds between them."
    - "The report's §0 errata and this plan's decision log are consistent with the code."
  evidence_and_confirmation: ".agents/evidence/casework-live-wiring/ holds the gate logs, agent-browser screenshots, videos, traces and HARs, preregistrations and independent-confirmation notes."

guardrails:
  - "Do not modify sea-forge-server's identity trust model outside T02 and its ADR."
  - "Pre-approved dependencies (2026-09-23): one maintained Go OIDC library (e.g. github.com/coreos/go-oidc/v3 + golang.org/x/oauth2) and golang.org/x/crypto/argon2. Playwright is NOT approved; E2E uses agent-browser. Any other new dependency is ask-first."
  - "Do not delete the local adapter or the fixtures. Confine them to tests and dev."
  - "Never mark settlement from process completion. Execution observations are not settlement."
  - "Preserve git history. No force operations."

handoff_contract:
  must_report:
    - "Task id, gates run with results, and evidence paths"
    - "Any divergence from report §0 facts"
    - "Open operator decisions"
  settled_next_action_rule: "The next ready task is the lowest-numbered task whose depends_on are all settled."

