initial_state:
  current_task: T00
  last_settled_task: null
  ready: [T00]
  blocked: []
  note: "All operator decisions are settled (see operator_decisions.*.decision). Tasks other than T00 wait only on their depends_on."

operator_decisions:
  D-1:
    decision: "APPROVED 2026-09-23 — adopt the recommendation below verbatim."
    question: "Which UI<->gateway contract is canonical?"
    options:
      - "spec-04 CognitiveWorldSnapshot from interface-contracts/typescript/types.ts (what the UI's src/ports consumes)"
      - "the Go projection + apps/godspeed-cognitive-ui/contracts/*.ts kebab-case intents"
    recommendation: >-
      spec-04. The UI (185 tests, an 11/11 local ladder) is built on it, and it carries per-object
      ActionDescriptors with role-filtered intents, which the journeys need. The Go projection moves
      to spec-04. contracts/*.ts is retired, or is kept as a documented internal subset with a mapping
      table. Either way, exactly one contract ships.
  D-2:
    decision: "APPROVED 2026-09-23 — adopt the recommendation below verbatim."
    question: "How do multiple browser users act as distinct kernel actors when the server derives identity from the socket peer uid?"
    options:
      - "Gateway principal: the server binds the gateway uid to role 'gateway' in server.yaml. Only that principal may send an on_behalf_of actor, and only for actors listed in a gateway-delegable allowlist. Every such request is ledgered with both principals."
      - "One OS uid per role: run a gateway process per actor. This works for single-operator deployments but does not scale."
      - "Single-actor deployment: the browser user IS the gateway uid, and role switching is out of scope."
    recommendation: >-
      Gateway principal (option 1), backed by an ADR that amends identity.rs:14-27. It must include
      a revocation story, and it must ledger the principal pair so that SoD compares end-user actors,
      never the gateway.
  D-3:
    decision: "APPROVED 2026-09-23 — adopt the recommendation below verbatim."
    question: "Who advances a case after a sentry enables an item: a server-side supervisor, or an explicit operator 'execute' verb?"
    recommendation: >-
      Both, behind one engine call. Add an explicit case.advance/item.execute verb for operator-driven
      work, plus an opt-in server supervisor task for auto-advancing SandboxedTask items. Both call
      CaseRunner (next_ready_actions / run_sandboxed_episode / apply_episode_completion) in-process.
      Neither shells out to the CLI.

tasks:

  T00:
    title: "Baseline, decisions and live-stack scaffolding"
    initial_status: ready
    depends_on: []
    proof_level: P1
    confirmation: builder
    settles: []
    changes: >-
      Records decisions D-1, D-2 and D-3 in the decision log. Adds justfile recipes that boot the
      real stack on a temp cell: casework-cell-init, casework-server-up (env SEA_FORGE_ROOT and
      SEA_FORGE_SOCKET, no flags), casework-go-up (-serve -addr 127.0.0.1:4179 -config <live cfg>),
      casework-ui-up (vite :4178), and casework-stack-down. Records baseline gate results.
    proves: "The three processes start against one temp cell, and the recipes are idempotent and tear down cleanly."
    does_not_prove: "Any data flows between the processes."
    hot_context:
      - "crates/sea-forge-server/src/config.rs:38,86-92 (socket resolution)"
      - "crates/sea-forge-server/src/main.rs (zero-arg binary)"
      - "apps/godspeed-casework-go/cmd/godspeed-casework/main.go:50-52 (flags)"
      - "apps/godspeed-cognitive-ui/vite.config.ts (4178, /api proxy to 4179)"
      - "justfile (only casework-go-check and workbench-* exist today)"
    steps:
      - "Create .agents/reports/casework-live-wiring/decision-log.yaml and record D-1, D-2 and D-3 as APPROVED 2026-09-23 (recommendations adopted), and the dependency approvals (OIDC library, argon2; Playwright rejected in favour of agent-browser)."
      - "Add the justfile recipes above, with pidfiles and a readiness wait on the socket file and on /api/healthz."
      - "Capture the baseline: all global gates, and the existing local ladder."
    gate:
      - "just casework-cell-init && just casework-server-up && just casework-go-up && just casework-stack-down"
    teeth:
      - attack: "Start casework-server-up twice."
        expected: "The second call detects the running server and exits non-zero with a clear message. It does not start a second listener."
    redesign_trigger: "sea-forge-server cannot run against a temp cell without manual init steps that are missing from the CLI."

  T01:
    title: "Single canonical UI<->gateway wire contract (resolves GAP-A)"
    initial_status: blocked
    depends_on: [T00]
    proof_level: P1
    confirmation: independent
    settles: [GAP-A]
    changes: >-
      Makes one contract the source of truth, per D-1. The recommended option is spec-04 types.ts.
      Extends it with every intent the journeys need: PROPOSE_CASE (template_ref, params,
      preflight_digest), ADD_DISCRETIONARY_WORK, EXECUTE_ITEM, COMPLETE_HUMAN_TASK, REOPEN_CASE,
      TERMINATE_CASE, APPROVE_HUMAN_TASK, REJECT_HUMAN_TASK, ESCALATE_OR_OVERRIDE and OPEN_ARTIFACT.
      Adds typed refusals (AUTHORITY_DENIED, UNAUTHORIZED_ROLE, SOD_VIOLATION, STALE_PROJECTION,
      JUSTIFICATION_REQUIRED, UNAVAILABLE, INVALID). Adds the template entry-option and preflight
      result shapes, and the SSE StreamEvent union. Generates Go structs from the contract, or checks
      them against it.
    proves: "The UI types, the Go JSON tags and a set of golden JSON fixtures all agree. A contract test fails on any drift."
    does_not_prove: "That the kernel can perform the intents."
    hot_context:
      - "apps/godspeed-cognitive-ui/src/ports/contract.ts:1-45,147-169"
      - "apps/godspeed-cognitive-ui/contracts/interaction.ts:9-40 (the competing kebab vocabulary)"
      - "apps/godspeed-casework-go/internal/coordinator/coordinator.go:61-69,191-201"
      - "apps/godspeed-casework-go/internal/projection/projection.go"
    steps:
      - "Write the contract ADR at .agents/reports/casework-live-wiring/adr-wire-contract.md."
      - "Extend types.ts, and keep the extensions additive."
      - "Add golden fixtures under .agents/reports/interface-contracts/golden/ (world, intent request and response per kind, each SSE event)."
      - "Add a Go contract test that unmarshals and re-marshals every golden, byte-stable, and a TS test that type-checks and validates them."
      - "Retire or alias contracts/*.ts per D-1. Delete the unused dialect so it cannot drift back."
    gate:
      - "cd apps/godspeed-casework-go && go test ./internal/contract/..."
      - "cd apps/godspeed-cognitive-ui && bun test src/ports"
    teeth:
      - attack: "Rename visible_objects to objects in the Go struct tag."
        expected: "The Go golden test fails."
      - attack: "Add an intent kind in TS only."
        expected: "The Go exhaustive-kind test fails."
    redesign_trigger: "The spec-04 shape cannot represent the plan-item DAG or the sentry reasons without a breaking change."

  T02:
    title: "Delegated actor identity for the gateway principal (resolves GAP-B)"
    initial_status: blocked
    depends_on: [T00]
    proof_level: P2
    confirmation: independent
    settles: [GAP-B]
    changes: >-
      Implements D-2 in sea-forge-server. The gateway uid binds to a gateway principal. Protected verbs
      accept an optional on_behalf_of that is honoured only for the gateway principal and only for
      allowlisted actors. Every resulting ledger or trace record carries both principals. SoD
      comparisons use the end-user actor. identity.get reports the effective actor.
    proves: "Two end users behind one gateway are attributed distinctly, SoD holds between them, and a non-gateway uid sending on_behalf_of is refused."
    does_not_prove: "That the browser authenticates the user correctly (that is T07)."
    hot_context:
      - "crates/sea-forge-server/src/identity.rs:14-27,56-75"
      - "crates/sea-forge-server/src/config.rs:32 (identity section)"
      - "crates/sea-forge-server/src/lib.rs:2623-2698 (approval.decide passes actor through to the CLI)"
    preregistration:
      required: true
      artifact: .agents/evidence/casework-live-wiring/prereg/T02.yaml
      claim: "on_behalf_of is honoured only from the gateway principal and never widens roles beyond the target actor's bindings."
      falsifier: "Any accepted request whose effective actor is not in the allowlist, or whose role exceeds that actor's binding."
      known_confounds: ["tests running as the same uid as both the gateway and the operator"]
      confirmation_condition: "An independent agent's negative tests pass on a fresh cell."
    steps:
      - "Write the ADR amending the identity model, including threat model, revocation and audit fields."
      - "Add the server.yaml schema for the gateway principal and the delegable actors. Default: none (fail-closed)."
      - "Thread the effective actor through every protected verb, including the run_cli --actor path."
      - "Add integration tests: the gateway acts for A and then B, B cannot approve A's proposal (SoD), and a non-gateway uid is refused."
    gate:
      - "cargo test -p sea-forge-server identity"
      - "cargo test -p sea-forge-server --test '*delegat*'"
    teeth:
      - attack: "Send on_behalf_of from a uid bound as operator."
        expected: "Refused with identity_not_bound or a new class identity_delegation_refused. No ledger write."
      - attack: "Omit the gateway section from server.yaml."
        expected: "All on_behalf_of requests are refused."
    redesign_trigger: "SoD or approval records store the socket uid in places that cannot carry a second principal additively."

  T03:
    title: "Real plan templates and seeded E2E cell (resolves GAP-D)"
    initial_status: blocked
    depends_on: [T00]
    proof_level: P2
    confirmation: builder
    settles: [GAP-D]
    changes: >-
      Adds real PlanTemplate YAMLs that load through sea-forge-planner/src/templates.rs. At minimum:
      one template with a two-item sentry chain (SandboxedTask, then a dependent item), one human-task
      or sign-off gate that triggers an approval, a required milestone, and parameters. Adds a
      reproducible E2E cell seed (casework-cell-init) that installs the templates, the identity
      bindings (operator, security officer, lifecycle custodian, gateway) and the policy.
    proves: "case.entry_options returns the templates. case.preflight passes and fails as designed. case.commit creates case-<id> with CaseCreated and PlanCreated."
    does_not_prove: "Browser-driven commit."
    hot_context:
      - "crates/sea-forge-server/src/sfwp/case.rs:70-105 (entry_options reads <root>/templates/*.yaml), :184 (preflight)"
      - "crates/sea-forge-planner/src/templates.rs (PlanTemplate)"
      - "crates/sea-forge-core/src/types.rs:53 (ItemKind::SandboxedTask), :92-93 (ArtifactExists, SettlementStatus)"
    steps:
      - "Author templates under a checked-in dir, for example fixtures/cells/e2e/templates/, and copy them in during cell init."
      - "Add a server integration test covering entry_options -> preflight (valid and invalid) -> commit -> overview -> horizon."
    gate:
      - "cargo test -p sea-forge-server --test case_templates_live"
    teeth:
      - attack: "A template with a cyclic sentry dependency."
        expected: "Preflight refuses with a cycle reason. Commit is never reached."
    redesign_trigger: "The template schema cannot express a sign-off gate that routes to approval.list."

  T04:
    title: "SFWP case mutation and execution verbs (resolves GAP-C, D-3)"
    initial_status: blocked
    depends_on: [T00]
    proof_level: P2
    confirmation: independent
    settles: [GAP-C]
    changes: >-
      Adds these additive verb-tagged Request variants, each registered in IMPLEMENTED_METHODS and in
      system.describe/get_schema: case.add_item (discretionary; wraps the propose_item logic, keeps
      proposed_by, validate_proposal and cycle checks, emits PlanMutated), case.reopen (emits
      CaseReopened), case.terminate (emits CaseTerminated), case.advance / item.execute (runs
      CaseRunner in-process and emits ItemActivated, CommandStarted, CommandFinished, ArtifactCaptured,
      then ItemCompleted or ItemFailed), human_task.complete (emits HumanTaskCompleted), and
      artifact.get (content-addressed fetch by digest, bounded size). Every mutation goes through the
      same authority and SoD checks as the CLI. Moves the shared logic out of crates/sea-forge-cli into
      a library crate (sea-forge-case-runner, or a new case-ops module), so that the CLI and the
      server call one implementation. approval.decide moves off run_cli onto the same library path.
      Every trace append publishes an EventFrame on the event bus so that events.subscribe carries
      case progress. Adds an optional supervisor that auto-advances enabled SandboxedTask items
      (config flag, default off).
    proves: "Each verb produces exactly the documented TraceKinds in case-events.jsonl. Unauthorized or SoD-violating calls are refused with no writes. Subscribers receive the frames in cursor order."
    does_not_prove: "Gauntlet execution (T13)."
    hot_context:
      - "crates/sea-forge-server/src/sfwp/mod.rs:1-13 (ADR-003 additive rule), :107-249 (IMPLEMENTED_METHODS)"
      - "crates/sea-forge-server/src/lib.rs:592-760 (Request enum), :195-222 (event bus publish), :1229 (EventsSubscribe), :2995 (run_cli)"
      - "crates/sea-forge-cli/src/commands/case.rs:36 (append_case_event), :75 (reopen), :129 (propose_item)"
      - "crates/sea-forge-case-runner (CaseRunner: next_ready_actions, run_sandboxed_episode, apply_episode_completion; run_stage_case ~L372)"
      - "crates/sea-forge-planner/src/case_engine.rs:11,34,100,434,452"
      - "crates/sea-forge-core/src/types.rs:501 (real TraceKind list)"
    steps:
      - "Extract the case mutation functions from the CLI into a library. Keep the CLI as a thin caller. CLI tests stay green."
      - "Add the verbs one per commit, each with an integration test on a temp cell that asserts the jsonl deltas."
      - "Route approval.decide through the library, then delete the run_cli path for it."
      - "Publish the trace appends to event_bus, and prove replay/resume via events.subscribe(from_cursor)."
      - "Add the supervisor behind config, with a bounded concurrency Semaphore and a sandbox-class selection test."
    gate:
      - "cargo test -p sea-forge-cli -p sea-forge-case-runner -p sea-forge-server"
      - "cargo test -p sea-forge-server --test sfwp_case_mutations"
    teeth:
      - attack: "case.add_item that creates a cycle."
        expected: "Refused. plan.json is unchanged and no PlanMutated is emitted."
      - attack: "The proposer approves their own discretionary item."
        expected: "Refused as an SoD violation. approvals.jsonl is unchanged."
      - attack: "Kill the subscriber mid-stream, then resubscribe from_cursor."
        expected: "No gaps and no duplicates beyond the at-least-once boundary. Cursors are monotonic."
    redesign_trigger: "CaseRunner execution cannot run inside the async server without blocking the runtime or breaking sandbox isolation."

  T05:
    title: "Go SFWP client and live AuthorityPort (resolves SEAM-4)"
    initial_status: blocked
    depends_on: [T02, T03, T04]
    proof_level: P2
    confirmation: independent
    settles: [SEAM-4]
    changes: >-
      Adds internal/adapters/sfwp. It is a Unix-socket NDJSON client that speaks the verb-tagged
      wire, and mirrors bridge.rs: request_id correlation, request.get_status recovery after
      reconnect, identity-error classes mapped to typed apperr, per-request deadlines, a bounded
      connection pool, and a dedicated long-lived events.subscribe connection with cursor resume and
      backoff. Extends the Go ports for the live verbs, or adds a CaseAuthorityPort, following
      existing port style. Config selects adapter=sfwp with socket path taken from config or
      SEA_FORGE_SOCKET. Preflight probes system.hello, readiness.get and identity.get.
    proves: "Against a real server on a temp cell, every verb used by the UI round-trips, and restarting the server mid-session recovers without losing correlated outcomes."
    does_not_prove: "Projection correctness (T06)."
    hot_context:
      - "workbench/apps/desktop/src-tauri/src/bridge.rs:306-525 (reference client)"
      - "apps/godspeed-casework-go/internal/ports/ports.go:40,103-129"
      - "apps/godspeed-casework-go/internal/adapters/fakeauthority (shape to replace)"
      - "apps/godspeed-casework-go/internal/preflight, internal/config"
    steps:
      - "Write the frame codec with table tests driven by recorded server frames (capture them from the T04 integration tests)."
      - "Write the client with correlation, deadlines and reconnect. Integration tests start sea-forge-server via go test TestMain on a temp cell."
      - "Write the subscription goroutine that feeds an internal event channel. Resume from the last cursor on reconnect."
      - "Wire it into config and preflight. fakeauthority remains test-only."
    gate:
      - "cd apps/godspeed-casework-go && go test -race ./internal/adapters/sfwp/... -tags live"
    teeth:
      - attack: "The server returns an unknown verb error (old server)."
        expected: "A typed unavailable refusal surfaces. No panic and no retry storm."
      - attack: "Kill the server during case.commit, then restart it."
        expected: "The client resolves the outcome through request.get_status and never double-commits."
    redesign_trigger: "The wire frames are not stable enough to decode without importing Rust-generated schemas (then use system.get_schema codegen)."

  T06:
    title: "Live projection builder and intent translation in the gateway"
    initial_status: blocked
    depends_on: [T01, T05]
    proof_level: P2
    confirmation: independent
    settles: [SEAM-1, SEAM-2, SEAM-3, SEAM-6, SEAM-7]
    changes: >-
      Replaces the compiled-in Northstar projection with a builder that folds case.list,
      case.get_overview, case.get_horizon, approval.list and run.list into the canonical
      CognitiveWorldSnapshot (T01). The builder produces per-object ActionDescriptors filtered by the
      effective actor and role, sentry reasons in plain language, and disjoint execution and
      settlement standing. Adds a revision store keyed by the kernel event cursor, so that /api/world
      ?cursor=... serves true history. Maps each intent kind to one SFWP verb with the effective actor
      (on_behalf_of per T02). Adds template endpoints GET /api/templates (entry_options) and POST
      /api/templates/preflight. Replays kernel frames to SSE as revision events with id=kernel cursor.
      The SSE route honours Last-Event-ID as well as ?last=. Staleness: every mutating intent carries
      the projection cursor, and the gateway refuses with STALE_PROJECTION when the kernel has moved
      past it in a way that affects the target.
    proves: "For each mapped intent, POST /api/intents produces the expected kernel TraceKinds, followed by an SSE revision whose snapshot reflects them."
    does_not_prove: "Browser rendering."
    hot_context:
      - "apps/godspeed-casework-go/internal/server/server.go:57-68 (mux), :99-131 (world, intents), :202-256 (events)"
      - "apps/godspeed-casework-go/internal/coordinator/coordinator.go (validation, idempotency, leases)"
      - "apps/godspeed-casework-go/internal/projection (fixture builder to replace)"
      - "crates/sea-forge-server/src/sfwp/case_views.rs:53-139 (ExecutionStanding, SettlementStanding, HorizonItem, list)"
    steps:
      - "Write the projection builder as pure functions from SFWP DTOs to the contract, with golden tests from T01."
      - "Write the intent translator table. Every kind gets explicit tests for accepted, each refusal class, and idempotent replay."
      - "Write the revision store with a bounded retention policy and a documented 404 for evicted cursors."
      - "Add the template endpoints."
      - "Remove the fixture path from the production build. Keep it behind a test build tag."
    gate:
      - "cd apps/godspeed-casework-go && go test -race ./... && go test -race -tags live ./internal/..."
    teeth:
      - attack: "An operator-role actor posts APPROVE_HUMAN_TASK."
        expected: "UNAUTHORIZED_ROLE. The kernel receives no call, or refuses it. The UI action list for that role never offered it."
      - attack: "Post an intent with a cursor older than the item's last PlanMutated."
        expected: "STALE_PROJECTION, and no kernel write."
    redesign_trigger: "The horizon/overview DTOs lack the data needed for relationships or sentry reasons, and need a new server view verb."

  T07:
    title: "Gateway production posture: auth, sessions, static serving, config"
    initial_status: blocked
    depends_on: [T04, T05]
    proof_level: P2
    confirmation: independent
    settles: [PROD-SEC]
    changes: >-
      Adds browser authentication. Recommended: OIDC or a local user store with argon2 behind a
      pluggable authenticator, and a dev-only static-token mode that is refused in production config.
      Adds a session cookie (HttpOnly, Secure, SameSite=Strict), CSRF protection for POSTs, and a
      mapping from the authenticated user to the kernel actor (the allowlist from T02). The gateway
      serves the built UI (dist/) with correct cache headers and a CSP. Makes the listener address,
      TLS termination (or reverse-proxy guidance) and trusted origins configurable. Keeps the
      loopback-only CORS default. Adds rate limits on intents, structured logs with a
      correlation_id that flows through to the SFWP request_id, and /api/healthz vs /api/readyz
      (readiness includes kernel readiness.get).
    proves: "An unauthenticated request cannot read /api/world or post intents. A user cannot act as another actor. The production config refuses dev auth."
    does_not_prove: "The UI login experience (T09)."
    hot_context:
      - "apps/godspeed-casework-go/cmd/godspeed-casework/main.go"
      - "apps/godspeed-casework-go/internal/server (CORS loopback logic)"
      - "apps/godspeed-casework-go/internal/config"
    steps:
      - "Write the authenticator interface, the session store and middleware ordering tests."
      - "Add static UI serving with SPA fallback, CSP and immutable asset caching."
      - "Write config validation that fails closed in production mode."
    gate:
      - "cd apps/godspeed-casework-go && go test -race ./internal/server/... ./internal/auth/..."
    teeth:
      - attack: "A cross-origin POST /api/intents with a valid cookie but no CSRF token."
        expected: "403, and no kernel call."
      - attack: "Production config with auth.mode=dev."
        expected: "The process refuses to start."
    redesign_trigger: "The deployment target requires the gateway to be stateless across replicas (then move sessions, leases and idempotency to shared storage)."

  T08:
    title: "UI HttpCaseworkAdapter and source selection"
    initial_status: blocked
    depends_on: [T01, T06, T07]
    proof_level: P2
    confirmation: independent
    settles: [UI-LIVE-PORT]
    changes: >-
      Adds src/adapters/http/HttpCaseworkAdapter implementing CaseworkPort: getSnapshot,
      getSnapshotAt, dispatchIntent, resolveArtifact, subscribeEvents via EventSource with
      Last-Event-ID resume and backoff, and queryTemporalTrajectory. Also adds new methods for
      templates and preflight. Actor and role come from the authenticated session (GET /api/session),
      not from UI parameters. Adapter selection: the production build is HTTP-only
      (VITE_CASEWORK_SOURCE=live, and the local adapter is tree-shaken out). Dev and tests may select
      local. The current hardcoded LocalContractAdapter in src/main.tsx:21 is replaced. Connection
      state (live, reconnecting, interrupted) is surfaced to the UI store.
    proves: "Run against the live gateway, the adapter passes the same port-conformance test suite that the local adapter passes."
    does_not_prove: "That the new journey UI exists (T09)."
    hot_context:
      - "apps/godspeed-cognitive-ui/src/ports/contract.ts:147-169"
      - "apps/godspeed-cognitive-ui/src/adapters/local/localAdapter.ts (+ .test.ts as the conformance baseline)"
      - "apps/godspeed-cognitive-ui/src/main.tsx:2,21"
    steps:
      - "Extract a shared port-conformance suite from localAdapter.test.ts, and run it against both adapters (the live run uses the stack from T00)."
      - "Implement the adapter and the source switch, with a bundle check that the prod build contains no local adapter."
    gate:
      - "cd apps/godspeed-cognitive-ui && bun test && bun run build && ! grep -q LocalContractAdapter dist/assets/*.js"
    teeth:
      - attack: "The gateway returns 409 STALE_PROJECTION."
        expected: "The adapter surfaces a typed refusal. The UI refetches and shows it honestly. It does not retry the intent silently."
    redesign_trigger: "EventSource cannot carry the auth cookie in the deployment topology (then switch to fetch streaming)."

  T09:
    title: "UI journey wiring for CJ01-CJ09"
    initial_status: blocked
    depends_on: [T03, T06, T08]
    proof_level: P2
    confirmation: independent
    settles: [SEAM-1, SEAM-2, SEAM-3, SEAM-5, SEAM-6, SEAM-7]
    changes: >-
      Case design: the template picker (from /api/templates) and a parameter form, followed by
      preflight (showing the digest) and commit (PROPOSE_CASE). The submit button is enabled only
