      that dispatches ADD_DISCRETIONARY_WORK and shows the proposer badge. Execute: an item action
      that dispatches EXECUTE_ITEM, and an ExecutionPill driven by real SSE progress and command
      frames. Human task: complete and approve/reject in JudgmentPanel, with mandatory justification
      and SoD and role refusals shown. Lifecycle: Reopen and Terminate actions with a reason, shown
