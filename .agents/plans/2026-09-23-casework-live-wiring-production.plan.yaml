      - "apps/godspeed-cognitive-ui/src/ui/JudgmentPanel.tsx, ExecutionPill.tsx, ArtifactDock.tsx"
      - "apps/godspeed-cognitive-ui/src/app/commands.ts"
      - "apps/godspeed-cognitive-ui/src/model/types.ts:160 (SurfaceId)"
      - "the impeccable skill for UI polish; the building-sea-forge-workbench skill for SFWP/AG-UI conventions"
    steps:
