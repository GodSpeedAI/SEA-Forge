schema: agent.development_plan
schema_version: "1.0"

metadata:
  id: casework-live-wiring-production
  title: "Wire the SEA-Forge case management system to the GodSpeed front end (Go gateway + Cognitive UI) to production readiness"
  status: ready
  version: "0.2.0"
  approved: "2026-09-23 — operator approved D-1, D-2, D-3 recommendations and the OIDC/argon2 dependencies; Playwright replaced by agent-browser"
  created: "2026-09-23"
  purpose: >-
    Replace every fixture and local-adapter path between the browser and the SEA-Forge kernel with
    live, governed wiring. A browser user must be able to complete CJ01-CJ09 end to end: orient,
    discover, commit a case from a template, navigate, add discretionary work, execute, approve,
    settle, inspect evidence, and reopen. Every step must leave durable kernel truth
    (case-events.jsonl, ledgers) and be proven by a live agent-browser ladder. CJ10-CJ12 must work
    live or be honestly marked unavailable.

source:
  spec:
    path: .agents/specs/godspeed.casework-cognitive-environment-spec.yaml
    note: "Go gateway + React environment spec (SFWP Unix socket at L59, Gauntlet adapter at L57, frozen contract at L46-50)."
  implementation_brief:
    path: .agents/reports/2026-09-23-case-engine-frontend-e2e-journey-mapping.md
    note: >-
      Read Section 0 (Verification Errata) FIRST. The body of that report has wrong verb names, wire
      format, CLI commands, TraceKinds, Go ports and UI facts. This plan is based only on the verified facts.
  supporting_sources:
    - .agents/reports/interface-contracts/04-REACT-COGNITIVE-ENVIRONMENT-CONTRACT-SPECIFICATION.md
    - .agents/reports/interface-contracts/08-MISSING-SEAMS-AND-EXTENSIONS-CATALOG.md
    - .agents/reports/interface-contracts/typescript/types.ts
    - .agents/reports/godspeed-cognitive-ui-functional/02-JOURNEY-CUBE.md
    - .agents/plans/godspeed-casework-cognitive-environment.plan.yaml
    - .sea/interaction/interaction-model.sea

target_settlement: >-
  With sea-forge-server, the Go gateway and the production UI build running against a real cell,
  a clean Chromium session can execute the live ladder L0-L9 and L-RECOV. L0-L9 need no fixtures,
  no LocalContractAdapter and no devtools injection. Each ladder step's backend assertion is proven
  by reading the cell's durable state (case-events.jsonl, approvals.jsonl, ledgers). Two distinct
  authenticated browser users with different roles are attributed correctly in the ledger. SoD
  refusals, stale projections and daemon restarts are handled honestly in the UI.

operating_contract:
  core_principle: >-
    The kernel stays the only authority over case truth, meaning and settlement. The gateway
    translates and projects, and never decides. The UI requests, and never mutates truth locally.
    A UI step does not count as done until its effect is visible in the cell's durable state.
  rules:
    - "Additive only on the server wire (ADR-003): new capability arrives as new verb-tagged Request variants. Existing variants are never reshaped."
    - "The server stays zero-argument and env-configured. Do not add CLI flags to sea-forge-server."
    - "Identity is never trusted from the client. Any delegated-actor mechanism is an explicit, ADR-backed server change (T02)."
    - "Mirror the Rust Tauri bridge (workbench/apps/desktop/src-tauri/src/bridge.rs) for SFWP framing, request_id correlation and identity-error classes. Do not invent a second dialect."
    - "Execution standing and settlement standing stay disjoint in every layer."
    - "Fixture and local adapters stay only as test doubles. The production build must not be able to select them."
    - "Never use the TraceKind names from the report body. Use the real enum (crates/sea-forge-core/src/types.rs:501)."
  claim_states: [unverified, builder_verified, independently_confirmed, settled]
  correction_protocol: >-
    If a task finds that a verified fact in report Section 0 is wrong, stop. Record the correction in
    the decision log and in report Section 0, then re-plan the affected tasks before continuing.
  scope_control: >-
    In scope: CJ01-CJ09 live, plus honest availability for CJ10-CJ12. Out of scope until T13:
    federation export/import through the UI, memory promotion, live SXR discrepancy watching, and
    the Gauntlet executor. The classic Tauri workbench keeps working but is not the target surface.

artifacts:
  current_status: .agents/current_status.yml
  decision_log: .agents/reports/casework-live-wiring/decision-log.yaml
  evidence_root: .agents/evidence/casework-live-wiring/
  reports_root: .agents/reports/casework-live-wiring/
  preregistration_root: .agents/evidence/casework-live-wiring/prereg/
  status_rule: >-
    Update current_status only after a task's gates pass and the evidence has been written. Never
    mark a task settled on builder claims alone when its proof_level is P2 or P3.

verification:
  global_gates:
    - "cargo test -p sea-forge-server -p sea-forge-planner -p sea-forge-case-runner -p sea-forge-cli"
    - "cd apps/godspeed-casework-go && go vet ./... && go test -race ./..."
    - "cd apps/godspeed-cognitive-ui && bun run typecheck && bun test"
    - "cd apps/godspeed-cognitive-ui && bun e2e/run.ts   # existing local ladder must stay green (regression)"
    - "just casework-e2e-live   # added in T10; the settlement gate"
  gate_binding_rule: "A task is done only when its own gates and every global gate that existed before it are green."
  proof_levels:
    P0: "Compiles and type-checks."
    P1: "Unit or contract tests prove the claim in isolation."
    P2: "Integration test against a real sea-forge-server on a temp cell proves the durable effect."
    P3: "Live browser ladder plus a durable-state assertion plus independent confirmation."

