      required_verdict: "CONFIRM"

    redesign_trigger: >-
      The variation battery falsifies the frozen architecture rather than an
      implementation detail. Stop and surface the exact contradiction; do not
      weaken the test or silently revise the preregistration.

    evidence: ".agents/evidence/e2e/T12/"

    done_when:
      - "Every required variation class has direct evidence."
      - "All 35 explicit frozen requirements are CONFIRMED."
      - "Final open delta is empty."
      - "No open P0/P1 counterexample remains."
      - "Fresh independent final verifier returns CONFIRM."
      - "All global gates exit 0."

# -----------------------------------------------------------------------------
# FINAL ACCEPTANCE
# -----------------------------------------------------------------------------

final_acceptance:

  semantic_identity_and_envelopes:
    - "Every canonical envelope uses resolvable versioned DomainForge identity."
    - "No fallback pseudo-hash can masquerade as canonical identity."
    - "Causal parentage and work identity survive the full loop."
    - "Authoritative event ownership is enforced."
    - "CEP/schema conformance remains distinct from payload truth."

  runtime_topology:
    - "Every frozen E0-E10 edge, including E5A/E5B, exists through a production path."
    - "No required canonical edge is supplied only by gen-1/reference/mock/test-shim code."
    - "The deterministic golden scenario crosses the complete frozen topology."

  settlement_and_capability:
    - "Proof is distinct from operational settlement."
    - "Operational settlement is distinct from RealityTrace observation."
    - "EvidenceRecorded is provisional developmental evidence."
    - "Developmental settlement is independently earned."
    - "Capability promotion requires repeated settlement under declared relevant variation."

  authority_and_failure:
    - "Authority precedes governed side effects."
    - "Denied/escalated work cannot execute through the governed path."
    - "Failure, timeout, interruption, and partial execution remain causally visible."
    - "Late/cross-wired observations cannot settle against the wrong invocation."

  replay_recovery_and_memory:
    - "Duplicate/replayed events cannot duplicate side effect, settlement, capability, or developmental history."
    - "Restart/recovery preserves provenance."
    - "Developmental memory changes future navigation evidence."
    - "Historical success cannot override current governance, payment, or settlement gates."

  evidence_and_confirmation:
    - "Every REQUIRED normative spec requirement maps to at least one settled task/evidence record."
    - "Every P3 task has the required fresh independent confirmation."
    - "Failed/correction evidence has not been erased."
    - "Documentation/status claims do not exceed observed proof."
    - "All global gates exit 0."
    - "The final delta contains zero open P0/P1 requirements."
    - "A fresh final independent verifier returns CONFIRM."

# -----------------------------------------------------------------------------
# GUARDRAILS
# -----------------------------------------------------------------------------

guardrails:
  - "Do not modify .agents/specs/e2e-preregistration.yml during implementation."
  - "Do not redefine the target to match current code."
  - "Do not make project-topology-architect or NeatCode independent canonical runtime components."
  - "Do not collapse ProofCompleted, OperationalSettlement, EvidenceRecorded, SettlementRecorded, or CapabilityUpdated."
  - "Do not allow a namespace-derived, constant, placeholder, or fallback hash to stand in for canonical DomainForge model identity."
  - "Do not let Context Kernel acquire execution-authority ownership."
  - "Do not let the execution environment self-assert SEA-Forge authority."
  - "Do not let RealityTrace acquire developmental-settlement authority."
  - "Do not let Memory Ledger acquire navigation or governance authority."
  - "Do not duplicate source facts downstream when immutable references can preserve provenance."
  - "Do not count synthetic/gen-1/mock paths as production confirmation."
  - "Do not build one giant E2E test as a substitute for closing individual edge contracts."
  - "Do not mock away the component boundary currently being proven."
  - "Preserve pre-existing user work and dirty repository state."
  - "Do not clean/reset/rewrite unrelated repositories to make gates pass."
  - "A newly discovered architectural improvement outside the frozen requirements becomes future debt, not current scope."

# -----------------------------------------------------------------------------
# HANDOFF CONTRACT
# -----------------------------------------------------------------------------

handoff_contract:
  must_report:
    - "settled capabilities/requirements"
    - "explicitly unsettled or deferred items"
    - "current operational system state"
    - "requirement-to-evidence index"
    - "known limitations"
    - "rollback/recovery instructions where relevant"
    - "important decisions/discoveries that changed the execution model"
    - "current delta by requirement ID and verdict"
    - "which previously settled tasks, if any, were legitimately reopened and why"
    - "exact next executable action or 'none — plan settled'"

  settled_next_action_rule: >-
    The next executable action MUST be set to `none — plan settled` only after
    T12 receives fresh independent CONFIRM, all global gates pass, and the final
    frozen P0/P1 delta is empty.

