# =============================================================================
# GODSPEED CANONICAL RUNTIME CONVERGENCE PLAN
# =============================================================================

schema: agent.development_plan
schema_version: "1.0"

metadata:
  id: "godspeed-e2e-convergence"
  title: "GodSpeed Canonical Runtime Convergence"
  status: "ready"
  version: "0.1.0"
  created: "2026-08-24"

  purpose: >-
    Project the frozen GodSpeed canonical-runtime preregistration into an
    executable settlement graph. The plan progressively removes the delta
    between the implemented stack and the frozen black-box runtime contract
    until every required edge and invariant is confirmed under production-path,
    adversarial, recovery, and end-to-end evidence.

# -----------------------------------------------------------------------------
# SOURCE AUTHORITY
# -----------------------------------------------------------------------------

source:
  spec:
    intended_repository_path: ".agents/specs/e2e-preregistration.yml"
    artifact_name: "e2e-preregistration.yml"
    spec_id: "godspeed-canonical-runtime-convergence"
    spec_version: "0.1.0"
    sha256: "ef5710893c5bcc569a4757371c54d4d2e5e6168e1df61d2d7433b6889eaa879f"
    authority: normative

  implementation_brief:
    intended_repository_path: ".agents/reports/godspeed-runtime-integration-e2e-recon.md"
    authority: non_normative_execution_context
    conflict_rule: >-
      The frozen preregistration governs. The reconnaissance report describes
      observed current state only. Any conflict MUST be surfaced as a blocked
      decision rather than silently resolved in favor of current implementation.

  supporting_sources:
    - path: "DomainForge canonical/current semantic sources discovered during T00"
      role: >-
        Establish the concrete semantic source and identity mechanism without
        overriding the frozen runtime contract.

    - path: "Existing repository-local architecture documents and tests"
      role: >-
        Supply implementation context, existing gates, and evidence. They do not
        override the preregistration.

# -----------------------------------------------------------------------------
# TARGET SETTLEMENT
# -----------------------------------------------------------------------------

target_settlement: >-
  One deterministic GodSpeed work cycle can begin with a desired direction,
  become a spendable work request, acquire cited context, enter SEA-Forge as
  semantically governed work, execute only under valid authority, return an
  operational settlement, receive independent SWE_SEED proof, become a
  RealityTrace expected-versus-observed evidence record, undergo independent
  GodSpeed-Agent developmental settlement, persist into developmental memory,
  and alter the evidence available to the next navigation cycle. One stable
  work-request identity and one resolvable DomainForge model identity survive
  the entire loop. Proof, operational settlement, observation, developmental
  settlement, and capability remain distinct. The loop survives declared
  failure, replay, interruption, semantic-identity corruption, and recovery
  cases without false settlement or provenance loss.

# -----------------------------------------------------------------------------
# OPERATING CONTRACT
# -----------------------------------------------------------------------------

operating_contract:
  core_principle: >-
    Implement only the smallest currently open delta against the frozen
    black-box contract. A component's internals MAY change, but no local repair
    may weaken, reinterpret, bypass, or silently collapse a frozen edge,
    identity, authority, evidence, proof, settlement, or capability distinction.

  rules:
    - "Execute tasks by dependency, not by narrative order."
    - "Independent tasks MAY run in parallel only after all declared dependencies are settled."
    - "Every task MUST leave the affected repositories coherent with all applicable global gates green."
    - "A task is not complete because code exists, a process starts once, the builder reports success, or a happy-path test passes."
    - "A passing gate proves only what that gate actually observes."
    - "High-risk P3 work requires fresh independent/adversarial confirmation."
    - "Do not generalize from one observation unless the normative requirement is itself general."
    - "Do not silently widen domain, schema, API, config, service, or authority surfaces when an existing representation can preserve the required distinction."
    - "Runtime/machine/provider-specific facts belong in established config/secret hierarchy rather than scattered hardcoding."
    - "Preserve failed evidence and correction history."
    - "Existing production behavior MAY settle a task without code changes when it already satisfies the task's complete closure contract."
    - "Legacy/gen-1, synthetic, mock-only, dynamically loaded, or test-shim paths may inform implementation but MUST NOT settle a production edge."
    - "Once a requirement is CONFIRMED it becomes a fixed constraint for later tasks unless a new falsifier legitimately reopens it."
    - "Do not reopen settled semantics because a later agent prefers a different implementation."
    - "Never manufacture a missing production edge inside an E2E test and count the resulting test as proof that the production edge exists."
    - "ProofCompleted, OperationalSettlement, EvidenceRecorded, SettlementRecorded, and CapabilityUpdated remain semantically distinct."
    - "Domain identity MUST resolve to the actual canonical semantic model; fallback pseudo-identities are forbidden."

  claim_states:
    - OBSERVED
    - INFERRED
    - DECIDED
    - ASSUMED
    - UNKNOWN

  correction_protocol:
    - "Preserve the failed evidence."
    - "Classify the failure: implementation, oracle/test, representation, missing prerequisite, environmental confound, or source-spec ambiguity."
    - "Determine whether the governing requirement/invariant remains valid."
    - "Correct the smallest falsified layer."
    - "Rerun the original teeth/falsification check."
    - "Rerun the original confirmation path."
    - "Append the correction round; do not erase the failed round."
    - "Do not weaken acceptance merely because the implementation repeatedly fails it."

  scope_control: >-
    A newly discovered issue enters the current plan only when it blocks a
    frozen requirement or is itself required to preserve that requirement.
    Valuable independent discoveries become future debt/plans. Attractive
    architecture with no frozen requirement is rejected from current scope.

  delta_control: >-
    T00 establishes Delta-0 as every frozen edge or invariant not CONFIRMED by
    sufficient existing production evidence. Subsequent tasks work only on open
    delta. After each confirmed task, recompute the open delta. The search space
    may expand only when new evidence falsifies a previous confirmation or
    exposes a prerequisite required by the frozen specification.

# -----------------------------------------------------------------------------
# PLAN-STATE AND EVIDENCE ARTIFACTS
# -----------------------------------------------------------------------------

artifacts:
  current_status: ".agents/status/e2e-current-status.yml"
  decision_log: ".agents/reports/e2e/decision-log.yml"

  evidence_root: ".agents/evidence/e2e"
  reports_root: ".agents/reports/e2e"
  preregistration_root: ".agents/preregistrations/e2e"

  status_rule: >-
    Mutable current status is an operational projection and MUST NOT become a
    source of desired-state or normative authority.

  evidence_preservation_rule: >-
    Each confirmation, failed confirmation, attack, correction, and
    reconfirmation receives a distinct append-only evidence artifact. Never
    overwrite failed rounds with later success.

# -----------------------------------------------------------------------------
# VERIFICATION MODEL
# -----------------------------------------------------------------------------

verification:
  global_gates:
    - id: "PREREG"
      command: "just e2e-prereg-check"

    - id: "CHECK"
      command: "just e2e-check"

    - id: "TEST"
      command: "just e2e-test"

    - id: "LINT"
      command: "just e2e-lint"

    - id: "DELTA"
      command: "just e2e-delta-check"

  gate_binding_rule: >-
    T00 SHALL bind these stable SEA-Forge-root aliases to the real existing
    repository-local gates. The aliases orchestrate existing checks rather than
    duplicating their test logic or creating competing sources of truth. A
    repository that already exposes an appropriate gate MUST be called through
    that gate.

  task_gate_contract: >-
    `just e2e-gate <TASK_ID>` is the stable narrow-task entry point. T00 SHALL
    bind it to the smallest existing or newly added test target that observes
    the task's frozen contract.

  proof_levels:
    P0: >-
      Mechanical/deterministic change. Requires a narrow direct gate plus
      applicable global gates.

    P1: >-
      Normal behavioral work. Requires positive behavior, a meaningful
      teeth/falsification check, and applicable global gates.

    P2: >-
      Invariant-sensitive work. Requires an explicit/preregistered claim,
      meaningful adversarial/negative evidence, an evidence artifact,
      applicable global gates, and review of a plausible alternate failure path.

    P3: >-
      Settlement-critical work. Requires frozen preregistration, builder
      evidence, explicit adversarial attacks, fresh independent confirmation,
      and correction/re-confirmation after any failed confirmation.

