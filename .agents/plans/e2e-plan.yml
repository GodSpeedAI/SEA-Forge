    proves: >-
      Side effects cannot legally occur before applicable SEA-Forge authority,
      the execution environment cannot self-authorize, and observations can
      settle only against the exact authorized invocation that produced them.

    does_not_prove: >-
      The resulting execution satisfies its operational settlement criteria or proof.

