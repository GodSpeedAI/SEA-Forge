# =============================================================================
# TASK CONTRACTS
# =============================================================================

tasks:

  # ---------------------------------------------------------------------------
  # T00 — BASELINE
  # ---------------------------------------------------------------------------

  T00:
    title: "Establish Delta-0 and Verification Surface"
    initial_status: ready
    depends_on: []

    proof_level: P1
    confirmation: builder_with_teeth
    settles: []

    changes: >-
      Creates the reproducible current-state projection, requirement/evidence
      matrix, stable cross-repository gate aliases, and initial open-delta set.
      It changes no canonical runtime behavior.

    proves: >-
      Every frozen requirement has been classified against direct current
      production evidence as CONFIRMED, PARTIAL, ABSENT, CONTRADICTED, or
      UNKNOWN, and the resulting Delta-0 can be mechanically recomputed.

    does_not_prove: >-
      No runtime edge or semantic invariant becomes true merely because it was
      discovered, classified, or represented in the status artifact.

    hot_context:
      - ".agents/specs/e2e-preregistration.yml"
      - ".agents/reports/godspeed-runtime-integration-e2e-recon.md"
      - "All existing repository-local test/build/lint recipes before creating aliases"
      - "Record repository HEADs and pre-existing dirty state; never reset user work"

    steps:
      - "Verify the preregistration SHA-256 equals source.spec.sha256 in this plan."
      - "Parse all 35 explicit frozen requirement IDs: ENV-I1..ENV-I8, E0..E10 including E5A/E5B, and I1..I15."
      - "Record repo HEADs and pre-existing dirty/untracked state relevant to the stack."
      - "Inspect existing production-path evidence for every requirement; do not trust prior verdicts without source evidence."
      - "Initialize .agents/status/e2e-current-status.yml with one verdict and evidence reference per frozen requirement."
      - "Mark a requirement CONFIRMED only when its closure requirements are already met; otherwise preserve the specific open delta."
      - "Bind just e2e-prereg-check, e2e-check, e2e-test, e2e-lint, e2e-delta-check, and e2e-gate <TASK_ID> to real underlying gates without duplicating test logic."
      - "Emit Delta-0 and a requirement-to-current-evidence index."
      - "If an entire downstream task is already settled by qualifying existing evidence, record settled_by_baseline in current status rather than rewriting the implementation."

    gate:
      - "just e2e-prereg-check"
      - "just e2e-delta-check"

    teeth:
      - attack: "Remove one frozen requirement from the current-status/evidence mapping."
        expected: "e2e-delta-check fails with the unmapped requirement."

      - attack: "Offer only a gen-1, synthetic, mock-only, or test-shim path as evidence for a production edge."
        expected: "The edge cannot receive CONFIRMED."

    redesign_trigger: >-
      The frozen source cannot be parsed into the expected 35 stable requirement
      IDs, or its actual repository contents differ materially from the
      preregistration on which this plan was authored. Stop and reconcile the
      source specification before implementation.

    evidence: ".agents/evidence/e2e/T00/"

    done_when:
      - "All 35 explicit requirements have exactly one current verdict."
      - "Delta-0 is mechanically reproducible."
      - "Existing settled behavior has not been needlessly reimplemented."
      - "Stable global and per-task gate aliases resolve."
      - "No runtime implementation was changed merely to make the baseline cleaner."
      - "All applicable global gates remain green."

  # ---------------------------------------------------------------------------
  # T01 — SEMANTIC IDENTITY / ENVELOPE FOUNDATION
  # ---------------------------------------------------------------------------

  T01:
    title: "Settle Canonical Semantic Envelope and Domain Identity"
    initial_status: blocked
    depends_on: ["T00"]

    proof_level: P3
    confirmation: independent_adversarial

    settles:
      - "ENV-I1"
      - "ENV-I2"
      - "ENV-I3"
      - "ENV-I4"
      - "ENV-I5"
      - "ENV-I6"
      - "ENV-I7"
      - "ENV-I8"
      - "I1"
      - "I3"
      - "I13"

    changes: >-
      Establishes the interoperable canonical envelope/validation contract used
      at cross-component boundaries, resolvable DomainForge model identity,
      causal-parent representation, idempotent envelope identity, and exclusive
      event-producer ownership.

    proves: >-
      A canonical envelope cannot masquerade as semantically grounded when its
      DomainForge model is missing or wrong; causal identity and event ownership
      are machine-observable; CEP/schema conformance is not interpreted as truth.

    does_not_prove: >-
      Individual runtime edges use the envelope correctly, or that the complete
      causal chain composes end to end.

    preregistration:
      required: true
      artifact: ".agents/specs/e2e-preregistration.yml"
      claims:
        - "Canonical domain identity resolves to the actual versioned semantic model."
        - "Fallback pseudo-hashes cannot settle as valid domain identity."
        - "Canonical event types have exclusive authoritative producers."
        - "Envelope conformance is distinct from payload truth."
      falsifiers:
        - "A missing model produces an apparently valid canonical domain hash."
        - "A wrong producer can emit another component's authoritative event and pass validation."
        - "A derived envelope loses required causal-parent identity."
        - "CEP/schema success alone causes an enclosed claim to be accepted as true."
      known_confounds:
        - "A legacy envelope schema may be valid for an excluded/reference path but not satisfy the frozen production contract."
      confirmation_condition: >-
        Fresh independent reviewer can forge each targeted identity/ownership
        failure only to have it rejected or quarantined, while valid production
        envelopes retain resolvable identity and causality.

    hot_context:
      - "Current CEP semantic-envelope schema"
      - "SWE_SEED federation envelope implementation"
      - "Context Kernel agentic-capability-loop envelope implementation"
      - "GodSpeed-Agent agentic-capability-loop adapters"
      - "SEA-Forge semantic-envelope and DomainForge integration"
      - "RealityTrace CEP export / DomainForge binding"
      - "Authoritative .sea model and current domain-model hash derivation"

    steps:
      - "Select/reuse the smallest existing canonical representation capable of preserving the frozen envelope contract; do not create parallel envelope families without necessity."
      - "Replace or gate any fallback domain-model identity that can masquerade as canonical identity."
      - "Bind model namespace, version, and hash to a resolvable canonical DomainForge artifact/serialization."
      - "Pin authoritative producer ownership for canonical event types."
      - "Provide causal-parent and idempotent-envelope semantics required by the preregistration."
      - "Ensure conformance validation and truth/settlement evaluation remain separate."
      - "Add contract tests and adversarial fixtures usable by all later edge tests."

    gate:
      - "just e2e-gate T01"

    teeth:
      - attack: "Remove the canonical DomainForge model and attempt to emit/consume an envelope using fallback identity."
        expected: "Reject or quarantine; no canonical identity is manufactured."

      - attack: "Forge EvidenceRecorded from a producer other than RealityTrace."
        expected: "Exclusive event-authority validation rejects it."

      - attack: "Provide a structurally conformant envelope containing a deliberately false payload claim."
        expected: "Conformance may pass, but no truth/settlement consequence follows merely from conformance."

    independent_confirmation:
      verifier_receives:
        - "Frozen ENV-I1..ENV-I8, I1, I3, I13 requirements"
        - "Relevant canonical envelope/domain identity implementation"
        - "Builder evidence and adversarial fixtures"
        - "Exact question: can identity, causality, producer authority, or truth/conformance still collapse?"
      verifier_should_not_receive:
        - "Builder's claimed verdict before independent attack design"
      required_verdict: "CONFIRM"

    redesign_trigger: >-
      Existing envelope families cannot preserve the frozen contract without
      semantic ambiguity, or there is no unique authoritative DomainForge model
      capable of supplying canonical runtime identity. Stop rather than hiding
      the conflict behind adapters.

    evidence: ".agents/evidence/e2e/T01/"

    done_when:
      - "ENV-I1..ENV-I8, I1, I3, and I13 satisfy their frozen contracts."
      - "Fallback pseudo-identity cannot pass as canonical."
      - "Adversarial producer and causal-parent forgeries fail."
      - "Fresh independent confirmation returns CONFIRM."
      - "All applicable global gates remain green."

  # ---------------------------------------------------------------------------
  # T02 — SWE_SEED <-> CONTEXT KERNEL
  # ---------------------------------------------------------------------------

  T02:
    title: "Settle Cited Context Integration"
    initial_status: blocked
    depends_on: ["T01"]

    proof_level: P2
    confirmation: independent_if_needed

    settles:
      - "E2"
      - "E3"
      - "I4"

    changes: >-
      Makes the existing SWE_SEED-to-Context-Kernel production slice conform to
      the frozen ContextRequired and ContextPacketCreated contracts, including
      correlation, citations, provenance, domain identity, and explicit
      authority non-ownership.

    proves: >-
      Required context can be requested and returned through the production path
      with valid citations, while missing/invalid context cannot silently settle
      as successful acquisition and Context Kernel cannot create execution authority.

    does_not_prove: >-
      The resulting work request can yet enter SEA-Forge or execute.

    preregistration:
      required: true
      artifact: ".agents/specs/e2e-preregistration.yml"
      claim: >-
        E2/E3 preserve work identity and cited evidence while keeping Context
        Kernel outside the execution-authority role.
      falsifier: >-
        Required context returns successful zero-citation context, loses work
        correlation/domain identity, or creates authority.
      known_confounds:
        - "Optional-context behavior must not be confused with required-context behavior."
      confirmation_condition: >-
        Production-path context retrieval succeeds with citations and all
        declared negative cases fail closed or produce explicit governed outcomes.

    hot_context:
      - "SWE_SEED ContextConfig and MCP stdio client"
      - "Context_Kernel ck-mcp context_required dispatch"
      - "AclContextAgent.handle_context_required"
      - "Existing SWE_SEED and Context Kernel integration tests"

    steps:
      - "Reuse the real production MCP path."
      - "Bring E2 request shape under the canonical envelope/correlation contract."
      - "Bring E3 response shape under the canonical envelope/citation/provenance contract."
      - "Make required-context absence explicit rather than silent successful emptiness."
      - "Pin authority-reference pass-through without authority creation."

    gate:
      - "just e2e-gate T02"

    teeth:
      - attack: "Unset or misconfigure required corpus root and request mandatory context."
        expected: "No successful zero-citation settlement; fail or return explicit governed no-context result."

      - attack: "Return context for a different work_request_id/context_requirement_id."
        expected: "Consumer rejects the cross-wired packet."

      - attack: "Inject an authority decision originating from Context Kernel."
        expected: "It cannot become execution authority."

    redesign_trigger: >-
      The production Context Kernel boundary cannot distinguish required versus
      optional context without changing frozen semantics, or authority and
      retrieval are inseparably coupled.

    evidence: ".agents/evidence/e2e/T02/"

    done_when:
      - "E2, E3, and I4 are CONFIRMED."
      - "Required context has cited provenance."
      - "Zero-citation false success is closed."
      - "All applicable global gates remain green."

  # ---------------------------------------------------------------------------
  # T03 — GSA -> SWE_SEED
  # ---------------------------------------------------------------------------

  T03:
    title: "Settle Navigation Ingress and Work Contract"
    initial_status: blocked
    depends_on: ["T01"]

    proof_level: P2
    confirmation: builder_with_teeth

    settles:
      - "E0"
      - "E1"

    changes: >-
      Establishes the production boundary by which a desired direction is
      evaluated by GodSpeed-Agent and a selected spendable affordance becomes a
      SWE_SEED WorkRequested contract.

    proves: >-
      The runtime begins from direction plus current constraints and hands
      SWE_SEED a path with affordance identity, desired outcome, settlement
      criteria, and canonical domain identity rather than an ungrounded destination.

    does_not_prove: >-
      Context acquisition, SEA-Forge governance, execution, or downstream settlement.

    preregistration:
      required: true
      artifact: ".agents/specs/e2e-preregistration.yml"
      claim: >-
        E0/E1 convert direction into an explicit spendable work contract without
        conflating desired destination with affordance.
      falsifier: >-
        A bare destination with no selected path/settlement criteria can enter
        SWE_SEED as a canonical WorkRequested event.
      known_confounds:
        - "An explicitly human-selected affordance is valid if GSA records the selection and contract."
      confirmation_condition: >-
        Production-path WorkRequested events contain the frozen required
        semantics and reject incomplete/cross-wired inputs.

    hot_context:
      - "godspeed-nav desired-direction / affordance selection surfaces"
      - "GodSpeed-Agent MCP cybernetic_nav tools"
      - "SWE_SEED route/work-contract entry surfaces"

    steps:
      - "Identify the least invasive existing GSA affordance-selection output suitable for E1."
      - "Project selected affordance into WorkRequested using the canonical envelope."
      - "Preserve work_request_id, affordance_id, desired outcome, settlement criteria, and domain identity."
      - "Reject or explicitly block destination-only inputs lacking an executable selected path."

    gate:
      - "just e2e-gate T03"

    teeth:
      - attack: "Submit a desired outcome with no affordance/path or settlement criteria and attempt canonical handoff."
        expected: "No canonical WorkRequested event is emitted."

      - attack: "Cross-wire the selected affordance to a different domain-model identity."
        expected: "Reject or quarantine before SWE_SEED accepts the contract."

    redesign_trigger: >-
      GodSpeed-Agent currently has no semantic surface corresponding to selected
      affordance/work request and adding one would require redefining its frozen
      developmental responsibility rather than merely projecting existing state.

    evidence: ".agents/evidence/e2e/T03/"

    done_when:
      - "E0 and E1 are CONFIRMED."
      - "A canonical work request represents a path rather than a destination."
      - "All applicable global gates remain green."

  # ---------------------------------------------------------------------------
  # T04 — SWE_SEED -> SEA-FORGE
  # ---------------------------------------------------------------------------

  T04:
    title: "Settle Governed Work Submission"
    initial_status: blocked
    depends_on: ["T02", "T03"]

    proof_level: P3
    confirmation: independent_adversarial

    settles:
      - "E4"

    changes: >-
      Creates or completes the production SWE_SEED-to-SEA-Forge
      GovernedWorkRequest boundary using the selected affordance, cited context,
      proof contract, settlement criteria, actor, and canonical semantic identity.

    proves: >-
      SEA-Forge receives semantically grounded work under the same canonical
      domain identity as upstream navigation/context and receives a distinct
      proof obligation and operational settlement obligation.

    does_not_prove: >-
      SEA-Forge correctly authorizes side effects or returns correct operational settlement.

    preregistration:
      required: true
      artifact: ".agents/specs/e2e-preregistration.yml"
      claims:
        - "E4 carries semantic work intent rather than an opaque command only."
        - "E4 binds context, proof, settlement criteria, actor, affordance, and domain identity."
      falsifiers:
        - "An opaque command with no semantic contract passes as GovernedWorkRequest."
        - "A context packet from another work request is accepted."
        - "SEA-Forge evaluates against a different model identity than E4 declares."
      known_confounds:
        - "Internal SEA-Forge planning representation is not frozen."
      confirmation_condition: >-
        Fresh independent verifier cannot cross-wire work, context, or domain
        identity and still obtain an accepted governed request.

    hot_context:
      - "SWE_SEED route/proof/context structures"
      - "SEA-Forge CLI/server request ingress"
      - "SEA-Forge DomainForge authority-evaluation boundary"
      - "Existing SWE_SEED declaration reconciliation in SEA-Forge"

    steps:
      - "Prefer an existing SEA-Forge ingress surface and extend/project only what the frozen E4 contract requires."
      - "Carry upstream WorkRequested and ContextPacket references into the governed request."
      - "Preserve proof_contract separately from settlement_criteria."
      - "Bind the same canonical DomainModelRef used upstream."
      - "Add positive and cross-wire/semantic-identity integration tests through the real production boundary."

    gate:
      - "just e2e-gate T04"

    teeth:
      - attack: "Send a request containing only executable argv/command without required semantic intent."
        expected: "It cannot settle as a canonical GovernedWorkRequest."

      - attack: "Attach a valid ContextPacketCreated from another work_request_id."
        expected: "Reject the cross-wire."

      - attack: "Reference a valid but different DomainForge model."
        expected: "Reject or quarantine before governed execution."

    independent_confirmation:
      verifier_receives:
        - "Frozen E4 contract"
        - "SWE_SEED producer implementation"
        - "SEA-Forge consumer implementation"
        - "Builder evidence"
      verifier_should_not_receive:
        - "Builder's preferred implementation rationale"
      required_verdict: "CONFIRM"

    redesign_trigger: >-
      SEA-Forge cannot accept semantic work without converting SWE_SEED into an
      internal SEA-Forge implementation detail or otherwise violating black-box
      ownership.

    evidence: ".agents/evidence/e2e/T04/"

    done_when:
      - "E4 is CONFIRMED through the production boundary."
      - "Cross-wired context/domain inputs fail."
      - "Fresh independent confirmation returns CONFIRM."
      - "All applicable global gates remain green."

  # ---------------------------------------------------------------------------
  # T05 — SEA-FORGE <-> REALITY
  # ---------------------------------------------------------------------------

  T05:
    title: "Settle Governed Contact With Reality"
    initial_status: blocked
    depends_on: ["T04"]

    proof_level: P3
