      required: true
      artifact: ".agents/specs/e2e-preregistration.yml"
      claims:
        - "Authority precedes governed side effect."
        - "Execution observations remain bound to the authorized invocation."
      falsifiers:
        - "A denied/escalated invocation produces the governed side effect."
        - "A late observation from invocation A settles invocation B."
        - "Execution self-supplies a fabricated authority decision."
      known_confounds:
        - "External systems may have independent side effects outside SEA-Forge governance; only the governed path is in scope."
      confirmation_condition: >-
        Fresh attacks cannot cause unauthorized or cross-wired execution to
        settle as valid governed execution.

