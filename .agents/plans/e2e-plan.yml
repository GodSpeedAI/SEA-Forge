# =============================================================================
# PLAN AUTHORING / VALIDATION CHECKLIST
# =============================================================================
#
# Before changing metadata.status from draft to ready:
#
# SOURCE / AUTHORITY
# [ ] Bind source.spec.sha256 to the actual frozen file.
# [ ] Verify spec ID/version.
# [ ] Verify the explicit requirement count is still 35.
# [ ] Confirm the reconnaissance report remains non-normative.
#
# COVERAGE
# [ ] e2e-delta-check reports zero unmapped frozen IDs.
# [ ] No task references a nonexistent requirement.
#
# DAG
# [ ] T02 and T03 remain parallel unless actual evidence establishes a new prerequisite.
# [ ] T04 remains the join of navigation/work-contract and cited-context paths.
# [ ] No dependency cycle exists.
#
# TASK QUALITY
# [ ] Each P3 task uses the frozen preregistration and fresh independent confirmation.
# [ ] Existing production evidence may settle already-correct behavior without rewriting it.
# [ ] Each task has a direct falsifier for its most dangerous false-success mode.
#
# EVIDENCE
# [ ] Failure/correction rounds are append-only.
# [ ] A CONFIRMED requirement has direct evidence sufficient for its own claim.
# [ ] Synthetic/reference paths cannot produce production confirmation.
#
# FINAL SETTLEMENT
# [ ] T11 contains no test-only semantic bridge.
# [ ] T12 exercises every frozen variation class.
# [ ] Final P0/P1 delta is empty.
# [ ] Fresh independent final verdict is CONFIRM.
# [ ] All global gates are green.
#
# =============================================================================