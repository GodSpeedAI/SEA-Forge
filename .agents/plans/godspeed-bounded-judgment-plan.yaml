      required_verdict: CONFIRM
    gate:
      - python3 .agents/evidence/godspeed-bounded-judgment/T29/verify_breadth.py
    teeth:
      - {attack: Fabricate a detection record without a pinned real probe DB., expected: Mechanism-provenance validation refuses; no route credit.}
      - {attack: Hand-assign the d* boundary or the negative label instead of deriving it from terminals and artifacts., expected: Gate recomputation from pinned DBs refuses; labels are read, never assigned.}
      - {attack: Let the optional learned observer label alter retention or settlement., expected: REJECTED; the observer is recorded as observational evidence only.}
    redesign_trigger: >-
      If the frozen detection rule cannot separate the forged family from the
      honest and lying families on real probes, stop and record the falsified
      layer with preserved evidence; do not weaken or redefine the rule
      post hoc.
