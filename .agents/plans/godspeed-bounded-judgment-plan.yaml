target_settlement: A bounded learned inference can be issued over an explicitly declared answer domain and a bounded context through the existing GodSpeed execution architecture; the result preserves uncertainty
  or abstention and provenance where applicable; deterministic, versioned composition remains outside the model; model or provider output cannot acquire authority; the inference can be correlated through
  execution to observed consequence and settlement; the same stable semantic contract can be exercised through materially independent provider paths; target-machine operation fails safely; and every claim
  remains within its actual evidence level.
explicit_non_requirements: This target does NOT require external bounded-judgment service access, comparable model quality to any external service, population calibration, model training, .sea grammar changes,
  a new Judgment service, a new database, a new ledger, or production multi-tenancy.
operating_contract:
  core_principle: Evidence that a judgment is POSSIBLE is not evidence that a judgment is USEFUL. This plan therefore settles measurability first (PROOF-1) and capability second, and it MUST NOT build the
    capability before the measurement that would justify it.
  rules:
  - Execute tasks by dependency, not by narrative order.
  - Independent tasks MAY be assigned concurrently only after all declared dependencies are settled; on this RAM-constrained workstation, builds, tests, type checks, daemons, and other heavy commands MUST
    run one at a time.
  - Never run the full daemon suite. Use the exact scoped task gates, then the exact closure gates named by the task; do not substitute pnpm, raw Cargo, or ad-hoc commands for repository recipes.
  - Every task MUST leave the repository in a coherent state with all applicable global gates green.
  - A task is not complete because code exists, a process starts once, the builder reports success, or a happy-path test passes.
  - A passing gate proves only what that gate actually observes.
  - High-risk P3 work requires fresh independent/adversarial confirmation.
  - Do not generalize from one observation unless the normative requirement is itself general.
  - Do not silently widen domain, schema, API, config, service, or authority surfaces when an existing representation can preserve the required distinction.
  - Runtime, machine and provider facts belong in the established config/secret hierarchy rather than scattered hardcoding.
  - Preserve failed evidence and correction history.
  - A negative measurement result on one DecisionSurface is a result about THAT SURFACE and MUST NOT be reported as a capability-class conclusion (spec REQ-JUDG-023).
  - The first corpus measurement is a PILOT MEASUREMENT. Reserved terms (calibrated probability, calibration curve, production threshold, population reliability, model generalization) MUST NOT be used for
    it (spec REQ-VERIFY-012).
  - Reuse proven on one judgment family MUST NOT be restated as universality (spec NONGOAL-008).
  - 'Every claim MUST name its level where the spec defines levels: comparability A/B/C (spec CLAIM-006) and scope of falsification surface/task_family/capability_class (spec REQ-JUDG-023).'
  task_local_harness_rule: 'A Python gate under a task evidence directory is task-owned executable evidence, not a pre-existing repository utility. The task MUST author it at the path named by the gate
    before first execution, record its sha256 in that task''s evidence manifest, and never overwrite a script or output after execution. A correction uses round-2+ paths. T00 is the sole exception: its
    plan validator is checked in under `.agents/plans/` before execution and T00 records the checked-in validator''s sha256.'
  claim_states:
  - OBSERVED
  - INFERRED
  - DECIDED
  - ASSUMED
  - UNKNOWN
  correction_protocol:
  - Preserve the failed evidence.
  - 'Classify the failure: implementation, oracle/test, representation, missing prerequisite, environmental confound, or source-spec ambiguity.'
  - Determine whether the governing requirement/invariant remains valid.
  - Correct the smallest falsified layer.
  - Rerun the original teeth/falsification check.
  - Rerun the original confirmation path.
  - Append the correction round; do not erase the failed round.
  - Do not weaken acceptance merely because the implementation repeatedly fails it.
  scope_control: 'A newly discovered issue enters this plan only when it blocks a normative requirement or is itself required by the source specification. Valuable but independent discoveries become OBSERVED_DEBT.
    Attractive architecture with no requirement is rejected from current scope. In particular: no observability platform, no message broker, no new ledger, no vLLM/llama.cpp change, and no training infrastructure
    may be added because it exists elsewhere in the stack.'
artifacts:
  current_status: .agents/current_status.yml
  decision_log: .agents/evidence/godspeed-bounded-judgment/decisions.yml
  evidence_root: .agents/evidence/godspeed-bounded-judgment
  reports_root: .agents/reports
  preregistration_root: .agents/preregistrations
  plan_validator: .agents/plans/validate-godspeed-bounded-judgment-plan.py
  convention_notes:
    current_status: Reuses the repository's existing repo-level current-status artifact rather than introducing a second status surface. Mutable execution truth lives there and MUST NOT become a source
      of desired-state or normative authority.
    evidence: Follows the existing .agents/evidence/<plan-id>/ convention (already used by .agents/evidence/e2e/ and .agents/evidence/bootstrap-config-remediation/).
    preregistrations: NEW convention introduced by this plan. The repository has exactly one frozen preregistration (.agents/specs/e2e-preregistration.yml) and no per-task prereg convention. Per-task preregistrations
      are placed under .agents/preregistrations/ so that normative specs (`.agents/specs/`) stay free of derived execution material.
    decision_log: NEW append-only artifact under the plan's evidence root. Records decisions and discoveries that change the execution model. Never rewritten, only appended.
  status_rule: Mutable current status is an operational projection and MUST NOT become a source of desired-state or normative authority. Readiness is computed from `depends_on` plus settled tasks plus blocked
    dependencies, never from prose.
  failure_preservation_rule: Failed rounds remain present in the evidence tree. Correction rounds APPEND as `round-2`, `round-3`, ... . No evidence file is overwritten or deleted.
verification:
  global_gates:
  - id: SEA_CHECK
    repository: sea-rs
    working_directory: .
    command: just check
    covers: context-check + fmt-check + lint + typecheck + security
    baseline_status: EXPECTED_GREEN
  - id: SEA_TEST
    repository: sea-rs
    working_directory: .
    command: just test
    covers: cargo test --workspace --all-features --locked
    baseline_status: PREEXISTING_BASELINE_FAILURE_SUSPECTED
    baseline_note: .agents/CURRENT_STATUS.md (2026-08-31) records that the sea-forge-server suite reaches an unrelated failing test. T00 MUST confirm or refute this against the current revision and record
      the exact failing test id(s) as PREEXISTING_BASELINE_FAILURE before any task may claim a regression.
  - id: SEA_CI
    repository: sea-rs
    working_directory: .
    command: just ci
    covers: context-check + fmt-check + lint + typecheck + security + test + no-async-kernel + build
    baseline_status: DEPENDS_ON_SEA_TEST
    baseline_note: Inherits SEA_TEST's baseline state. If SEA_TEST is red at baseline, SEA_CI is red at baseline for the same reason and the plan MUST NOT claim a plan regression.
  - id: SEA_NO_ASYNC_KERNEL
    repository: sea-rs
    working_directory: .
    command: just no-async-kernel
    covers: 'dependency boundary: the 19 synchronous kernel crates must not gain async/HTTP deps'
    baseline_status: EXPECTED_GREEN
    plan_relevance: Directly constrains the HTTP AgentRunner task. The judgment invocation boundary is an async EDGE concern; it MUST NOT push tokio/reqwest into kernel crates.
  - id: SEA_PROOF
    repository: sea-rs
    working_directory: .
    command: just proof
    covers: spec-minimum P1-P4b minimum proofs
    baseline_status: UNKNOWN_UNTIL_T00
  - id: GAUNTLET_CHECK
    repository: gauntlet
    working_directory: ../gauntlet
    command: just check
    baseline_status: UNKNOWN_UNTIL_T00
  - id: GAUNTLET_TEST
    repository: gauntlet
    working_directory: ../gauntlet
    command: just test
    baseline_status: UNKNOWN_UNTIL_T00
  - id: GAUNTLET_CI
    repository: gauntlet
    working_directory: ../gauntlet
    command: just ci
    covers: check + test + lint + deny + boundaries + ruler
    baseline_status: UNKNOWN_UNTIL_T00
    plan_relevance: The recipe exists; T02 binds it into hosted CI, which does not exist today.
  - id: EDGEAI_HEALTH
    repository: edgeai
    working_directory: the edgeai repository root on the deployment target
    command: just health
    baseline_status: TARGET_MACHINE_ONLY
    plan_relevance: T12 prerequisite; the development host is not the deployment target
  - id: EDGEAI_JETSON_PORTS
    repository: edgeai
    working_directory: the edgeai repository root on the deployment target
    command: just jetson-check-ports
    baseline_status: TARGET_MACHINE_ONLY
  gate_binding_rule: All commands above were discovered by reading the repositories' justfiles, not inferred from naming. T00 MUST re-verify each command resolves, MUST record its baseline exit state, and
    MUST NOT create a parallel command surface. Task-level narrow gates MUST reuse `just crate-check <crate>` / `just crate-test <crate> [filter]` for sea-rs and `just check-package <package>` / `just test-package
    <package>` from the Gauntlet root. T00 runs global gates sequentially in listed order. TARGET_MACHINE_ONLY gates are resolved but not executed on the development host and receive no pass classification.
  baseline_classification_rule: 'Every gate is classified at T00 as one of: EXPECTED_GREEN, PREEXISTING_BASELINE_FAILURE, or UNKNOWN_UNTIL_T00. A gate that was already failing at the T00 baseline MUST NOT
    be counted as a plan regression. A gate that was green at T00 and is red later IS a plan regression and MUST block settlement of the offending task.'
  proof_levels:
    P0: Mechanical/deterministic change. Requires a narrow direct gate plus applicable global gates.
    P1: Normal behavioral work. Requires positive behavior, a meaningful teeth/falsification check, and applicable global gates.
    P2: Invariant-sensitive work. Requires an explicit or preregistered claim, meaningful adversarial/negative evidence, an evidence artifact, applicable global gates, and review of a plausible alternate
      failure path.
    P3: Settlement-critical work. Requires frozen preregistration, builder evidence, explicit adversarial attacks, fresh independent confirmation, and correction/re-confirmation after any failed confirmation.
  high_risk_confirmation_rule: "The specification declares six high-risk requirement groups with required confirmation modes (spec conformance_traceability.high_risk_requirement_groups):\n  authority_separation\
    \   -> adversarial\n  semantic_bounding      -> independent\n  uncertainty_integrity  -> independent\n  claim_scope_integrity  -> adversarial\n  provenance_replay      -> fresh_target_reproduction\n\
    \  safe_failure           -> adversarial\nEvery group MUST be confirmed by a task whose `confirmation` mode matches or exceeds the declared mode. This is verified mechanically in `traceability`."
