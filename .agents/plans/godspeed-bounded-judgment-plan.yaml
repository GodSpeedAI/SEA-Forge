  edge_rationale:
    T00 -> T01..T05: Nothing may be measured, gated, or proven before the authority is frozen and the real gates are bound.
    T01 -> T06: 'The bounded answer domain must not be finalized before PROOF-1 establishes whether the first surface is answerable and how the corpus constrains it. This is the spec''s own dependency (C10:
      do not promote for a surface without measurement).'
    T06 -> T07: Carrier fields cannot be chosen before the answer-domain contract they must hold exists.
    T03,T06 -> T08: The HTTP provider path needs both a declared answer domain and a green SEA server baseline because its comparison evidence cites the existing server HTTP path.
    T07,T08 -> T09: Provenance and retry accounting attach to the carrier fields and the provider path; neither can be observed without both.
    T07 -> T10: Composition thresholds operate on a distribution; the distribution must be persistable first.
    T08,T09 -> T11: Provider substitution compares semantics of two paths, which requires a second path and the provenance that makes the comparison attributable.
    T05,T09,T10,T11 -> T12: The live target pilot exercises correlation, provenance, composition, and substitution together on real hardware.
    T01,T05,T07 -> T13: Evidence ownership and export depend on the measured corpus, the correlation identity, and the persisted carrier whose deliberately partial replay scope T13 closes.
    T02,T03,T04,T12,T13,T17 -> T14: Final confirmation cannot settle the plan while either hygiene task remains open; it also requires authority, target reproduction, evidence ownership, and genuinely green
      required global gates.
    T01 -> T15: The variation corpus exists to answer T01's escalated question; the frozen harness family and its disclosure discipline are the measurement instrument.
    T15 -> T16: The remeasurement consumes exactly the frozen T15 corpus manifest; wildcards forbidden.
    T16 -> T06: T06's surface authorization may now be earned by the varied-corpus measurement; DAG-level, T16 gates T06 alongside T01.
    T03 -> T17: T17 inherits T03's attribution records and extends gate remediation to full green.
    T16 -> T21: The route-discovery branch is a separate developmental experiment branching from the settled T16 result; it must not reopen T16 or unlock T06.
    T21 -> T22 -> T23 -> T24 -> T25: The loop cannot execute before its contract/fixture freeze (T21); a route cannot settle before the loop executes (T22); a case cannot be inverted before a route genuinely
      settles (T23); the matched negative and payment comparison require an accepted generated case (T24).
    T23,T24,T25 -> T26: The independent adversarial confirmation adjudicates the scoped claims (route search, case generation, data-generation payment) and therefore requires all of their evidence.
  deliberate_non_edges:
  - note: T02 (Gauntlet CI) and T03 (SEA-Forge gate repair) have NO edge to or from T01. They are independent of the pilot. T03 is nevertheless a prerequisite of T08 and both are prerequisites of final
