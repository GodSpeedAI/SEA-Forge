    - REQ-SETTLE-003
    - REQ-OUT-006
    - REQ-OUT-007
    - REQ-JUDG-023
    - REQ-VERIFY-012
    - CLAIM-003
    - CLAIM-006
    - VAR-001
    - VAR-002
    - VAR-003
    changes: Adds a read-only measurement harness and its report under the plan's evidence root. Reads only the exact Gauntlet database and evidence paths frozen in the T01 corpus manifest; wildcard paths
      are discovery inputs, never the executed corpus contract. Changes NO production code path, NO schema, NO runtime behavior, and NO persisted state. This is the single most important task in the plan
