    does_not_prove: That the server has no other latent isolation defects, that the full workspace suite is green, or that any judgment-related behavior works.
    hot_context:
    - 'KNOWN FACT: .agents/CURRENT_STATUS.md (2026-08-31) records `conformance_run_locator::both_layouts_still_resolve_after_a_restart` failing because a second server cannot start while the first still
      owns the cell lock.'
    - crates/sea-forge-server/ (server, cell lock, conformance tests)
    - crates/sea-forge-cell/ (cell identity and ownership)
    - justfile recipe `crate-test crate test_filter=''`
