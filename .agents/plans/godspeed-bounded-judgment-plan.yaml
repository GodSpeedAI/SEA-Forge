    - Reproduce the failure first and capture its exact output and exit code into the evidence directory as round-1. Do not begin by editing.
    - Determine whether the lock is per-cell or per-process, and whether the test's assumption or the production lock scope is wrong. Record the determination as DECIDED with its evidence.
    - Apply the smallest correction that makes the test's assumption and the implementation agree.
    - Re-run the narrow test, then the full crate suite, then the workspace suite.
    - If the workspace suite reveals additional PRE-EXISTING failures unrelated to this defect, record them as PREEXISTING_BASELINE_FAILURE and do not silently fix or hide them.
    gate:
    - just crate-test sea-forge-server
    - just test
