  T04:
    title: Authority non-bypass — adversarial proof that model output cannot widen authority
    initial_status: blocked
    depends_on:
    - T00
    proof_level: P3
    confirmation: independent_adversarial
    settles:
    - REQ-AUTH-001
    - REQ-AUTH-002
    - REQ-AUTH-003
    - REQ-AUTH-004
    - REQ-AUTH-005
    - REQ-AUTH-006
    - REQ-VERIFY-005
    - REQ-VERIFY-010
    - REQ-OUT-005
    - REQ-SAFE-001
    - REQ-SAFE-005
    - REQ-SEC-005
    - REQ-GOAL-003
    - CLAIM-002
    changes: Adds adversarial tests around the existing authority-before-provider-dispatch ordering. Does NOT change the authority engine's semantics; if a test reveals an actual bypass, the smallest correction
      is made and recorded separately.
    proves: That no provider or model response, however shaped, can produce an authority ALLOW without independent agreement from the authority engine; and that provider timeout, unavailability, malformed
      output, or contradictory output cannot default to permissive behavior.
    does_not_prove: That the authority policy itself is correct, complete, or free of misconfiguration; that any judgment is useful; or that composition thresholds are sound. It proves the ORDERING and
      the FAIL-CLOSED property, not policy quality.
    preregistration:
      required: true
      artifact: .agents/preregistrations/godspeed-bounded-judgment-T04.prereg.yaml
      claims:
      - A provider returning an allow-shaped or high-confidence answer while the authority engine says DENY produces DENY.
      - Provider timeout produces a typed non-authoritative state, never ALLOW.
      - Unavailable provider produces a typed non-authoritative state, never ALLOW.
      - Malformed or out-of-domain provider output produces a typed failure, never ALLOW.
      - A contradictory model response cannot produce ALLOW.
      - Evaluation context contributed to a DecisionSurface cannot redefine canonical domain meaning (REQ-AUTH-006).
      falsifiers:
      - Any single case above produces ALLOW without independent authority agreement.
      - Any failure mode is observed to be indistinguishable from success in the recorded outcome.
      - An evaluation criterion is observed to define, rename, widen, or override a canonical concept.
      known_confounds:
      - A permissive test policy could make the tests vacuous. The preregistration MUST declare a DENY-by-default policy for the adversarial cases.
      - A stub provider that cannot express an allow-shaped answer would make the primary attack vacuous. The preregistration MUST require the stub to be capable of emitting the strongest available allow-shaped
        answer.
      confirmation_condition: A fresh independent verifier, given the requirement ids, the frozen preregistration, the tests, and the evidence, independently attempts the same attacks and returns CONFIRM
        with no authority-widening case found.
    hot_context:
    - crates/sea-forge-server/src/agent_probe.rs (verdict checked before dispatch; failure settles Rejected)
    - crates/sea-forge-authority/src/lib.rs (Verdict, NormalizedDisposition, Determinism, PolicyAuthorityEngine)
    - crates/sea-forge-authority/tests/conformance_m0_authority.rs (existing policy-binding conformance; NOT an adversarial model-output test)
    - 'KNOWN FACT: authority-before-model is true BY CONSTRUCTION today and is UNPROVEN BY TEST. This task is the missing proof.'
    steps:
    - Freeze the preregistration, including the DENY-by-default policy and the strongest-available-allow-shaped-answer requirement for the stub.
    - Build the adversarial stub capable of emitting an allow-shaped, high-confidence answer.
    - Add the timeout, unavailable, malformed, out-of-domain, and contradictory cases.
    - 'Add the semantic-authority case: an evaluation criterion attempting to redefine a canonical concept is refused.'
    - Run all cases under the DENY-by-default policy and capture raw evidence per case.
    - Obtain fresh independent adversarial confirmation.
    gate:
    - just crate-test sea-forge-authority
    - just crate-test sea-forge-server
    teeth:
    - attack: Provider returns ALLOW with maximum confidence while the policy says DENY.
      expected: Authority returns DENY. The judgment is recorded as evidence, never permission.
    - attack: Provider times out mid-invocation.
      expected: Typed timeout failure; no ALLOW; the attempt remains referenceable.
    - attack: Provider endpoint unreachable.
      expected: Typed unreachable failure; no ALLOW.
    - attack: Provider returns a value outside the declared answer domain.
      expected: Typed schema failure; no ALLOW; the value is not coerced.
    - attack: Provider returns contradictory answers across two invocations of the same request.
      expected: Both are preserved; the contradiction is explicit; no ALLOW.
    - attack: An evaluation criterion attempts to redefine a canonical DomainForge concept.
      expected: Refused. Semantic authority does not move.
    - attack: Make the test policy permissive and re-run.
      expected: The harness MUST detect that the adversarial cases became vacuous and FAIL the run rather than reporting green.
    independent_confirmation:
      verifier_receives:
      - the settled requirement ids and their normative text
      - the frozen preregistration
      - the adversarial tests and the stub provider
      - the per-case raw evidence
      - 'the exact confirmation question: can any provider response produce an authority ALLOW without independent authority agreement?'
      verifier_should_not_receive:
      - the builder's narrative conclusion
      - the builder's list of which attacks were considered hardest
      required_verdict: CONFIRM
    redesign_trigger: If a genuine authority bypass is found, the ordering invariant itself is falsified. Stop, preserve the evidence, and revise the specification rather than patching the test. A bypass
      is a normative failure, not an implementation bug.
    evidence: .agents/evidence/godspeed-bounded-judgment/T04/
    done_when:
    - Every preregistered case behaves as specified under a DENY-by-default policy.
    - The vacuity guard fails the run if the policy or stub makes cases trivial.
    - Fresh independent adversarial confirmation returns CONFIRM.
    - Raw per-case evidence is preserved, including any failed round.
    - All applicable global gates show no NEW failures versus the T00 baseline.
  T05:
    title: Loop correlation identity — deterministic joinability without heuristic string matching
    initial_status: blocked
    depends_on:
    - T00
    proof_level: P3
    confirmation: independent_adversarial
    settles:
    - REQ-PROV-021
    - REQ-PROV-022
    - REQ-SETTLE-001
    - REQ-GOAL-005
    - VAR-008
    - RECOV-004
    changes: Introduces or binds ONE stable correlation identity that makes artifacts of a single operative loop deterministically joinable, and records the chosen mechanism. Does not create a new store,
      a new service, or a new ledger.
    proves: That a judgment, its authority decision, its execution, its observed consequence, and its settlement can be joined mechanically by a correlation identity alone, with no heuristic string matching
      and with false joins impossible or rejected.
    does_not_prove: That every subsystem physically exposes an identically named field. The requirement is JOINABILITY, not a field name; the mechanism is implementation-defined unless an existing repository
      contract forces one representation. It also does not prove the judgment is correct or useful.
    mechanism_rule: Acceptable mechanisms include direct echo, envelope projection, an explicit mapping table, or another lossless mechanism. Whatever is chosen MUST be demonstrated lossless by a joinability
      test. Joinability MUST NOT be inferred from string similarity.
    preregistration:
      required: true
      artifact: .agents/preregistrations/godspeed-bounded-judgment-T05.prereg.yaml
      claims:
      - A single stable correlation identity can be bound at admission and preserved across meaning, judgment, authority, execution, observation, and settlement boundaries.
      - 'The chosen mechanism is lossless: every artifact that cites a judgment or a settlement is joinable to it.'
      - False joins are impossible or explicitly rejected.
      - A settlement that contradicts a prior judgment leaves the original judgment immutable and correlatable (VAR-008).
      falsifiers:
      - Two concurrent runs with similar human-readable ids produce a false join.
      - A restart or resume loses the correlation for in-flight artifacts.
      - A duplicate external id causes a wrong join instead of a rejection.
      - A missing hop is silently tolerated rather than reported.
      - A stale mapping binds a judgment to the wrong settlement.
      known_confounds:
      - Existing run_id strings are already reused across systems, so a test that merely matches run_id strings may appear to pass while proving nothing about joinability under collision.
      - If the corpus is small, collision cases must be constructed deliberately rather than waited for.
      confirmation_condition: A fresh independent verifier receives the requirement, the mechanism, the joinability tests, and the evidence, and independently attempts false joins and missing-hop cases,
        returning CONFIRM with no false join achieved and no silent missing hop tolerated.
    hot_context:
    - gauntlet-ports/src/agent_runner.rs (ContextEnvelope{body,digest}; RoleInvocationSpec)
    - gauntlet-domain/src/role_invocation.rs (RoleInvocationDefinition.context_envelope_digest)
    - sea-forge-core/src/types.rs (Determinism{policy_bundle_hash, action_request_hash, identity_binding_hash})
    - sea-forge-ledger/src/types.rs (LedgerEntry, MmrState, CommittedRecordRef)
    - sxr-core/src/types.rs (LedgerPosition, DeclKey) and sxr-core/src/record_kinds.csv (settlement_dependency column)
    - 'KNOWN FACT: no shared correlation value survives the round trip today. Correlation is currently by run_id string convention across four systems.'
    steps:
    - Inspect the corrected specification and the existing identities before designing anything; record which identities already exist and what each can and cannot express.
    - Freeze the preregistration before implementation or harness execution.
    - Choose the mechanism and record WHY, including whether any existing repository contract forces one representation.
    - Bind the identity at admission and preserve it across the required boundaries using the chosen lossless mechanism.
    - Author joinability_test.py at the gate path and record its sha256 before first execution; it joins judgment to settlement by the correlation identity alone and implements every declared false-join
      attack.
    - Construct the collision, restart, duplicate-id, missing-hop, stale-mapping, and mismatched-pair cases.
    - Obtain fresh independent adversarial confirmation.
    gate:
    - just crate-test sea-forge-core
    - python3 .agents/evidence/godspeed-bounded-judgment/T05/joinability_test.py
    teeth:
    - attack: Two simultaneous runs with similar human-readable ids.
      expected: No false join; each artifact resolves to its own loop.
    - attack: Restart or resume mid-loop.
      expected: Correlation survives; in-flight artifacts remain joinable.
    - attack: Duplicate external id.
      expected: Rejected as a conflict, never silently joined.
    - attack: Remove one correlation hop.
      expected: The joinability check FAILS and names the missing hop; it does not fall back to string matching.
    - attack: Serve a stale mapping.
      expected: The stale mapping is detected and rejected.
    - attack: Intentionally mismatch a judgment with a settlement from another run.
      expected: The false join is refused.
    - attack: Make the joinability test pass by matching run_id strings only.
      expected: The collision case above MUST fail such an implementation.
    independent_confirmation:
      verifier_receives:
      - REQ-PROV-021 and REQ-PROV-022 normative text
      - the frozen preregistration
      - the chosen mechanism and its rationale
      - the joinability tests and the adversarial cases
      - the raw evidence
      - 'the exact confirmation question: can any two artifacts from different operative loops be joined, or can any required hop be silently missing?'
      verifier_should_not_receive:
      - the builder's narrative conclusion
      required_verdict: CONFIRM
    redesign_trigger: If joinability cannot be achieved without changing an existing event schema or creating a new persistence subsystem, STOP. That would contradict the specification's reduction and requires
      an explicit spec revision rather than an implementation workaround.
    evidence: .agents/evidence/godspeed-bounded-judgment/T05/
    done_when:
    - A correlation identity is bound at admission and preserved across all required boundaries.
    - The joinability test joins judgment to settlement by the correlation identity alone.
    - Every adversarial case behaves as specified; no false join is achievable.
    - Fresh independent adversarial confirmation returns CONFIRM.
    - No new store, service, or ledger was introduced.
