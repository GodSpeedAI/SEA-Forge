      - Breadth comparison against family 1 recorded (shared vs family-specific machinery).
      - Fresh independent adversarial confirmation returns the frozen verdict.
final_acceptance:
  authority_and_safety:
  - No provider or model response can produce an authority ALLOW without independent authority agreement (T04 evidence, re-confirmed at T14).
  - Provider timeout, unavailability, malformed output, and contradictory output all settle to typed non-authoritative states; none defaults to permissive (T04, T08, T09 evidence).
  - Every judgment failure mode is distinguishable from success in the recorded outcome (T09, T14 evidence).
  - No global gate is redder than its T00 baseline classification.
  bounded_judgment:
  - The first surface was frozen before measurement and measured read-only; its outcome classification (A/B/C/D/E) is recorded with its consequence (T01 evidence).
  - The declared answer domain is closed, versioned, carries an explicit insufficiency label, and rejects vacuous domains (T06 evidence).
  - The deterministic basis is not displaced by any settled judgment path (T07 evidence, re-confirmed at T14).
  - The distribution survives restart and settlement and is attributable or explicitly unattributed (T07, T09 evidence).
  - Substitution is reported at the level actually achieved; model-quality comparability is named as unproven (T11 evidence).
  provenance_and_replay:
  - Judgment, authority decision, execution, observation, and settlement join by the correlation identity with no heuristic string matching (T05 evidence).
  - Provenance replays by fresh reproduction on the deployment target with no unexplained divergence (T12 evidence).
  - The read-only export path joins and exports the full forward chain with explicit exclusions (T13 evidence).
  - Recovery drills (provider failure, corrupted state, restart mid-loop) reach known-good states without silent loss (T12 evidence).
  evidence_and_confirmation:
  - Every REQUIRED normative spec requirement maps to at least one settled task/evidence record.
  - Every P3 task has the required fresh independent confirmation.
  - Failed/correction evidence has not been erased.
  - Documentation/status claims do not exceed observed proof.
  - All global gates exit 0 or match their T00 baseline classification.
  - 'The confirmation report names the unproven list explicitly: model-quality comparability, calibration, fleet behavior, long-horizon reliability.'
guardrails:
- No Judgment Plane service, daemon, provider port, database, broker, or deployment artifact may be introduced under that name; the concern is realized through existing machinery (source-of-truth rule).
- No .sea grammar change; no training pipeline; no learning claim in this plan.
- 'Provider/model output NEVER widens authority: authority is evaluated before provider dispatch, and failure defaults to non-authoritative, never permissive.'
- No new generic probabilistic-result type until a concrete non-verification use case demonstrates semantic insufficiency (spec C1); slice 1 reuses the verification record shape.
- A negative PROOF-1 result falsifies a SURFACE, never the capability class; surface-scoped language is mandatory (spec C2).
- The terms calibrated probability, calibration curve, production threshold, population-level reliability, and model generalization are FORBIDDEN for this corpus (spec REQ-VERIFY-012).
- 'No silent fallback: timeout, unreachable, malformed, out-of-domain, retry, degraded, and unattributed states are explicit, typed, and recorded.'
- 'No retroactive mutation of history: contradicted judgments stay immutable and correlatable; legacy unattributed rows stay unattributed.'
- No new test logic or command surface where an existing recipe exists; `just no-async-kernel` is the binding async-boundary gate.
- Development-host output is never claimed as target-machine evidence.
handoff_contract:
  must_report:
  - settled capabilities/requirements
  - explicitly unsettled or deferred items
  - current operational system state
  - requirement-to-evidence index
  - known limitations
  - rollback/recovery instructions where relevant
  - important decisions/discoveries that changed the execution model
  - exact next executable action or 'none — plan settled'
  settled_next_action_rule: The next executable action MUST be set to `none \u2014 plan settled` only after the final required conformance/confirmation task succeeds.
