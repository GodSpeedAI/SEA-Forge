    - The pilot dataset, coverage report, missing-field report, provider attribution report, descriptive scoring report, provider disagreement report, abstention report, deterministic baseline comparison,
      and concentration report all exist.
    - Every reported metric carries the mandatory disclosure block, and unstable metrics are labelled unstable.
    - No forbidden calibration term appears in any report (verify_disclosure.py exits 0).
    - The scope-of-falsification statement is present and no wider claim is made.
    - All declared teeth behave as specified, including the label-shuffle and label-leakage attacks.
    - Fresh independent adversarial confirmation returns CONFIRM.
    - An outcome classification (A/B/C/D/E) is recorded in the decision log with its consequence.
    - '../gauntlet was not modified: recorded corpus mtimes/hashes are unchanged.'
    - All applicable global gates show no NEW failures versus the T00 baseline.
  T02:
    title: Gauntlet CI — enforce the existing gate set on the judgment-corpus owner
    initial_status: blocked
    depends_on:
    - T00
    proof_level: P1
    confirmation: builder
    settles: []
    settles_explanation: Explicit prerequisite task. The Gauntlet CI gate settles no product requirement by itself; it is the enforcement mechanism that makes every Gauntlet-scoped evidence claim in this
      plan falsifiable and protects the corpus that PROOF-1 depends on. It exists because the review established that the component owning the execution and judgment corpus has no automated gate at all.
    changes: Adds continuous-integration enforcement for the Gauntlet repository using its EXISTING recipes. Changes no product behavior, no schema, and no runtime semantics.
    proves: That the Gauntlet gate set (check, test, lint, deny, boundaries, ruler) runs automatically on change, so corpus and adapter work cannot silently regress.
    does_not_prove: That the gate set is sufficient. A green Gauntlet gate proves only what those recipes observe; it does not prove judgment quality, corpus completeness, or production readiness.
    hot_context:
    - '../gauntlet/justfile (ci: check test lint deny boundaries ruler; verify: ci)'
    - ../gauntlet/deny.toml (dependency policy)
    - 'KNOWN FACT: ../gauntlet currently has no .github/workflows directory. Verify before and after.'
    - 'KNOWN FACT: the sea-rs repository already uses .github/workflows/{ci,pr-title,release-please,security}.yml and invokes devbox + just. Reuse that established shape rather than inventing a second one.'
    steps:
    - Confirm ../gauntlet has no existing CI configuration; record the check and its result.
    - Record the CURRENT exit state of each Gauntlet recipe individually before adding any automation, so a pre-existing red recipe is distinguished from a regression.
    - Add CI configuration that invokes the existing `just ci` (or the same recipes) using the repository's established toolchain conventions. Do NOT create new test logic or a parallel command surface.
    - If any recipe is red at baseline, record it as PREEXISTING_BASELINE_FAILURE with the exact failing test id and do NOT weaken or skip it to obtain green.
    - Record the resulting workflow path(s) and the exact command invoked.
    gate:
    - cd ../gauntlet && just ci
    teeth:
    - attack: Introduce a trivial deliberate lint or boundary violation in a scratch branch and observe the configured gate.
      expected: The gate FAILS. A gate that cannot fail on a known violation is not a gate.
    - attack: Attempt to make the gate pass by excluding a crate or skipping a recipe.
      expected: The exclusion is rejected during review; narrowing the observed surface while claiming the same gate is a violation of the operating contract.
    redesign_trigger: If the Gauntlet recipes cannot run in the available environment (missing toolchain, unavailable dependency, or an environment assumption that cannot be satisfied on the development
      host), then CI enforcement is not achievable as scoped and the affected evidence claims must be marked as relying on manual runs until a runner exists.
    evidence: .agents/evidence/godspeed-bounded-judgment/T02/
    done_when:
    - CI configuration exists and invokes only existing Gauntlet recipes.
    - The configured gate was observed to fail on a deliberate violation and pass on the unmodified revision.
    - Any baseline-red recipe is recorded as PREEXISTING_BASELINE_FAILURE, not hidden.
    - No new test logic or command surface was introduced.
