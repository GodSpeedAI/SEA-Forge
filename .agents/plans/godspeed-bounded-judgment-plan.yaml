tasks:
  T00:
    title: Freeze authority, bind real gates, and validate the plan itself
    initial_status: ready
    depends_on: []
    proof_level: P1
    confirmation: builder
    settles: []
    settles_explanation: 'This is an explicit baseline/prerequisite task. It settles no product requirement because it changes no product behavior: it freezes the normative authority, binds the repository''s
      REAL gates, and validates this plan''s own DAG and traceability. Every later evidence claim depends on it, which is why it is a task and not a note.'
    changes: Adds a frozen authority record and a bound-gate record to the repository's agent workbench. No product code, schema, runtime, database, or persisted production state changes.
    proves: That this plan is projected from an exact, self-checked specification revision; that every REQUIRED normative requirement is mapped to at least one task; that the plan references no unknown
      requirement id; that the dependency graph is acyclic; and that every global gate's BASELINE exit state is recorded before any task runs.
    does_not_prove: Anything about bounded judgment. It does not prove the capability works, that the historical corpus is reconstructible, or that any provider can satisfy a bounded contract.
    hot_context:
    - .agents/specs/GODSPEED_JUDGMENT_PLANE_SPEC.yaml
    - .agents/specs/archive/GODSPEED_JUDGMENT_PLANE_SPEC.v0.1.0-draft.yaml
    - 'justfile (recipes: check, test, ci, proof, no-async-kernel, context-check, crate-check, crate-test)'
    - '../gauntlet/justfile (recipes: check, test, lint, deny, boundaries, ruler, ci, verify)'
    - '../edgeai/Justfile (recipes: health, jetson-check-ports, appliance-verify)'
    - '.agents/evidence/ (existing convention: <plan-id>/ subdirectories)'
    - .agents/plans/validate-godspeed-bounded-judgment-plan.py (checked-in mechanical validator; execution output belongs under T00 evidence)
    - .agents/current_status.yml (the plan's declared mutable status artifact)
    - 'KNOWN FACT: .agents/CURRENT_STATUS.md (2026-08-31) records an unrelated failing test in the sea-forge-server suite. Do not re-derive that from scratch; CONFIRM it.'
    - 'KNOWN FACT: this plan''s source spec revision is 1.0.0 with sha256 69b7d1ba...baf6a82. A mismatch is a stop condition, not a reconciliation task.'
    steps:
    - Recompute sha256 of .agents/specs/GODSPEED_JUDGMENT_PLANE_SPEC.yaml and assert equality with source.spec.sha256. On mismatch STOP and report a blocked decision; do not 'update' the hash.
    - Re-run the specification's own final_self_check (all 12 statements holds==true) and assert the correction_ledger records 11 corrections with architectural_conclusions_reversed == 'none'.
    - Mechanically parse every normative requirement id from the spec; classify REQUIRED (all REQ-*, VAR-*, RECOV-*, CLAIM-*) versus excluded (NONGOAL-*, roadmap items, narrative).
    - Run the checked-in plan validator and record its sha256 plus complete stdout/stderr under T00 evidence. It validates the spec binding, 90/90 bidirectional task mapping, DAG/state equivalence, task
      completeness, preregistration declarations, gate-script authoring, stale literals, and all six high-risk confirmation groups.
    - 'For each gate in verification.global_gates: change to its declared working_directory, resolve the recipe, then run non-target gates sequentially in listed order. Record command, cwd, revision, exit
      code, and a bounded output tail; never run two heavy gates concurrently.'
    - For TARGET_MACHINE_ONLY gates, confirm the recipe exists in ../edgeai/Justfile but record NOT_RUN_TARGET_ONLY on the development host. Do not convert resolution into passing target evidence.
    - Record the exact failing test id(s) of any red gate as PREEXISTING_BASELINE_FAILURE with the revision hash observed.
    - 'Confirm repository clean-state expectations: record which tracked files are already modified before this plan runs, so later regression attribution is possible.'
    - Write .agents/evidence/godspeed-bounded-judgment/T00/gate-baseline.yml and .agents/evidence/godspeed-bounded-judgment/decisions.yml.
    - 'Update .agents/current_status.yml: metadata.plan_id=godspeed-bounded-judgment, spec binding, execution.ready_tasks from initial_state, and blockers only where the plan declares them.'
    gate:
    - python3 .agents/plans/validate-godspeed-bounded-judgment-plan.py
    - just context-check
    teeth:
    - attack: Corrupt the bound sha256 in the plan (or edit the spec after binding) and re-run validation.
      expected: Validation FAILS with an explicit hash-mismatch. It must not silently accept a drifted spec.
    - attack: Remove one task.settles entry for a REQUIRED requirement and re-run validation.
      expected: unmapped_requirements becomes non-empty and plan generation FAILS. It must not report success with a partial mapping.
    - attack: Add a fake requirement id (for example REQ-FAKE-999) to any task.settles and re-run validation.
      expected: unknown_plan_requirement_ids becomes non-empty and plan generation FAILS.
    - attack: Introduce a cycle by adding an edge T14 -> T00 and re-run validation.
      expected: Acyclicity check FAILS naming the cycle.
    redesign_trigger: If the specification cannot be parsed into a stable requirement id set, or its own final_self_check does not hold, then the plan's source authority is not trustworthy and ALL downstream
      work is blocked. Do not repair the specification inside this plan.
    evidence: .agents/evidence/godspeed-bounded-judgment/T00/
    done_when:
    - Recomputed spec sha256 equals the bound value.
    - Spec final_self_check holds 12/12 and correction_ledger reports 11 corrections with zero reversals.
    - validate-godspeed-bounded-judgment-plan.py exits 0 with 90/90 bidirectional mappings, an acyclic state-equivalent DAG, and 6/6 confirmation-conformant high-risk groups.
    - Every global gate has a recorded baseline exit state and classification.
    - Pre-existing modified tracked files are recorded for later regression attribution.
    - Global gates applicable at baseline show no NEW failures introduced by T00 itself.
  T01:
    title: PROOF-1 — read-only bounded-judgment pilot measurement
    initial_status: blocked
    depends_on:
    - T00
    proof_level: P2
    confirmation: independent_adversarial
    settles:
