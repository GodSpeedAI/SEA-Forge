    preregistration:
      required: true
      artifact: .agents/preregistrations/godspeed-bounded-judgment-T01.prereg.yaml
      freeze_contract:
        contract_rule: F0 items MUST be frozen and hashed before the FIRST harness execution. F1 items MUST be frozen before the first PROVIDER RESULT is observed, so the surface and answer domain can never
          be fitted to outcomes (target leakage). The preregistration artifact carries both stages; each freeze is hashed and recorded in the decision log before the work it governs.
        f0_before_first_harness_execution:
        - 'exact corpus manifest: per-run ids, state database paths, evidence objects and pins paths, selected/excluded status with reason'
        - 'exact corpus hashes: sha256 per manifest entry, re-verified before the first run; runtime wildcards forbidden'
        - 'the preregistration text itself: claims, falsifiers, known confounds, confirmation condition, branch conditions (outcomes A-E with their DAG consequences)'
        - 'surface selection rule and surface NOMINATION (the preregistered default: does the evidence at the declared locator satisfy the declared requirement, over existing verification-record claim/requirement
          fields) plus the preregistered second surface of a materially different judgment shape'
        - the two harness scripts' identities (sha256) and gate paths
        f1_before_first_provider_result_observed:
        - the selected DecisionSurface and its judgment shape (binary/proposition, multiclass choice, or ordered score/rubric)
        - the closed, versioned answer domain, including the explicit insufficiency/undecidable label
        - 'the semantic basis: which canonical meanings and identities the surface cites, owned by DomainForge; evaluation context may select but never define, rename, widen, or override them (spec REQ-AUTH-006)'
        - 'the evaluation basis: which evaluation/criteria fields pose the question and which evaluation layer owns them (kept distinguishable from the semantic basis per the spec''s dual-basis requirement)'
        - provider identities and config identities for every provider path (at least two materially independent; the deterministic/scripted provider is mechanics-only and never counted as real substitution;
          historical rows stay unattributed)
        - 'the deterministic baseline: the existing deterministic outcome used for every incremental-information comparison'
        - 'the exploratory pilot metrics to be computed: accuracy, confusion matrix, Brier score, log loss, reliability bins, abstention rate, provider disagreement — each reported only with the mandatory
          disclosure block (N, independent run count, class counts, concentration/effective diversity, missing attribution, reconstructibility rate) and marked unstable where the sample makes it so'
        - the falsification scope statement (surface-scoped; capability-class conclusions require the preregistered second shape per spec REQ-JUDG-023)
      claims:
      - The historical Gauntlet corpus can be inspected WITHOUT MUTATION to determine how much of the pre-decision -> judgment -> consequence -> settlement chain is reconstructible.
      - The first bounded decision surface can be stated using only labels that existed BEFORE any outcome was observed, without inventing semantic labels after seeing outcomes.
      - Materially independent providers can produce bounded outputs over that frozen surface and answer domain.
      - On THIS SURFACE, uncertainty-preserving output provides incremental DESCRIPTIVE information over the existing deterministic outcome.
      falsifiers:
      - The chain cannot be reconstructed for a material fraction of rows, or temporal ordering between state_before, judgment, action, consequence and settlement cannot be established.
      - The first surface cannot be stated without reference to the eventual outcome (label leakage), or its answer domain is degenerate (a single effective label).
      - Providers cannot produce output inside the declared answer domain, or cannot be shown to be materially independent.
      - The distribution adds no descriptive information over the deterministic baseline on this surface.
      known_confounds:
      - Corpus size is small (order 10^1 settled judgments), so every metric is unstable.
      - Historical records carry no model identity, so provider attribution is impossible for past rows.
      - One run dominates the corpus, so effective diversity is lower than the run count suggests.
      - Only three record kinds appear in practice across the corpus, so the schema is richer than the content.
      confirmation_condition: A reviewer can recompute every reported number from the persisted harness and the read-only corpus, every claim is accompanied by its scope of falsification and the mandatory
        disclosure block, and no forbidden calibration term appears in the report.
    evaluation_context_of_the_preregistration: The preregistration MUST be frozen (hashed) BEFORE the first harness run. Any change after the first run is a new round appended as round-2, never an edit.
    corpus_manifest_rule: Before reading payloads, enumerate candidate runs under ../gauntlet/targets/.runs/ and write an exact manifest beside the preregistration. The manifest MUST name each run id, state
      database path and sha256, evidence/objects path, evidence/pins path, and selected/excluded status with reason. run_pilot.py consumes only that manifest and refuses wildcard input, a missing hash,
      a changed hash, or any writable source.
    first_surface_selection_rule: 'Select the surface that already exists in the corpus with the most rows and an existing declared answer set. Default candidate: ''does the evidence at the declared locator
      satisfy the declared requirement?'', over the existing verification record claim and requirement fields, with a closed answer domain that INCLUDES an explicit insufficient/undecidable label. The selection
      and its judgment SHAPE must be recorded in the preregistration before running.'
    second_surface_rule: Nominate in the preregistration one materially DIFFERENT judgment shape (binary or proposition, multiclass choice or classification, ordered score or rubric) to be examined if outcome
      C occurs. This nomination is required so that outcome C cannot be used to close the question by exhaustion.
    hot_context:
    - ../gauntlet/targets/.runs/*/state/*.db (discovery pattern only; the frozen corpus manifest supplies exact paths and hashes)
    - 'Tables of interest: checkpoints, records(record_type), settlements, observation_bindings, evidence_productions'
    - ../gauntlet/targets/.runs/<frozen-run-id>/evidence/objects/ and evidence/pins/ (resolved per exact manifest entry; no runtime globbing)
    - 'KNOWN FACT: record_type=''verification_record'' payload is a JSON document containing schema, verification_ref, run_id, iteration_no, unit_id, claim, requirement{kind,locator,producer}, instrument{name,version,deterministic},
      evidence_ref, produced_at, outcome, class, detail.'
    - 'KNOWN FACT: historical role_invocation payloads carry model: null. Do NOT fabricate model identity.'
    - 'KNOWN FACT: measured aggregate counts across the 16 databases are approximately: role_invocation 37, correction_selection 28, verification_record 17, settlements 17, observation_bindings 29. Treat
      these as INFERRED until recomputed by the harness.'
    steps:
    - Draft the preregistration and analysis algorithm without executing the harness or inspecting payload rows.
    - Author run_pilot.py and verify_disclosure.py at the gate paths. They MUST implement the declared metrics and teeth, refuse non-manifest inputs, open SQLite with mode=ro, and emit outputs only under
      the current T01 evidence round.
    - Enumerate candidate run paths without reading payload rows; write the exact corpus manifest required by corpus_manifest_rule and add the manifest plus both harness sha256 values to the preregistration.
    - Freeze the preregistration and corpus manifest; record both sha256 values in the append-only decision log before the first harness execution.
    - Copy the frozen corpus to a read-only working area OR open every manifest database with SQLite mode=ro. Mutation of ../gauntlet is FORBIDDEN; record source hashes and mtimes before and after.
    - For every database in the manifest, dump schema; count rows per record_type; record which kinds are absent (this measures the schema-versus-content gap).
    - 'Reconstruct, per row: state_before (from checkpoints), judgment (from records), action (from role_invocation / correction_selection), observed consequence (from observation_bindings + evidence objects),
      settlement (from settlements). Emit a machine-readable pilot dataset with explicit nulls for missing fields.'
    - Emit the reconstructibility/coverage report and the missing-field report; classify every gap by field, not by impression.
    - Emit the provider attribution report; mark every historical row with unattributed model identity rather than inferring one.
    - Freeze the first surface and its answer domain; assert no label was derived from the observed outcome.
    - 'Run at least two materially independent provider paths over the frozen surface for every reconstructible row: a deterministic/scripted provider (mechanics only, never counted as real substitution)
      and at least one capable provider.'
    - Emit the descriptive scoring report, the provider disagreement report, the abstention/insufficiency report, the deterministic baseline comparison, and the corpus concentration/diversity report.
    - 'Prefix every result with the mandatory disclosure block: N, independent run count, class counts, concentration by run, missing attribution, reconstructibility rate.'
    - Write the explicit scope-of-falsification statement, including which shapes were and were not examined.
    - Append the outcome classification (A/B/C/D/E) and the consequence for the dependent branch to the decision log.
    gate:
    - python3 .agents/evidence/godspeed-bounded-judgment/T01/run_pilot.py --manifest .agents/preregistrations/godspeed-bounded-judgment-T01.corpus-manifest.yml --read-only
    - python3 .agents/evidence/godspeed-bounded-judgment/T01/verify_disclosure.py
    teeth:
    - attack: Shuffle the settlement labels and re-run scoring.
      expected: Reported incremental information collapses toward the deterministic baseline or below it. If a high score survives label shuffling, the harness is computing nothing real and the task FAILS.
    - attack: Deliberately remove rows/fields to simulate an incomplete corpus.
      expected: The missing-field report names the removed fields and the reconstructibility rate drops accordingly; the run does not silently substitute defaults.
    - attack: Construct a degenerate one-label answer domain.
      expected: 'The harness REJECTS the domain as a specification defect (spec AnswerDomain rule: a vacuous domain is a defect) rather than reporting a perfect score.'
    - attack: Construct an answer domain AFTER observing the target outcome.
      expected: The label-leakage check FAILS the surface and the task does not proceed to scoring.
    - attack: Return a provider value outside the declared answer domain.
      expected: The value is rejected as a typed schema failure and counted; it is never coerced into a legal label.
    - attack: Strip provider/model identity from a forward judgment.
      expected: The row is recorded as explicitly unattributed; no identity is inferred.
    - attack: Duplicate rows from the dominant run to inflate N.
      expected: The concentration/diversity report exposes the inflation and the effective-diversity figure contradicts the inflated N.
    - attack: Reverse the temporal order of judgment and settlement for a subset of rows.
      expected: The chain-integrity check FAILS. The harness must not accept a judgment recorded after its consequence as a pre-consequence judgment.
    independent_confirmation:
      verifier_receives:
      - the claim-scope requirements and their normative text
      - the frozen preregistration, exact corpus manifest, and their sha256 values
      - the two frozen harness scripts and raw round evidence
      - 'the exact confirmation question: do label shuffle, label leakage, degenerate-domain, and scope-widening attacks fail as declared, and are all conclusions restricted to the measured surface?'
      verifier_should_not_receive:
      - the builder's narrative conclusion
      - instructions to prefer outcome A, B, C, D, or E
      required_verdict: CONFIRM
    branch_outcomes:
      A:
        condition: History cannot be reconstructed (materially).
        consequence: 'Judgment implementation branch is BLOCKED. T06..T12 MUST NOT be started. Provenance/correlation repair becomes the immediate dependency: T05 becomes critical path and dependent work
          is re-planned only after it settles.'
        inference_allowed: That provenance and correlation are the blocker.
        inference_forbidden: Anything about probabilistic judgment quality, about any answer domain, or about the capability class.
        scope_of_falsification: not_applicable
      B:
        condition: History reconstructs, but providers cannot reliably satisfy the bounded output contract.
        consequence: The semantic/value hypothesis remains OPEN. Provider and structured-output mechanics become the blocker; T08 and T09 are the critical path. Do NOT conclude uncertainty is useless.
        inference_allowed: That contract mechanics, structured output, or provider fit needs work.
        inference_forbidden: That uncertainty-preserving judgment is useless.
        scope_of_falsification: not_applicable
      C:
        condition: History reconstructs, and the distribution adds little on THIS surface.
        consequence: Do NOT promote probabilistic judgment for this surface. T06..T12 MUST NOT proceed ON THAT SURFACE. Before any capability-class rejection, the preregistered second surface of a DIFFERENT
          shape MUST be evaluated.
        inference_allowed: That this surface does not justify probabilistic judgment.
        inference_forbidden: That multiclass choice, ordered score/rubric, or other judgment classes are falsified. A single-shape failure MUST NOT be generalized (spec REQ-JUDG-023).
        scope_of_falsification: surface
      D:
        condition: History reconstructs, and the distribution carries useful descriptive information.
        consequence: 'T06..T12 become eligible in dependency order. Permission is scoped to the examined surface and its shape. NOTE: this is permission to PROCEED, not evidence that the capability is settled.'
        inference_allowed: Interface compatibility (spec CLAIM-006 level A) and a surface-scoped promotion decision.
        inference_forbidden: Level B operational comparability (requires T12), level C model-quality comparability (unproven), and any calibration claim.
        scope_of_falsification: not_applicable
      E:
        condition: Providers disagree strongly.
        consequence: 'Diagnose before judging the surface: classify whether disagreement points to surface ambiguity, insufficient context, unsuitable provider, genuine case uncertainty, malformed contract,
          or provider implementation differences.'
        inference_allowed: That the disagreement is itself evidence requiring classification.
        inference_forbidden: The surface MUST NOT automatically be declared wrong. Provider disagreement is evidence, not a verdict.
        scope_of_falsification: not_applicable
    redesign_trigger: If the corpus cannot establish TEMPORAL ORDERING between state_before, provider judgment, action, consequence and settlement, then STOP. Do not manufacture that chain heuristically.
      The architecture decision becomes 'provenance first' and this plan's judgment slice is re-planned after T05/T09 rather than patched around.
    evidence: .agents/evidence/godspeed-bounded-judgment/T01/
    done_when:
