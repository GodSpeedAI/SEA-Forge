    - attack: Make a candidate genuinely fail (corrupted target check script) and relabel it as progress.
      expected: Failure preserved as its typed class; the route does not silently advance.
    - attack: Provide a useful remaining move but insufficient remaining payment.
      expected: The route stops or selects an affordable alternative; no hidden budget override.
    redesign_trigger: If the frozen goal is unreachable within frozen bounds for reasons the evidence attributes to the contract itself (not to provider or environmental noise), stop and record the design
      question with the failed round preserved.
    evidence: .agents/evidence/godspeed-bounded-judgment/T23/
    done_when:
    - At least one multi-step route genuinely settles with complete provenance and fingerprint, or an honest frozen stop condition is recorded with preserved evidence.
    - Teeth T3/T4/T6 executed with expected outcomes.
    - Independent confirmation returns CONFIRM on the settled-route claim.
  T24:
    title: Settlement-first inverse case generation with independent replay validation
    initial_status: blocked
    depends_on:
    - T23
    proof_level: P2
    confirmation: independent
    settles: []
    settles_explanation: From the settled T23 route only, derive a candidate case for which that route should be a legitimate solution (settlement-first generation), freeze the candidate case record, then
      independently replay it from a fresh disposable target copy under the same frozen mechanism. The generated case is accepted only if the independent replay genuinely settles; otherwise it is rejected
      and recorded as invalid (tooth T7). An accepted case is appended to the developmental manifest with its route fingerprint, generator identity/version, replay reference, and actual settlement.
    changes: Adds the inverse generator and replay validator as task-local harness under the T24 evidence directory plus append-only generated-case records; nothing else.
    proves: That a settled route can produce a candidate inverse-generated case, that independent replay validates or rejects the case by real consequence, and that at least one valid consequence-backed
      synthetic case exists if the mechanism works (CLAIM B).
    does_not_prove: That the mechanism generates useful variation at lower payment (T25 measures that), breadth across case families, transfer to the judgment corpus, and architectural promotion.
    hot_context:
    - .agents/evidence/godspeed-bounded-judgment/T23/ (settled route record + fingerprint)
    - .agents/evidence/godspeed-bounded-judgment/T24/generate_case.py (authored this task)
    - .agents/evidence/godspeed-bounded-judgment/T24/verify_case.py (authored this task)
    steps:
    - Author generate_case.py (inverse generation from the frozen settled route; generator identity/version and prompt/config recorded) and verify_case.py at the gate path; freeze sha256s.
    - Freeze the candidate case record BEFORE replay; then replay independently (fresh target copy, same frozen config, fresh seed) through the real mechanism.
    - Accept only on genuine replay settlement; append the accepted generated-case record (or the rejection) to the developmental manifest.
    - Execute tooth T7 (an inverse case whose replay does not settle) as a recorded attack with expected rejection.
    independent_confirmation:
      verifier_receives:
      - the settled route record and fingerprint
      - the frozen candidate case record and the replay run records
      - the gauntlet state databases needed to recompute the replay settlement
      verifier_should_not_receive:
      - the builder narrative or the generator prompt beyond its frozen recorded form
      required_verdict: CONFIRM
    gate:
    - python3 .agents/evidence/godspeed-bounded-judgment/T24/verify_case.py
    teeth:
    - attack: Accept a generated case because the generator asserts it is solved by the route.
      expected: REJECTED; acceptance requires the independent replay's real settlement.
    - attack: Generate a case whose independent replay does not settle and admit it as valid developmental data.
      expected: Rejected and recorded as invalid; not added as valid developmental data.
    redesign_trigger: If settled routes cannot be inverted into replayable cases at all, stop and record the falsified layer (inverse generation) with evidence; do not widen acceptance.
    evidence: .agents/evidence/godspeed-bounded-judgment/T24/
    done_when:
    - At least one accepted consequence-backed generated case with independent replay settlement, or a recorded honest rejection with preserved evidence.
    - Tooth T7 executed with the expected rejection.
    - Independent confirmation returns CONFIRM on the case-generation claim.
  T25:
    title: Matched negative + payment evaluation against manual corpus construction
    initial_status: blocked
    depends_on:
    - T24
    proof_level: P2
    confirmation: independent
    settles: []
    settles_explanation: 'From the accepted positive generated case, remove exactly ONE prerequisite (payment capacity: max_rounds one notch below the discovered settling boundary), rerun through the real
      mechanism, and require the actual non-settlement consequence; the negative label is determined by settlement, never assigned. Then measure the mechanism''s payment against the manual T15/T16 corpus
      construction (operator decisions, wall-clock, model calls, tool executions, failed executions, tokens where observable, new route count, valid settled route count, valid generated case count, mechanism
      diversity, orchestration burden) and measure novelty of the generated route against the existing T15/T16 grid (novel / near-duplicate / structural duplicate). Duplicate routes are measured, not auto-rejected.'
    changes: Adds the matched-negative runner and payment/novelty evaluator as task-local harness under the T25 evidence directory plus append-only records; nothing else.
    proves: That the mechanism produces a controlled matched pair whose labels are determined by settlement, and what generating the fresh variation cost compared with the recorded manual process (CLAIM
      C's measurement surface).
    does_not_prove: That the mechanism is economically justified in general (one comparison on one surface), scale behavior, and architectural promotion (CLAIM D is out of scope for this branch).
    hot_context:
    - .agents/evidence/godspeed-bounded-judgment/T24/ (accepted generated case)
    - .agents/evidence/godspeed-bounded-judgment/T15/ and T16/ (manual-construction payment baseline records)
    - .agents/evidence/godspeed-bounded-judgment/T25/run_negative.py (authored this task)
    - .agents/evidence/godspeed-bounded-judgment/T25/verify_payment.py (authored this task)
    steps:
    - Author run_negative.py (single-factor matched negative through the real mechanism) and verify_payment.py at the gate path; freeze sha256s.
    - Run the matched negative; require the actual non-settlement consequence; record the pair.
    - Assemble the payment comparison table from recorded counters on both sides; mark unobservable quantities n/a honestly.
    - Compute route novelty against the T15/T16 grid; record the classification.
    - Execute tooth T8 (regenerate a structurally equivalent route) as a recorded attack; duplication must be detectable.
    independent_confirmation:
      verifier_receives:
      - the matched pair records and the underlying gauntlet state databases
      - the payment comparison table and its raw counters
      - the novelty classification and the fingerprints it compares
      verifier_should_not_receive:
      - the builder narrative or cost expectations
      required_verdict: CONFIRM
    gate:
    - python3 .agents/evidence/godspeed-bounded-judgment/T25/verify_payment.py
    teeth:
    - attack: Assign the negative label manually instead of by settlement.
      expected: REJECTED; verify_payment recomputes the label from the run_terminal consequence.
    - attack: Change two factors in the matched negative.
      expected: REJECTED; the mutation record pins exactly one changed factor.
    - attack: Regenerate a structurally identical route and claim novelty.
      expected: Duplicate fingerprint detected and recorded; no novelty claim possible.
