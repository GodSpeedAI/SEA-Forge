schema: agent.development_plan
schema_version: '1.0'
metadata:
  id: godspeed.casework-cognitive-environment.implementation
  title: "GodSpeed Casework System Front End and Cognitive Environment — Implementation Settlement Plan"
  status: draft
  version: 0.2.5
  created: '2026-09-19'
  purpose: >-
    Implement the frozen authoritative specification through a Go operational application and
    React cognitive environment, prove governed integration and parity, then remove the
    current SEA Forge Rust/Tauri GUI and Gauntlet TUI while retaining their backend engines.
source:
  spec:
    intended_repository_path: .agents/specs/godspeed.casework-cognitive-environment-spec.yaml
    artifact_name: godspeed.casework-cognitive-environment-spec.yaml
    spec_id: godspeed.casework-cognitive-environment
    spec_version: 0.2.4
    sha256: 4baac56017bfcff8ba51c58190f66a4b9a29de1baff267a66f66dc626c1f2891
    authority: normative
  implementation_brief:
    intended_repository_path: .agents/plans/godspeed-casework-cognitive-environment.implementation.md
    authority: non_normative_execution_context
    conflict_rule: >-
      The normative specification governs. Any conflict MUST be surfaced as a blocked decision rather than silently
      resolved by the implementing agent.
  supporting_sources:
  - path: AGENTS.md and repository-local agent instructions discovered by T00
    role: Repository-local execution conventions, commands, and constraints.
  - path: docs/decisions/ADR-006-godspeed-casework-ui-replacement.md
    role: Accepted replacement and removal boundary; the spec governs behavior.
  - path: SEA-Forge current implementation and case-engine documentation
    role: Current case/authority/evidence interfaces and existing tests; informs adapters but does not override
      the source spec.
  - path: Gauntlet current implementation and orchestration documentation
    role: Current execution-harness interfaces and evidence; informs the Execution Port adapter.
  - path: workbench/apps/desktop and workbench/AGENTS.md
    role: Existing React/Tauri GUI is a migration inventory and removal target, not the new application's transport.
  - path: $GAUNTLET_WORKTREE
    role: Isolated Gauntlet checkout; retain its Rust executor and remove its TUI after proven workflow parity.
  - path: .agents/reports/interface-contracts/
    role: Frozen application contract package; verify package existence and conformance before binding its types.
  - path: .tmp/donor/
    role: >-
      Selected mechanic donor checkouts: jshor/tycho, pmndrs/racing-game, rmarchet/blackhole-ts, frag2win/BLACK-HOLE,
      and AmitDigga/threejs-galaxy-shader.
target_settlement: >-
  A decoupled GodSpeed operating environment exists in which the Go system front end continuously coordinates governed
  casework through application-owned ports, the React cognitive environment renders and manipulates live cognitive
  projections through a small spatial/temporal/artifact grammar, humans and agents act through the same interaction
  model, consequential operations cross the governed Go/SEA-Forge boundary, history remains inspectable without
  rewriting source truth, and the complete FDE journey is evidenced under required variation, recovery, and independent
  confirmation, followed by evidence-backed removal of the two superseded UIs.
operating_contract:
  core_principle: >-
    Keep authority, execution, repository truth, operational coordination, and human representation separate: SEA-Forge
    owns governed case meaning/authority/settlement; Gauntlet executes; GitHub owns repository facts for enabled
    workflows; Go coordinates; React represents and interacts. The current Tauri GUI and Gauntlet TUI are removed
    only after replacement parity and real integration pass.
  parallel_work_isolation:
    required: true
    sea_forge_checkout: >-
      Start this plan in a dedicated sea-rs Git worktree and branch, separate from the operator's active checkout.
      Its own .agents/CURRENT_STATUS.md and .agents/current_status.yml are the canonical handoff files for this
      plan. Do not edit the active checkout's status files or substitute a sidecar for the repository handoff gate.
    gauntlet_checkout: >-
      Set GAUNTLET_WORKTREE to the absolute path of a dedicated Gauntlet Git worktree before T00. Never run
      Gauntlet gates or removal commands against the operator's active Gauntlet checkout. Verify the variable
      points to the intended worktree and that its unrelated work is preserved before each cross-repository step.
    bootstrap: >-
      A new worktree does not inherit uncommitted or untracked files. Transfer the reviewed spec, plan,
      validator, and ADR into the dedicated sea-rs worktree without copying unrelated changes; compare the
      transferred spec SHA-256 with source.spec.sha256 before T00. Do not fetch, reset, clean, merge, or publish
      to bootstrap. If the required artifacts cannot be transferred faithfully, stop before implementation.
    integration: >-
      At final integration, manually reconcile this worktree's canonical status and evidence with the then-current
      active checkout. Never overwrite newer status from other work or claim that a worktree-local context-check
      validates the active checkout's handoff state.
  build_resource_policy:
    preflight: >-
      Before every compile, test, or broad verification gate, inspect MemAvailable in /proc/meminfo, the current
      process cgroup's memory limit/usage when finite, /proc/pressure/memory, swap usage, and other active builds.
      Effective headroom is the smaller of MemAvailable and finite cgroup limit minus usage. Record the readings
      in task evidence. A missing cgroup limit means use host MemAvailable; it is not zero headroom.
    scheduling: >-
      Run at most one heavy build or test gate across these worktrees at a time. Coordinate with the operator's
      ongoing sea-rs and Gauntlet work; do not kill or pause its processes. Use CARGO_BUILD_JOBS=1 for the first
      Rust baseline and similarly limit Go build parallelism. Defer a broad gate when another build is active or
      effective headroom is below the observed peak for that gate plus a safety margin. Until a peak is known,
      begin with a narrow single-job gate and observe it; do not guess that swap makes an OOM safe.
    proof_rule: >-
      A resource-deferred gate remains pending, never passed. Resume and run every required gate before settlement.
    resource_deferred_mode: >-
      If Rust compilation is unsafe, finish T00's read-only inventory and spec checks, then implement and verify
      Go/React tasks whose listed gates do not require Rust. Work on a Rust-gated task may be staged as provisional
      implementation, but that task and its dependents remain unsettled until every listed gate passes. Do not
      alter dependency edges, mark a resource-deferred gate green, or remove the old UIs during this mode. At each
      handoff, record the exact deferred commands, affected task IDs, current code state, and next resource-safe
      verification action in the worktree's canonical status files.
  rules:
  - Settle tasks by dependency, not by narrative order; provisional implementation under resource-deferred mode
    never satisfies a dependency.
  - Independent tasks MAY run in parallel only after all declared dependencies are settled.
  - A gate becomes applicable when its activation task creates it; a missing planned gate blocks that task and all dependents.
  - Architectural and dependency changes require the review/approval required by AGENTS.md before implementation.
  - Every task MUST leave the repository in a coherent state with all applicable global gates green.
  - >-
    A task is not complete because code exists, a process starts once, the builder reports success, or a happy-path
    test passes.
  - A passing gate proves only what that gate actually observes.
  - High-risk P3 work requires fresh independent/adversarial confirmation.
  - Do not generalize from one observation unless the normative requirement is itself general.
  - >-
    Do not silently widen domain, schema, API, config, service, or authority surfaces when an existing representation
    can preserve the required distinction.
  - >-
    Runtime/machine/provider-specific facts belong in the project's established config/secret hierarchy rather than
    scattered hardcoding.
  - Preserve failed evidence and correction history.
  - >-
    Do not change .sea grammar for UI, transport, provider, runtime, or integration features unless repository evidence
    demonstrates a genuinely new semantic distinction that the source spec cannot preserve through projection/adaptation.
  - >-
    Fixture/local adapters may prove UI-core isolation and interaction behavior; they MUST NOT be used as evidence
    of governed integration or settlement.
  - >-
    The selected donor repositories are implementation inputs for the scene mechanics. Any copied code must remain
    license-compatible, source provenance must be recorded, and extraction must terminate at GodSpeed-owned seams.
  claim_states:
  - OBSERVED
  - INFERRED
  - DECIDED
  - ASSUMED
  - UNKNOWN
  correction_protocol:
  - Preserve the failed evidence.
  - >-
    Classify the failure: implementation, oracle/test, representation, missing prerequisite, environmental confound,
    or source-spec ambiguity.
  - Determine whether the governing requirement/invariant remains valid.
  - Correct the smallest falsified layer.
  - Rerun the original teeth/falsification check.
  - Rerun the original confirmation path.
  - Append the correction round; do not erase the failed round.
  - Do not weaken acceptance merely because the implementation repeatedly fails it.
  scope_control: >-
    A newly discovered issue enters the current plan only when it blocks a normative requirement or is itself required
    by the source specification. Valuable but independent discoveries become future debt/plans. Attractive architecture
    with no requirement is rejected from current scope.
artifacts:
  current_status: .agents/current_status.yml
  current_status_scope: dedicated_sea_forge_worktree_only
  decision_log: .agents/reports/godspeed-casework-cognitive-environment/decision-log.yaml
  evidence_root: .agents/evidence/godspeed-casework-cognitive-environment
  reports_root: .agents/reports/godspeed-casework-cognitive-environment
  preregistration_root: .agents/preregistrations/godspeed-casework-cognitive-environment
  status_rule: >-
    Mutable current status is an operational projection and MUST NOT become a source of desired-state or normative
    authority.
verification:
  global_gates:
  - id: GATE_SPEC_TRACE
    command: python3 .agents/plans/validate-godspeed-casework-cognitive-environment.py
    activation_task: T00
  - id: GATE_SEAFORGE
    command: just check && just test && just ci && just proof
    activation_task: T05
  - id: GATE_GAUNTLET
    command: cd "$GAUNTLET_WORKTREE" && just check && just test && just ci
    activation_task: T05
  - id: GATE_GO
    command: just casework-go-check
    activation_task: T01
  - id: GATE_UI
    command: just casework-ui-check
    activation_task: T03
  - id: GATE_INTEGRATED
    command: just casework-integrated
    activation_task: T11
  - id: GATE_REMOVAL
    command: just casework-removal-check
    activation_task: T14
  gate_binding_rule: >-
    Existing SEA Forge and Gauntlet commands run as written. T01, T03, T11,
    and T14 must add the named root just recipes over their actual target
    implementations before their own tasks can settle. A missing recipe is
    BLOCKED, never a passing or skipped gate. All commands run from the SEA
    Forge repository root; the Gauntlet gate changes directory explicitly.
  proof_levels:
    P0: Mechanical/deterministic change. Requires a narrow direct gate plus applicable global gates.
    P1: Normal behavioral work. Requires positive behavior, a meaningful teeth/falsification check, and applicable
      global gates.
    P2: >-
      Invariant-sensitive work. Requires an explicit or preregistered claim, meaningful adversarial/negative evidence,
      an evidence artifact, applicable global gates, and review of a plausible alternate failure path.
    P3: >-
      Settlement-critical work. Requires frozen preregistration, builder evidence, explicit adversarial attacks,
      fresh independent confirmation, and correction/re-confirmation after any failed confirmation.
