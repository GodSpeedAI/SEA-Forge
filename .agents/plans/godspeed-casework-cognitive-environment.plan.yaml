tasks:
  T00:
    title: Freeze source authority, repository topology, gate bindings, and execution context
    initial_status: ready
    depends_on: []
    proof_level: P2
    confirmation: peer
    settles: []
    changes: >-
      Verifies the bound spec revision, inspects the real SFWP/Gauntlet/Workbench
      seams and both removal targets, records missing capabilities, and freezes
      the reviewed architecture/dependency decisions before code changes.
    proves: >-
      A cold agent can locate both repositories, reproduce the spec hash,
      distinguish existing gates from planned gates, enumerate 86 requirements,
      and state exactly which SFWP methods or integrations are absent.
    does_not_prove: Does not prove any product capability, adapter compatibility, UI behavior, or end-to-end integration.
    preregistration:
      required: true
      artifact: .agents/preregistrations/godspeed-casework-cognitive-environment/T00.prereg.yaml
      claim: The authoritative source spec and repository execution context can be frozen unambiguously before implementation.
      falsifier: >-
        Two incompatible source specs claim equal authority, a required repository cannot be located, or required
        project gates cannot be identified without inventing desired behavior.
      known_confounds:
      - Stale copied docs or old repository clones can resemble current authority.
      confirmation_condition: Peer reviewer independently reproduces the spec hash, repository locations, gate bindings,
        and 86/86 traceability count.
    hot_context:
    - .agents/specs/godspeed.casework-cognitive-environment-spec.yaml
    - AGENTS.md files from each target repository and workspace root
    - SEA-Forge repository case/runtime/authority interfaces and existing tests
    - Gauntlet repository execution interfaces and existing tests
    - workbench/AGENTS.md and the existing desktop GUI removal inventory
    - $GAUNTLET_WORKTREE/AGENTS.md and its TUI/engine boundary
    steps:
    - >-
      Confirm sea-rs as the target for apps/godspeed-casework-go and
      apps/godspeed-cognitive-ui in the dedicated sea-rs worktree; inspect
      $GAUNTLET_WORKTREE read-only. Confirm neither path is the operator's
      active checkout before any build or write.
    - >-
      Confirm both dedicated worktrees, the transferred plan/spec/validator/ADR,
      and this worktree's canonical status files. Record the active checkout
      paths for exclusion, not for writing. Run the build-resource preflight
      before each baseline gate; defer a gate if headroom is inadequate.
      Record exact SFWP methods, auth semantics, event replay, history
      availability, and missing seams. Do not assume GitHub or donors exist.
    - >-
      Recompute SHA-256 for the bound spec path and run GATE_SPEC_TRACE.
      Any spec revision requires a new plan hash/version and reconfirmation.
    - >-
      Parse the source spec requirement IDs and verify there are exactly 86 normative REQ-* records represented by this
      plan with zero unknown IDs.
    - >-
      If resource preflight permits, execute the existing SEA Forge and Gauntlet
      gates serially and record their real baseline. Otherwise record each as
      RESOURCE_DEFERRED, including readings and the exact command to run later.
      Record Go, UI, integrated, and removal gates as planned with the
      activation tasks named above; never mark a missing or deferred recipe passed.
    - >-
      If an attempted existing gate is red, record its exact failing assertion
      and revision, repair it without weakening the gate, or mark T00 BLOCKED
      with a concrete prerequisite. A failed baseline is not a resource deferral.
    - >-
      Record concrete current interfaces, repository ownership boundaries, toolchain versions, target runtime assumptions,
      and discovered incompatibilities in the implementation brief without changing normative requirements.
    - >-
      Create the implementation brief in .agents/plans/, with exact API and
      removal inventories. Prepare required ADR/dependency review before
      implementing new module or protocol boundaries.
    gate:
    - GATE_SPEC_TRACE
    - test -f .agents/plans/godspeed-casework-cognitive-environment.implementation.md
    teeth:
    - attack: Modify one byte of a copied spec and run the frozen-hash check.
      expected: The binding check detects hash divergence; execution blocks until authority is explicitly re-frozen.
    - attack: Claim an absent Go, GitHub, donor, or SFWP capability already exists.
      expected: Inventory identifies the missing seam and blocks the dependent task until implemented and tested.
    redesign_trigger: >-
      Repository inspection shows that the source spec assumes an ownership boundary that does not exist or cannot
      be introduced without changing SEA-Forge/Gauntlet semantics; stop and raise a source-spec decision rather
      than fabricating a parallel subsystem.
    evidence: .agents/evidence/godspeed-casework-cognitive-environment/T00/
    done_when:
    - The frozen SHA-256 verifies; each existing gate baseline is recorded as passed or RESOURCE_DEFERRED
      without claiming an unrun gate passed.
    - The implementation brief contains repository-specific hot context sufficient for a cold agent.
    - Traceability reports 86/86 mapped requirements, zero unknown plan IDs, and zero unmapped requirements.
    - All T00 teeth pass.
  T01:
    title: Establish application-owned ports, configuration authority, typed errors, and preflight
    initial_status: blocked
    depends_on:
    - T00
    proof_level: P2
    confirmation: peer
    settles:
    - REQ-CONFIG-001
    - REQ-CONFIG-002
    - REQ-CONFIG-003
    - REQ-CONFIG-004
    - REQ-CONFIG-010
    - REQ-CONFIG-011
    - REQ-CONFIG-012
    - REQ-ARCH-001
    - REQ-ARCH-002
    changes: >-
      Creates apps/godspeed-casework-go, binds the frozen React application contract package, and establishes one
      config/secret authority per application, typed errors, port ownership, and preflight.
    proves: >-
      Provider/runtime technologies can be connected without becoming the stable application model, and invalid/missing
      configuration fails with the specified blast radius before consequential operation.
    does_not_prove: >-
      Does not prove SEA-Forge/Gauntlet compatibility, cognitive projection quality, UI interaction behavior, or
      real execution.
    preregistration:
      required: true
      artifact: .agents/preregistrations/godspeed-casework-cognitive-environment/T01.prereg.yaml
      claim: >-
        Both applications can own stable ports/config/error contracts without importing vendor/provider schemas
        into their cores.
      falsifier: >-
        A core behavior required by the spec is impossible without provider-specific types or multiple competing
        configuration authorities.
      known_confounds:
      - Convenient code generation can hide provider types behind aliases while preserving the coupling.
      confirmation_condition: Peer review plus boundary tests show provider replacement points terminate at adapters.
    hot_context:
    - .agents/plans/godspeed-casework-cognitive-environment.implementation.md
    - .agents/reports/interface-contracts/ (frozen application contract package)
    - Existing project config conventions and secret hierarchy discovered by T00
    - Current SEA-Forge/Gauntlet public interfaces only for shape discovery, not semantic duplication
    - Source spec domain_contract, target_layout, and REQ-CONFIG/REQ-ARCH records
    steps:
    - >-
      Verify .agents/reports/interface-contracts/ exists and its conformance tests pass; bind the application to its
      frozen TypeScript types/contracts and examples without rediscovering or duplicating SEA-Forge, Gauntlet,
      RealityTrace, CMMN, SFWP, or case semantics.
    - >-
      Define Go-owned port interfaces and stable application error/result types without embedding provider-native
      payloads in core packages.
    - >-
      Bind React-owned world/interaction/agent/artifact/temporal adapter seams to the frozen application contract
      package without depending on R3F, CopilotKit, or Go transport types.
    - >-
      Implement a single documented configuration precedence/validation path per application, including secret indirection
      and runtime/provider endpoint configuration.
    - >-
      Implement startup/preflight checks that validate REQUIRED configured capabilities before live operation and
      report typed degraded/blocking states.
    - >-
      Add boundary tests proving provider-native/vendor objects are translated at adapters and do not leak into
      stable core interfaces.
    - Add the root casework-go-check just recipe for Go format, vet, and tests.
    gate:
    - GATE_SPEC_TRACE
    - GATE_GO
    teeth:
    - attack: Inject an unknown provider payload type directly into a core application path.
      expected: Compilation/type tests or boundary tests reject the leakage; adapter translation is required.
    - attack: Start with one missing required adapter credential and one optional artifact adapter unavailable.
      expected: Required consequential capability blocks with typed error; unrelated/optional capability remains
        available.
    redesign_trigger: >-
      A required semantic distinction cannot be expressed without importing SEA-Forge/Gauntlet/vendor ontology directly
      into the application core; stop and revisit the port representation instead of spreading provider types.
    evidence: .agents/evidence/godspeed-casework-cognitive-environment/T01/
    done_when:
    - Port ownership and configuration authority are implemented and documented.
    - Preflight and typed-error tests pass with the declared blast radius.
    - Provider-object leakage teeth pass.
    - All applicable global gates remain green.
  T02:
    title: Freeze selected donor revisions, licenses, extraction boundaries, and GodSpeed target seams
    initial_status: blocked
    depends_on:
    - T00
    proof_level: P2
    confirmation: peer
    settles:
    - REQ-DONOR-001
    - REQ-DONOR-002
    - REQ-DONOR-003
    changes: >-
      Freezes the selected donor revisions, licenses/notices, supplied affordances, extraction boundaries, candidate
      source files/symbols, copied versus independently adapted mechanics, and GodSpeed-owned target seams.
    proves: >-
      Selected donor mechanics can be extracted and adapted without importing donor ontology into GodSpeed contracts
      or crossing an unreviewed license/dependency boundary.
    does_not_prove: Does not prove the resulting temporal or narration behavior; later tasks must integrate and
      verify those mechanics.
    preregistration:
      required: true
      artifact: .agents/preregistrations/godspeed-casework-cognitive-environment/T02.prereg.yaml
      claim: >-
        Each selected donor has an exact revision, license/notice record, bounded extraction plan, and GodSpeed-owned
        receiving seam before implementation begins.
      falsifier: >-
        A selected donor cannot be narrowed to the declared affordance and seam, or source license obligations conflict
        with the intended project distribution and cannot be cleanly isolated.
      known_confounds:
      - Forks/clones may carry different licenses from canonical donor repositories.
      confirmation_condition: Peer reviewer checks canonical source provenance, licenses, copied scope, and public-interface
        independence.
    hot_context:
    - Target dependency inventory and repository approval rules
    - >-
      Selected donors: jshor/tycho, pmndrs/racing-game, rmarchet/blackhole-ts, frag2win/BLACK-HOLE,
      AmitDigga/threejs-galaxy-shader
    - Selected donor checkouts under .tmp/donor/ and their canonical revision/license/notice records.
    steps:
    - Deterministically narrow each selected donor to candidate source files/symbols and its supplied affordance.
    - Freeze what will be copied, what will be independently adapted, and the GodSpeed-owned interface receiving it.
    - Obtain required license/provenance and dependency review before copying or adapting donor mechanics.
    - Keep donor nouns and types out of GodSpeed application contracts.
    gate:
    - GATE_SPEC_TRACE
    teeth:
    - attack: Search application-core public interfaces for selected donor ontology or donor product types/namespaces.
      expected: No selected donor ontology leaks into stable application contracts.
    - attack: Attempt to copy donor code outside the frozen extraction boundary.
      expected: Review rejects the change or requires a revised, explicit GodSpeed-owned seam before implementation.
    redesign_trigger: >-
      A selected mechanic cannot be legally reused or reduced without importing donor ontology; replace only that
      mechanic with an independent implementation behind the same GodSpeed-owned port and record the exception.
    evidence: .agents/evidence/godspeed-casework-cognitive-environment/T02/
    done_when:
    - Donor records freeze exact revisions, affordances, extraction boundaries, provenance/notices, and copied/adapted scope.
    - GodSpeed-owned temporal/choreography interfaces are independent of donor product models.
    - License/provenance review is complete for every copied file.
    - All applicable global gates remain green.
  T03:
    title: Implement the React UI core and local world adapter
    initial_status: blocked
    depends_on:
    - T01
    proof_level: P2
    confirmation: peer
    settles:
    - REQ-GOAL-002
    - REQ-GOAL-003
    - REQ-OUT-002
    - REQ-ARCH-003
    - REQ-ARCH-004
    changes: >-
      Creates the replacement React application at apps/godspeed-cognitive-ui
      with a renderer-independent model for surfaces, objects, relationships,
      focus, time, artifacts, and actions; supplies a fixture adapter for core tests.
    proves: >-
      The real UI architecture exists independently of Go transport, SEA-Forge, GitHub, Gauntlet, CopilotKit, and
      Three.js, and can be exercised against synthetic worlds without changing its interaction grammar.
    does_not_prove: >-
      Does not prove spatial rendering quality, real Go integration, agent interaction, historical correctness,
      or consequential action.
    preregistration:
      required: true
      artifact: .agents/preregistrations/godspeed-casework-cognitive-environment/T03.prereg.yaml
      claim: >-
        The cognitive interaction model is independently executable with synthetic projections and contains no backend
        or renderer authority.
      falsifier: Core behavior cannot be tested without importing Go/SEA-Forge/R3F/CopilotKit implementation objects.
      known_confounds:
      - Thin wrapper types can hide direct vendor coupling.
      confirmation_condition: Peer review and dependency tests confirm core packages reference only application-owned
        abstractions.
    hot_context:
    - Source spec domain_contract and REQ-GOAL/REQ-ARCH records
    - .agents/reports/interface-contracts/ (frozen types, client, mock adapter, schemas, and examples)
    - T01 React-owned port interfaces
    - Current frontend conventions/package manager discovered by T00
    steps:
    - >-
      Use the reconciled frozen interface-contract package as the type authority; verify its
      prose/type/schema wire-shape parity and focused conformance test during T03's typed parity
      check. Full draft-2020-12 JSON Schema semantic validation is not part of this package gate;
      do not rediscover backend or case semantics.
    - >-
      Implement stable UI-core representations: SurfaceProjection, CognitiveObject, CognitiveRelationship, TemporalContext,
      CognitiveArtifact descriptor, and InteractionIntent/action vocabulary.
    - >-
      Implement local UI state for focus, selection, surface, time, artifact,
      and narration with the simplest existing repository pattern.
