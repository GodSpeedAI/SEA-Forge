final_acceptance:
  architecture_and_ownership:
  - >-
    SEA-Forge remains the authority/evidence/settlement owner; Gauntlet remains executor; GitHub remains repository
    truth; Go remains operational coordinator; React remains representation/interaction.
  - >-
    Go and React application cores contain only stable owned abstractions and can replace external adapters without
    rewriting core semantics.
  - >-
    No .sea grammar change was introduced unless separately justified by a genuine new semantic distinction and
    explicit source-spec revision.
  operational_casework:
  - >-
    Available governed work can be claimed/leased, executed, observed, reconciled, and released without duplicate
    consequential execution.
  - Executor/repository completion is preserved as observation and cannot independently become governed settlement.
  - Missed events, restarts, stale leases, and infrastructure failures take bounded recovery paths with preserved
    evidence.
  cognitive_environment:
  - >-
    The user can orient at Core, focus/zoom through generic objects/relationships, and operate through the small
    approved interaction grammar.
  - Visible complexity remains projection-driven and sparse when little deserves attention.
  - The UI remains useful in degraded non-agent mode.
  temporal_and_artifacts:
  - Live/historical/compare/return-to-now work through shared application time without rewriting authoritative history.
  - >-
    Cognitive artifacts progressively disclose source material, remain traceable, are ephemeral by default, and
    persist only through the governed backend path.
  - Heavy artifact renderers remain lazy and optional.
  agent_and_narration:
  - The selected agent adapter receives current UI context and requests UI-owned actions rather than renderer mutations.
  - >-
    Narration can direct semantic beats, scene changes, evidence, and interactive artifacts; users can interrupt/inspect/branch/resume.
  - Agent-originated consequential actions use the same governed path as equivalent human actions.
  evidence_and_confirmation:
  - Every normative REQ record has a settled implementation or documented disposition; MUST obligations require real proof.
  - Every P3 task has the required fresh independent confirmation.
  - Failed/correction evidence has not been erased.
  - Documentation/status claims do not exceed observed proof.
  - All global gates exit 0.
  - Final traceability is mechanically 86/86 and a fresh cold independent verifier returns CONFIRM on the target
    build.
  migration_and_removal:
  - The SEA Forge Tauri/Rust GUI and Gauntlet TUI are removed from source and supported builds after verified parity.
  - The Rust governed server/kernel and Gauntlet executor/evidence path still pass their required gates.
  - The replacement is the sole supported human UI, with tested recovery and no dual authority.
guardrails:
- >-
  Do not expose or duplicate SEA-Forge/CMMN/internal GodSpeed ontology in the React interaction model merely because
  the backend uses it.
- Do not let Go derive governed availability, authority, or settlement from GitHub, Gauntlet, local leases, or UI
  state.
- Do not let fixture/local adapters count as evidence of real SEA-Forge/Gauntlet/GitHub integration.
- Do not make a timeline renderer, graphics library, or agent framework own the UI grammar.
- Do not persist ephemeral cognitive artifacts without an explicit backend persistence operation and authorization.
- Do not retry an uncertain consequential operation until reconciliation establishes a safe state.
- Do not import donor product ontology or source code whose license is incompatible with the target distribution
  posture.
- Do not expand .sea grammar for this implementation unless a separate semantic requirement is explicitly established.
- Do not claim completion by hiding or relabeling either old UI; T14 requires actual source/build removal.
handoff_contract:
  must_report:
  - settled capabilities/requirements
  - explicitly unsettled or deferred items
  - current operational system state
  - requirement-to-evidence index
  - known limitations
  - rollback/recovery instructions where relevant
  - important decisions/discoveries that changed the execution model
  - donor-derived code/mechanics and license notices
  - "exact next executable action or 'none \u2014 plan settled'"
  settled_next_action_rule: "The next executable action MUST be set to `none \u2014 plan settled` only after the\
    \ final required conformance/confirmation task succeeds."
