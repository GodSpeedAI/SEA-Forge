  governed_workflows:
    - "Case preflight stale state displays 'Rejected as stale' (blocked) and disables commit."
    - "A failed preflight displays 'Preflight failed', never 'Not yet run'."
    - "Sidebar inbox badge displays real pending count and hides when zero."
    - "Approval inbox resolves three duty standings; neither self-approval nor an unverifiable one presents as permitted, and Reject stays available in both."
    - "Delegation workbench dispatches agent tasks into the kernel with a non-empty `request_id`, and refuses to dispatch a contract the operator has not read."
    - "Case horizon items allow evidence inspection in EvidenceDrawer and link failed or terminated items to their run records; no kernel-less control is offered."

