# -----------------------------------------------------------------------------
# TARGET SETTLEMENT
# -----------------------------------------------------------------------------
target_settlement: >-
  The desktop workbench is fully operational, non-blocking, and evidence-faithful. An operator can
  navigate all surfaces via keyboard command search (`/`) without browser halts; preflight states
  truthfully report 'Rejected as stale' on template changes; the sidebar inbox badge reflects real
  pending counts; separation of duty prevents self-approval in the UI; delegation contracts can be
  dispatched into live execution; case plan items support proof inspection in the drawer; the status
  system differentiates stale from degraded states; and all text satisfies WCAG AA contrast.

# -----------------------------------------------------------------------------
# OPERATING CONTRACT
# -----------------------------------------------------------------------------
operating_contract:
  core_principle: >-
    Ports and Adapters / Governed Client Architecture: The desktop renderer is a governed client
    communicating strictly through typed Tauri IPC. It must never mutate server records optimistically,
    must never collapse distinct lifecycle states, and must never present unverified data as truth.

  rules:
    - "Execute tasks by dependency, not by narrative order."
    - "Independent tasks MAY run in parallel only after all declared dependencies are settled."
    - "Every task MUST leave the repository in a coherent state with all applicable global gates green."
    - "A task is not complete because code exists, a process starts once, or a happy-path test passes."
    - "A passing gate proves only what that gate actually observes."
    - "High-risk P3 work requires fresh independent/adversarial confirmation."
    - "Zero `alert()` or `confirm()` calls are permitted anywhere in the frontend codebase."
    - "Filter a single suite from its package directory, never from the workspace root — see `verification.command_conventions`."
    - "A value the client has not read renders as unknown, never as zero, absent, or failed."
    - "Where a task step says `verify only`, confirm the behaviour already holds and add the regression test; do not rewrite working code."
    - "Do not modify backend Rust crates (`crates/`) or SFWP protocol schemas as part of this plan."
    - "Preserve failed evidence and correction history."

  claim_states:
    - OBSERVED
    - INFERRED
    - DECIDED
    - ASSUMED
    - UNKNOWN

  correction_protocol:
    - "Preserve the failed evidence."
    - "Classify the failure: implementation, test oracle, representation, or environment."
    - "Correct the smallest falsified layer."
    - "Rerun the original teeth/falsification check."
    - "Rerun the original confirmation path."
    - "Append the correction round; do not erase the failed round."
    - "Do not weaken acceptance merely because the implementation repeatedly fails it."

  scope_control: >-
    Issues entering this plan must directly settle requirements in `spec-workbench-frontend-remediation.yaml`.
    Backend SFWP projection expansions (e.g. implementing `domain.list_models` in `sea-forge-server`)
    remain roadmapped and are strictly out of scope for this frontend remediation plan.

