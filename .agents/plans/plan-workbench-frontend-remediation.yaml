    - "Total test count strictly exceeds the measured baseline of 169, and every `validation_matrix.core_conformance` row names a passing test."
    - "Every deferral in `roadmap_boundaries` is restated in the handoff, so nothing that was scoped out reads as done."

# -----------------------------------------------------------------------------
# GUARDRAILS
# -----------------------------------------------------------------------------
guardrails:
  - "Do NOT alter SFWP protocol contracts or Rust kernel crates during this frontend remediation."
  - "Do NOT fabricate mock responses on unbacked surfaces (`/models`, `/memory`, `/capabilities`, etc.); preserve honest UnbackedSurface standing."
  - "Do NOT weaken or disable any unit or integration tests to achieve green."
  - "Do NOT use `alert()`, `confirm()`, or unhandled promise rejections."
  - "Do NOT mutate canonical server records directly; all state transitions flow through Tauri IPC commands."
  - "Do NOT edit `workbench/packages/sea-forge-ui-tokens/sea-forge.tokens.css` or any token value in `.agents/specs/frontend/colors_and_type.css`."
  - "Do NOT add Case Horizon item controls (dispatch, park, cancel, retry); no SFWP method backs them."
  - "Do NOT filter a test suite from the workspace root; the filter reaches only the ui-components leg."
  - "Do NOT send a protected command without a non-empty `request_id`; the server refuses it before admission."
  - "Do NOT render an unread value as zero, absent, or failed."

# -----------------------------------------------------------------------------
# HANDOFF CONTRACT
# -----------------------------------------------------------------------------
handoff_contract:
  must_report:
    - "Settled capabilities (CommandPalette, Stale and Failed Preflight, Duty Separation, Delegation Dispatch, Dynamic Badges, Journey Phase Resolution, Contrast Remediation)"
    - "Confirmed test counts against the 169 baseline, and static check results"
    - "Requirement-to-task settlement matrix"
    - >-
      Deferrals, restated so nothing scoped out reads as done: unbacked kernel surfaces; Case Horizon
      item control; the fourteen-item sidebar (audit 4.10, awaiting the product decision in audit open
      question 3); route guards G3-G8 and G10 (audit 4.11, no backing SFWP method); readiness source
      record body content; and any `--fg-tertiary` token value revision.
    - "Verification commands used"
    - "Exact next executable action or 'none — plan settled'"

  settled_next_action_rule: >-
    The next executable action MUST be set to `none — plan settled` only after
    Task T09 succeeds with full verification evidence recorded.

