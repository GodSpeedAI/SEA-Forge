      - "Confirm (do not change) that `overallLabel` already maps `stale` to `\"Readiness stale\"`."
      - "Rework `inspectSource` to emit labelled record coordinates rather than a stringified struct."
      - "In `ReadinessPage.test.tsx`: add tests for the `stale` variant and the labelled source fields."
      - "Run `cd workbench/apps/desktop && bun run test ReadinessPage`."

    gate:
      - "cd workbench/apps/desktop && bun run test ReadinessPage"
      - "cd workbench && bun run check"

    teeth:
      - attack: "Mock `overall: 'stale'`. If `overallVariant` collapses it, test asserting `data-variant='stale'` must fail."
        expected: "Test fails if `overallVariant` returns 'degraded'."

    redesign_trigger: >-
      `ReadinessView["overall"]` no longer admits `'stale'`. Verified 2026-09-04 against
      `workbench/packages/contracts/generated/ReadinessView.ts:32` — it does admit it, so this trigger
      is defensive only. Note that `T01` must land first: returning `'stale'` before
      `KNOWN_VARIANTS` contains it silently renders `unknown`.

    evidence: ".agents/evidence/frontend-remediation/T02_readiness_stale.txt"

    done_when:
      - "`ReadinessPage.test.tsx` passes with new stale variant assertions."
      - "All desktop tests remain green."

  # ---------------------------------------------------------------------------
  # TASK 3: Preflight Stale Shadowing Inversion in Case Creation
  # ---------------------------------------------------------------------------
  T03:
    title: "Invert Preflight Stale Ternary Shadowing in CaseCreationWorkbench"
    initial_status: blocked
    depends_on: ["T00"]
    proof_level: P2
    confirmation: builder_with_teeth

    settles:
      - "REQ-GOAL-002"
      - "REQ-PREFLIGHT-001"
      - "REQ-PREFLIGHT-002"
      - "REQ-PREFLIGHT-003"
      - "REQ-PREFLIGHT-004"
      - "REQ-SAFE-001"
      - "REQ-OUT-003"

    changes: >-
      1. `workbench/apps/desktop/src/pages/CaseCreationWorkbench.tsx:138-155`: replace the two nested
         ternaries feeding `GovernedStatusPill`'s `variant` and `label` with Algorithm 1
         (`resolve_preflight_pill_state`) from the spec, evaluated in order:
         `rejected_as_stale` -> `ok === true` -> `ok === false` -> no response.
      2. The same change settles REQ-PREFLIGHT-004: a preflight that ran and refused
         (`preflight.ok === false`) currently falls through to `"Not yet run"`, reporting a performed
         check as an unperformed one. It must read `"Preflight failed"` (variant `blocked`).
      3. VERIFY ONLY — line 163 already renders `"Re-run preflight"` when
         `state === "rejected_as_stale"`. Confirm; do not rewrite.
      4. VERIFY ONLY — `canCommit = state === "preflight_ok" && commitAction.isAllowed` (line 53)
         already disables commit on stale. Confirm and add the regression assertion; do not rewrite.
      5. In `CaseCreationWorkbench.test.tsx`: add one test for `preflight.ok === true` with
         `state === "rejected_as_stale"` (pill = `Rejected as stale`, variant `blocked`, commit
         disabled) and one for `preflight.ok === false` (pill = `Preflight failed`).

    proves: >-
      A preflighted case draft that becomes stale due to modified templates or digests immediately
      displays 'Rejected as stale' (blocked) and disables commit, preventing false-green authorizations.

    does_not_prove: >-
      Does not prove server-side digest hashing algorithm in Rust kernel.

