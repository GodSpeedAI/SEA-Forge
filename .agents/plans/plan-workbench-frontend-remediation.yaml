    gate:
      - "cd workbench/apps/desktop && bun run test DelegationWorkbench"
      - "cd workbench/apps/desktop && bun run test useDelegations"
      - "cd workbench && bun run check"

    teeth:
      - attack: "Dispatch with a mocked `invoke`; read the `command` argument."
        expected: "`verb === 'delegate'`, `endpoint`/`instruction`/`max_turns` present, and `request_id` a non-empty string. A payload without `request_id` fails — the server would refuse it with `durable_locator_required` and the UI would show a button that never runs anything."
      - attack: "Edit the instruction after reading the contract, then click Dispatch."
        expected: "Disabled while `stale` is true; the operator cannot dispatch a contract they did not read."
      - attack: "Dispatch with `model` and `token_budget` left blank."
        expected: "Both keys are absent from the payload, not sent as empty string or 0. A zero token budget would instruct the kernel to spend nothing, which is not what a blank field means."
      - attack: "Mock the response as `{ error: '...' }`."
        expected: "The roster is still invalidated, no navigation occurs, and the error is shown."

    redesign_trigger: >-
      `SfwpCommand::Delegate` leaves the bridge, or `Request::Delegate` leaves
      `requires_durable_locator`. Verified 2026-09-04: the variant exists at `bridge.rs:211` with
      fields `endpoint, instruction, run_id?, model?, max_turns, token_budget?, policy?, entity?,
      process?, request_id?`, and `lib.rs:1323` lists it under `requires_durable_locator`.

    evidence: ".agents/evidence/frontend-remediation/T07_delegation_dispatch.txt"

    done_when:
      - "`DelegationWorkbench.test.tsx` passes with dispatch execution assertions."
      - "`cd workbench && bun run check` passes."

  # ---------------------------------------------------------------------------
  # TASK 8: Case Horizon Plan Item Inspection & Retry Links
  # ---------------------------------------------------------------------------
  T08:
    title: "Implement Plan Item Inspection in EvidenceDrawer and Retry Links in CaseHorizonPage"
    initial_status: blocked
    depends_on: ["T00"]
    proof_level: P1
    confirmation: builder

    settles:
      - "REQ-GOAL-006"
      - "REQ-HORIZON-001"
      - "REQ-HORIZON-002"
      - "REQ-HORIZON-003"

    changes: >-
      1. `workbench/apps/desktop/src/pages/CaseHorizonPage.tsx`:
         - In `HorizonRow`, call `useEvidenceContext()` and add an "Inspect" button passing the plan
           item — id, kind, both standings, `depends_on`, `last_event_at`, `run_ids` — to
           `inspectEvidence`.
         - When `item.execution` is `'failed'` or `'terminated'`, render a link to `/runs/$runId` for
           each entry in `item.run_ids`, so the operator reaches the episode that explains the
           standing. `ExecutionStanding` is `pending | enabled | active | completed | failed |
           terminated`; there is no `'cancelled'` member, and referring to one would not compile.
      2. Add NO retry, dispatch, park, or cancel control (REQ-HORIZON-003). The v0.1.0 plan proposed
         `<Link to='/cases/new' search={{ retryItem }}>`; `/cases/new` declares no `validateSearch`,
         so a typed search parameter does not compile, and no SFWP method backs item-level control in
         any case. Authoring a new case is not retrying a plan item, and a control that cannot reach
         the kernel would be a button that lies. This is deferred under
         `roadmap_boundaries.case_item_control`.
      3. Update `CaseHorizonPage.test.tsx` to verify the inspect payload and the run links.

    proves: >-
      Operators can inspect an individual plan item's evidence in the drawer and reach the run records
      behind a failed or terminated item without leaving the board.

    does_not_prove: >-
      Does not prove item-level control of any kind — no dispatch, park, cancel, or retry exists, here
      or in the kernel. Does not prove automatic recovery.

    hot_context:
      - "workbench/apps/desktop/src/pages/CaseHorizonPage.tsx:55-115"
      - "workbench/apps/desktop/src/pages/CaseHorizonPage.test.tsx"

    steps:
      - "In `CaseHorizonPage.tsx:HorizonRow`, add `useEvidenceContext()` and an 'Inspect' button that passes the plan item to `inspectEvidence`."
      - "For `item.execution === 'failed' || item.execution === 'terminated'`, render one `<Link to='/runs/$runId' params={{ runId }}>` per entry in `item.run_ids ?? []`."
      - "When such an item has no `run_ids`, say so explicitly rather than rendering nothing — an item that failed with no episode is a fact, not an empty cell."
      - "Update `CaseHorizonPage.test.tsx`."
      - "Run `cd workbench/apps/desktop && bun run test CaseHorizonPage`."

    gate:
      - "cd workbench/apps/desktop && bun run test CaseHorizonPage"
      - "cd workbench && bun run check"

    teeth:
      - attack: "Click 'Inspect' on a HorizonRow with a mocked `inspectEvidence`."
        expected: "Receives the plan item id and both standings, not a summary string."
      - attack: "Render a `terminated` item carrying two `run_ids`."
        expected: "Two run links render. An implementation that only handles `failed` renders none and fails."
      - attack: "Render a `failed` item with `run_ids` absent."
        expected: "An explicit 'no episode recorded' statement, not an empty region."
      - attack: "Search the diff for any dispatch, park, cancel, or retry control."
        expected: "None — REQ-HORIZON-003 holds."

    redesign_trigger: >-
      `HorizonItem` stops carrying `plan_item_id` or `run_ids`, or an SFWP item-control method appears
      in `system.describe` — the latter reopens `roadmap_boundaries.case_item_control` as real work
      rather than a deferral. Verified 2026-09-04: `CaseHorizon.ts` declares `plan_item_id: string`
      and `run_ids?: string[]`, and the catalog publishes no item-control method.

    evidence: ".agents/evidence/frontend-remediation/T08_horizon_inspect.txt"

    done_when:
      - "`CaseHorizonPage.test.tsx` passes."
      - "All desktop tests remain green."

