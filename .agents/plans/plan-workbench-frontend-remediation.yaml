      - "Test count strictly exceeds 169 and every `validation_matrix.core_conformance` row names a passing test."
      - "Live verification confirms search, stale preflight, and inbox duty separation, and states plainly which behaviours native IPC was required for."
      - "Handoff status updated in `.agents/current_status.yml`."

