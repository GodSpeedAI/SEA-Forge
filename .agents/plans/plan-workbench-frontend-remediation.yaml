  title: "SEA Forge Workbench Frontend Remediation Plan"
  status: "ready"
  version: "0.2.0"
  created: "2026-09-04"
  revised: "2026-09-04"
  revision_note: >-
    Re-projected onto spec v0.2.0 after verifying every task against the repository. Corrected: the
    T01 token edit (it would have failed its own contracts gate and breached the copy-projection rule
    in `workbench/AGENTS.md`), every per-suite test command (a filter passed at the workspace root
    reaches only the ui-components leg), the T06 ribbon algorithm (route steps and lifecycle steps are
    disjoint), the T08 retry link (`/cases/new` has no `validateSearch`, `cancelled` is not an
    execution standing, and no kernel method backs item control), the T07 dispatch payload (a
    `Delegate` without `request_id` is refused before admission), the T05 keyboard handler (one already
    exists and must be modified, not duplicated), the `gate-no-alert` command (`git grep` cannot see
    the untracked file the task creates), and the artifact paths (they named directories that do not
    exist). Work already present in the tree is now marked verify-only so it is not "fixed" again.

  purpose: >-
    Project the normative specification `spec-workbench-frontend-remediation.yaml` into an
    executable, dependency-ordered development settlement graph. Systematically resolves confirmed
    frontend bugs, removes blocking `alert()` calls, repairs preflight stale detection, enforces
    duty separation, wires delegation dispatch, and proves end-to-end operational capability.

