    changes: >-
      1. `workbench/apps/desktop/src/hooks/useDelegations.ts`: add `dispatchDelegation`, following the
         shape of the `cancel` callback already in that file:
         `invoke('sfwp_command', { command: { verb: 'delegate', endpoint, instruction, max_turns,
         request_id, ...(model ? { model } : {}), ...(token_budget ? { token_budget } : {}) },
         ...(selectedActorId() ? { actAs: selectedActorId() } : {}) })`.
         `request_id` is MANDATORY and must be non-empty: `Request::Delegate` is listed in
         `sea-forge-server`'s `requires_durable_locator`, so a dispatch without one is refused before
         admission with `error_class: durable_locator_required` and `no_side_effect: true` — the
         button would appear to work and nothing would ever run. Generate it in the shape
         `machines/caseAuthoringMachine.ts:94` uses (`req-agent-run-delegate-<random>-<epoch_ms>`).
         `max_turns` is a required `u32` on the bridge enum; `model` and `token_budget` are optional
         and must be omitted rather than sent empty.
         Invalidate `DELEGATIONS_QUERY_KEY` afterwards either way, as `cancel` does — the roster is the
         authority on what happened, including when the command was refused.
      2. `workbench/apps/desktop/src/pages/DelegationWorkbench.tsx`:
         - Render a `ProtectedActionButton` (already exported from `@sea-forge/ui-components` and used
           in `DelegationRoster.tsx` and `CaseCreationWorkbench.tsx`) labelled "Dispatch delegation"
           when `preview.contract` exists and `preview.eligible` is true.
         - Disable it while `stale === true`, the flag the page already computes when the form has
           changed since the contract was read (REQ-DELEGATE-005). Dispatching under a contract the
           operator did not read submits a request nobody reviewed.
         - Preserve the page's existing distinction between eligible and authorized: the button's copy
           must not imply a decision that only the kernel makes, and the surrounding prose about
           `required_authority` stays.
         - On a response carrying `run_id`, navigate to `/runs/$runId`; on an `error`, render the
           existing alert treatment. Do not update the roster optimistically.
      3. Do NOT gate the button on SFWP catalog membership (REQ-DELEGATE-004): `system.describe`
         publishes `delegation.preview` and `delegation.list` but no delegate method — `delegate` is a
         pre-catalog protected verb reachable through the bridge, and a catalog check would hide it.
      4. Add tests in `DelegationWorkbench.test.tsx` (exists) and `useDelegations.test.ts` (new).

    proves: >-
      Operators can configure, preview, and actively dispatch an agent delegation task into the kernel,
      converting the workbench from inspect-only to an operational control surface.

