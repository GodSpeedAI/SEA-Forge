    - "Zero `alert()` or `confirm()` calls exist in `workbench/apps/desktop/src/`, tracked or untracked."
    - "Pressing `/` opens the CommandPalette modal across all routes, and does not fire inside text fields."
    - "CommandPalette filters all primary routes and executes navigation on Enter."
    - "JourneyRibbon differentiates completed, active, and upcoming steps when driven by real route values, renders each canonical step once, and marks none active for an unmapped route."
