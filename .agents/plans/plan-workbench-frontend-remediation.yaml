  # ---------------------------------------------------------------------------
  # TASK 1: Token Contrast & GovernedStatusPill Stale Variant
  # ---------------------------------------------------------------------------
  T01:
    title: "Add 'stale' Variant to GovernedStatusPill and Remediate Contrast at the Usage Site"
    initial_status: blocked
    depends_on: ["T00"]
    proof_level: P2
    confirmation: builder_with_teeth

    settles:
      - "REQ-GOAL-007"
      - "REQ-GOAL-010"
      - "REQ-READINESS-001"
      - "REQ-READINESS-003"
      - "REQ-A11Y-001"
      - "REQ-A11Y-002"
      - "REQ-A11Y-003"
      - "REQ-CONFIG-003"
      - "REQ-OUT-004"
      - "REQ-OUT-005"

    changes: >-
      1. `workbench/packages/sea-forge-ui-components/src/GovernedStatusPill.tsx`: add `'stale'` to the
         `GovernedStatusVariant` union and to `KNOWN_VARIANTS` (both lists must be edited — an entry
         missing from the set falls back to `'unknown'` even when the type admits it).
      2. `workbench/packages/sea-forge-ui-components/src/GovernedStatusPill.module.css`: add a `.stale`
         class, amber dot (`var(--color-authority-escalated)`), distinct from `.degraded`.
      3. Contrast, at the usage site only: in `workbench/apps/desktop/src/**/*.module.css` and
         `workbench/packages/sea-forge-ui-components/src/**/*.module.css`, replace `var(--fg-tertiary)`
         with `var(--fg-secondary)` on every rule whose text is essential and whose computed size is
         below 18px (below 14px bold). Leave decorative and >= AA-large uses alone (REQ-A11Y-003).
      4. Add tests to `GovernedStatusPill.test.tsx` (in `components.test.tsx`, the package's single
         suite) for the `stale` variant.

    changes_explicitly_forbidden: >-
      NO token file is edited. `workbench/packages/sea-forge-ui-tokens/sea-forge.tokens.css` is a
      byte-for-byte copy-projection of `.agents/specs/frontend/colors_and_type.css`, enforced by
      `packages/sea-forge-ui-tokens/scripts/check-drift.mjs` inside `just workbench-contracts-gate`,
      and `workbench/AGENTS.md` states "Never hand-edit it directly". The v0.1.0 plan changed
      `--fg-tertiary` to `#7E8FA6` in that file, which would have failed this task's own contracts
      gate; and `#7E8FA6` measures only 4.45:1 against `--surface-panel-elevated` (`#1F2937`), so it
      would not have met AA everywhere the token is used even if it had been permitted.

    proves: >-
      `GovernedStatusPill` renders `'stale'` with dedicated styling rather than collapsing to
      `'unknown'`; essential small text meets WCAG AA on every surface it is drawn on; and the token
      copy-projection is still byte-identical to its design-system source.

    does_not_prove: >-
      Does not prove that `ReadinessPage` surfaces the stale variant (settled in T02). Does not settle
      whether `--fg-tertiary` should change value — that is a design-system decision recorded under
      `roadmap_boundaries.design_token_value_revision`.

    hot_context:
      - "workbench/packages/sea-forge-ui-components/src/GovernedStatusPill.tsx:3-36"
      - "workbench/packages/sea-forge-ui-components/src/GovernedStatusPill.module.css"
      - "workbench/packages/sea-forge-ui-tokens/scripts/check-drift.mjs"
      - "workbench/AGENTS.md:67-70"
      - ".agents/specs/frontend/DESIGN.md:148"

    steps:
      - "In `GovernedStatusPill.tsx`: add `| \"stale\"` to `GovernedStatusVariant` AND `\"stale\"` to `KNOWN_VARIANTS`."
      - "In `GovernedStatusPill.module.css`: create `.stale` referencing `--color-authority-escalated`, visually distinct from `.degraded`."
      - "Enumerate candidates: `grep -rn 'fg-tertiary' workbench/apps/desktop/src workbench/packages/sea-forge-ui-components/src --include=*.css`."
      - "For each hit, read the rule's font-size and role; convert only essential text below 18px (below 14px bold) to `var(--fg-secondary)`. Record the kept/converted decision per rule in the evidence file."
      - "In `workbench/packages/sea-forge-ui-components/src/components.test.tsx`: assert `<GovernedStatusPill variant='stale' />` renders `status-pill--stale` and not `status-pill--unknown`."
      - "Run `just workbench-contracts-gate` and confirm `check-drift.mjs` prints `sea-forge.tokens.css matches spec source.`"

    gate:
      - "cd workbench/packages/sea-forge-ui-components && bun run test"
      - "just workbench-contracts-gate"
      - "cd workbench && bun run check"
      - "git diff --exit-code -- workbench/packages/sea-forge-ui-tokens .agents/specs/frontend/colors_and_type.css"

    teeth:
      - attack: "Add `'stale'` to the type union only, leaving `KNOWN_VARIANTS` untouched."
        expected: "The pill falls back to `unknown` and the new assertion fails — proving the test observes the set, not just the type."
      - attack: "Change one token value in `sea-forge.tokens.css` and re-run the gate."
        expected: "`check-drift.mjs` fails, confirming the gate genuinely observes the copy-projection this task must not break."
      - attack: "Re-measure the converted rules against `--surface-panel-elevated` (#1F2937), the darkest-contrast surface, not just `--surface-workspace`."
        expected: "`--fg-secondary` gives 5.72:1 there; any rule left on `--fg-tertiary` (3.08:1) is decorative or >= AA-large and is justified in the evidence file."

    redesign_trigger: >-
      A rule carrying essential small text cannot use `--fg-secondary` without breaking the design
      system's three-level text hierarchy. Then stop and raise the token-value decision as a blocked
      decision under `roadmap_boundaries.design_token_value_revision` rather than editing the token.

    evidence: ".agents/evidence/frontend-remediation/T01_pill_and_contrast.txt"

    done_when:
      - "`GovernedStatusPill` resolves `stale` to `status-pill--stale`, proven by a test that fails if `KNOWN_VARIANTS` is unchanged."
      - "No essential text below 18px (below 14px bold) uses `var(--fg-tertiary)`; every retained use is justified in the evidence file."
      - "`git diff` over the token package and `colors_and_type.css` is empty."
      - "`just workbench-contracts-gate` and `bun run check` exit 0."

