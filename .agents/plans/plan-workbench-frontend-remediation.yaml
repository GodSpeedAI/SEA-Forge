    proves: >-
      The whole desktop frontend fulfills all normative requirements of `spec-workbench-frontend-remediation.yaml`,
      passes all 4 global gates, and operates smoothly live in the target environment.

    does_not_prove: >-
      Does not prove roadmap features (unbacked surfaces `/models`, `/memory`, etc. remain honestly unbacked).

    preregistration:
      required: true
      artifact: ".agents/evidence/frontend-remediation/preregistrations/plan-workbench-frontend-remediation-T09.prereg.yaml"
      claims:
        - "Zero occurrences of `alert(` exist across `workbench/apps/desktop/src/`, tracked and untracked."
        - "Total passing Vitest tests exceed the measured baseline of 169, and every `validation_matrix.core_conformance` row is covered by at least one new passing test."
        - "`sea-forge.tokens.css` and `.agents/specs/frontend/colors_and_type.css` are byte-identical and unmodified."
        - "Live Vite dev server launches without console errors."
      falsifiers:
        - "Any lingering `alert(` invocation, including in a file not yet committed."
        - "Any failing unit or component test."
        - "Any diff in the token package or in `colors_and_type.css`."
        - "A `validation_matrix.core_conformance` row with no corresponding new test."
      known_confounds:
        - "Orphaned dev server process holding port 1420."
        - "`git grep` reading tracked files only, so a newly added file appears clean — the gate uses plain `grep` for this reason."
        - "`bun run test <Filter>` from the workspace root, which filters only the ui-components leg and can make a suite look green that never ran."
        - "The renderer fails closed with 'Cell unreachable' outside a Tauri host, so a browser probe cannot confirm any behaviour that needs live IPC; those confirmations need `just workbench-tauri-dev`."
      confirmation_condition: >-
        Fresh probe verifies `just workbench-contracts-gate`, `bun run check`, `bun run test`, the
        `grep` gate, the token no-diff check, and a live browser interaction report that states
        explicitly which behaviours it could and could not observe without native IPC.

    hot_context:
      - "workbench/apps/desktop/src/"
      - "justfile"

    steps:
      - "Run `just workbench-contracts-gate`."
      - "Run `cd workbench && bun run check`."
      - "Run `cd workbench && bun run test` and record both suite counts."
      - "Run `grep -rn 'alert(' workbench/apps/desktop/src/ ; test $? -eq 1`."
      - "Run `git diff --exit-code -- workbench/packages/sea-forge-ui-tokens .agents/specs/frontend/colors_and_type.css`."
      - "Cross-check every `validation_matrix.core_conformance` row against a named passing test."
      - "Launch dev server with `just workbench-dev-up`, probe live routes, clean up with `just workbench-dev-down`, and record which behaviours could not be observed without native Tauri IPC."
      - "Update `.agents/current_status.yml` to reflect settled plan."

    gate:
      - "just workbench-contracts-gate"
      - "cd workbench && bun run check"
      - "cd workbench && bun run test"
      - "grep -rn 'alert(' workbench/apps/desktop/src/ ; test $? -eq 1"
      - "git diff --exit-code -- workbench/packages/sea-forge-ui-tokens .agents/specs/frontend/colors_and_type.css"

    teeth:
      - attack: "Run the grep gate with a deliberately reintroduced `alert(` in an uncommitted file."
        expected: "The gate fails. (`git grep` would have passed, which is why the command was changed.)"
      - attack: "Compare the final test count against the recorded baseline of 169."
        expected: >-
          Strictly greater than 169, and each `validation_matrix.core_conformance` row names a passing
          test. The count is derived from that coverage; no fixed target is asserted, because a fixed
          number can be met by tests that prove nothing the matrix asked for.
      - attack: "Re-run `check-drift.mjs` directly."
        expected: "`sea-forge.tokens.css matches spec source.` — the contrast work stayed at the usage site."

    independent_confirmation:
      verifier_receives:
        - "All 10 goals in spec-workbench-frontend-remediation.yaml"
        - "Full test run transcript and git diff stat"
      required_verdict: "SETTLED_CONFORMANT"

    redesign_trigger: >-
      Any regression in contracts, types, or baseline test suites.

    evidence: ".agents/evidence/frontend-remediation/T09_final_settlement.txt"

    done_when:
