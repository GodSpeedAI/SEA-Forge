  # ---------------------------------------------------------------------------
  T07:
    title: "Implement Active Delegation Dispatch via Tauri Bridge in DelegationWorkbench"
    initial_status: blocked
    depends_on: ["T00"]
    proof_level: P2
    confirmation: builder_with_teeth

    settles:
      - "REQ-GOAL-005"
      - "REQ-DELEGATE-001"
