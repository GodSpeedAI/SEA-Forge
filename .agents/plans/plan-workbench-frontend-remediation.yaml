      - "workbench/apps/desktop/src-tauri/src/bridge.rs:211-229 (SfwpCommand::Delegate field list)"
      - "crates/sea-forge-server/src/lib.rs:1316-1336 (requires_durable_locator / durable_locator_refusal)"
      - "workbench/apps/desktop/src/machines/caseAuthoringMachine.ts:94 (request_id generator shape)"

    steps:
