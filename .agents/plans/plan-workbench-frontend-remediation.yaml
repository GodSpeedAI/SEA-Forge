# -----------------------------------------------------------------------------
# VERIFICATION MODEL
# -----------------------------------------------------------------------------
verification:
  global_gates:
    - id: "gate-contracts"
      command: "just workbench-contracts-gate"

    - id: "gate-typecheck-lint"
      command: "cd workbench && bun run check"

    - id: "gate-test"
      command: "cd workbench && bun run test"

    - id: "gate-no-alert"
      command: "grep -rn 'alert(' workbench/apps/desktop/src/ ; test $? -eq 1"
      note: >-
        Plain `grep`, not `git grep`. `git grep` reads tracked files only, and `CommandPalette.tsx` is
        a new untracked file until it is committed — precisely the file T05 creates. The gate would
        have reported clean on the one source most likely to reintroduce the call.

  command_conventions:
    whole_suite: "cd workbench && bun run test"
    single_desktop_suite: "cd workbench/apps/desktop && bun run test <Filter>"
    ui_components_suite: "cd workbench/packages/sea-forge-ui-components && bun run test"
    warning: >-
      `cd workbench && bun run test <Filter>` fails silently in the worst way: the root `test` script is
      `bun run --cwd apps/desktop test && bun run --cwd packages/sea-forge-ui-components test`, so the
      filter is appended to the ui-components leg only — the desktop suite runs unfiltered and the
      suite you meant to filter is never selected. `bun test` (without `run`) invokes Bun's own runner;
      both packages define `test` as `vitest run`.

  gate_binding_rule: >-
    Every task must pass `gate-typecheck-lint` and `gate-test`. Tasks touching tokens, contracts, or
    any CSS under a gated copy-projection must pass `gate-contracts`. Tasks modifying `AppShell.tsx` or
    adding shell components must pass `gate-no-alert`.

  proof_levels:
    P0: "Mechanical/deterministic change. Requires a narrow direct gate plus applicable global gates."
    P1: "Normal behavioral work. Requires positive behavior, a meaningful teeth/falsification check, and global gates."
    P2: "Invariant-sensitive work. Requires an explicit claim, meaningful adversarial/negative evidence, and global gates."
    P3: "Settlement-critical work. Requires frozen preregistration, builder evidence, adversarial attacks, and independent confirmation."

