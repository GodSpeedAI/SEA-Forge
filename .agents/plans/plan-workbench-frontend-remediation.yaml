      - "Run `cd workbench && bun run check` to confirm zero lint and typecheck errors."
      - "Run `cd workbench && bun run test` to capture the baseline. Measured 2026-09-04: 22 desktop files / 152 tests, 1 ui-components file / 17 tests, 169 total, all passing."
