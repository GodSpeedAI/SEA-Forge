    proves: SEA-Forge remains local-first/backend-pluggable without Docker/VM as the universal default; Windows local IPC
      is real, and native platform backends either satisfy shared requirements or explicitly report narrower capability.
    does_not_prove: Does not require every platform to have identical mechanisms or capabilities, and does not force microVM
      support unless separately promoted.
    hot_context:
    - T04 transport abstraction
    - T05 CapabilityReport
    - T06 containment contract
    - T13 egress contract
    - .tmp/ref/openshell platform/hardening patterns
    - source spec roadmap boundary for portable native containment
    preregistration:
