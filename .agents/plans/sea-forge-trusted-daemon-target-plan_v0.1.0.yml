  T18:
    title: 'T18: Durable restart, indeterminate commit, and bounded recovery'
    initial_status: blocked
    depends_on:
    - T03
    - T04
    - T08
    - T12
    - T13
    - T14
    proof_level: P3
    confirmation: independent_adversarial
    settles:
    - REQ-SAFE-001
    - REQ-SAFE-003
    - REQ-SAFE-004
    changes: Makes daemon restart/recovery safe for pending grants, trajectory state, mediator state, and uncertain external
      commits; non-idempotent operations reconcile rather than blindly retry.
    proves: Process failure cannot turn uncertainty into duplicate consequence, inferred reauthorization, erased policy history,
      or widened fallback.
    does_not_prove: Does not prove every external provider's reconciliation API; unsupported reconciliation remains operator-required/indeterminate.
    hot_context:
    - existing server durability/current status behavior
    - crates/sea-forge-ledger/
    - T03 grant lifecycle
    - T08 trajectory revision
    - T14 evidence bridge
    preregistration:
      required: true
      artifact: .agents/preregistrations/sea-forge-trusted-daemon/sea-forge.trusted-daemon-target-T18.prereg.yaml
      claim: Process failure cannot turn uncertainty into duplicate consequence, inferred reauthorization, erased policy history,
        or widened fallback.
      falsifier: A crash/restart can duplicate a non-idempotent side effect, reauthorize by inference, or erase exact prior
        policy/grant evidence.
      known_confounds: []
      confirmation_condition: The task's positive gate and declared teeth pass against the frozen claim; fresh independent
        confirmation also returns the required verdict.
    steps:
    - Persist only the grant/dispatch/revision state needed to reconstruct pending/consumed/invalidated/indeterminate conditions
      without persisting raw credentials.
    - Define restart reconciliation for issued-but-unconsumed, validated-but-not-dispatched, dispatched-with-known-result,
      and dispatched-with-unknown-result states.
    - Never reissue authority by inference after restart; reevaluate or restore exact valid grant handle state according to
      the contract.
    - For indeterminate external commits, consult idempotency/evidence/reconciliation surface before retry; non-idempotent
      unknown outcome requires reconciliation/operator path.
    - Test policy reload and restart combinations, including old decision evidence remaining intact.
    - Fault-inject crashes around credential resolution, egress dispatch, external response, evidence append, and result return.
    gate:
    - cargo test -p sea-forge-server --all-features --locked restart
    - cargo test -p sea-forge-runtime --all-features --locked indeterminate
    - cargo test -p sea-forge-ledger --all-features --locked recovery
    teeth:
    - attack: Crash after external side effect but before local success record, then restart.
      expected: System marks/reconciles indeterminate; it does not blindly repeat non-idempotent operation.
    - attack: Crash after policy reload with grants from old revision.
      expected: Historical evidence remains exact; grant validity follows explicit revision rules, never inferred current
        allow.
    - attack: Crash while credential material is in trusted mediator memory.
      expected: No raw secret appears in durable recovery state/evidence.
    independent_confirmation:
      verifier_receives:
      - source requirement(s)
      - frozen preregistration
      - relevant implementation/diff
      - builder evidence
      - exact confirmation question
      verifier_should_not_receive:
      - builder's expected verdict before independent reproduction when practical
      required_verdict: CONFIRM with no settlement-critical failure
    redesign_trigger: If an external operation offers neither idempotency nor observable reconciliation, classify that path
      operator-required after indeterminate commit rather than inventing automatic recovery.
    evidence: .agents/evidence/sea-forge-trusted-daemon/T18/
    done_when:
    - All crash points have explicit durable recovery semantics.
    - Duplicate non-idempotent consequence is prevented in fault-injection tests.
    - Independent verifier reproduces at least the post-commit/pre-record crash case.
    - All applicable global gates remain green.
