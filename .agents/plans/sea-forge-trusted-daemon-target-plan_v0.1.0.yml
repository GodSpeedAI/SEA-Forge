final_acceptance:
  authority_and_identity:
  - Every governed consequential path uses one canonical operation/resource identity and exact policy/semantic/trajectory
    snapshot.
  - No caller, adapter, agent, backend, or donor-derived mechanism can widen SEA-Forge authority or a grant.
  - Stale, expired, replayed, mismatched, unknown, or ambiguous authority fails before side effect.
  information_flow_and_delegation:
  - Trajectory information state is deterministic/replayable and ordinary joins are monotonic in restriction.
  - Probabilistic annotators cannot grant authority; exact-call binding is enforced.
  - Scoped remedies/declassification are local and evidenced; child/subagent return cannot launder information.
  - Confined results preserve side-effect evidence without returning protected payload.
  enforcement_and_secrets:
  - Backend selection is requirements/capability driven and never silently falls back to weaker unconfined execution.
  - Projection fidelity distinguishes exact/conservative/widening/unsupported and widening/unsupported consequence is blocked.
  - CredentialRef mediation keeps raw secrets out of prohibited agent/application/log/evidence/result surfaces.
  - Default network posture is deny; request-level restrictions are enforced where claimed and coarse controls are not mislabeled
    exact.
  - Filesystem/process/environment/artifact constraints remain grant-derived and existing safe-path/Landlock guarantees do
    not regress.
  integration_and_evidence:
  - Cognate governed vertical slice carries SemanticRef/source digest through SEA-Forge decision/grant/enforcement to event/RealityTrace
    correlation.
  - Gauntlet navigates deny/remedy/escalate/unsupported/executed/indeterminate states without authorizing itself or bypassing
    IFC.
  - Execution, observation delivery, evidence, and domain settlement remain distinct.
  - Governance evidence is append-only/correctable, secret-safe, and sufficient to reconstruct why a consequence occurred.
  operability_and_portability:
  - Trusted local control is access-controlled on Unix and Windows; claimed native backends pass fresh-target conformance
    or expose limitations.
  - Daemon restart/indeterminate external commit cannot cause blind duplicate non-idempotent consequence or inferred reauthorization.
  - Production build/tests do not depend on `.tmp/ref/` donor trees.
  - No roadmap-only formal prover, microVM tier, or unclaimed protocol coverage is represented as settled.
  evidence_and_confirmation:
  - Every REQUIRED normative spec requirement maps to at least one settled task/evidence record.
  - Every P3 task has the required fresh independent confirmation.
  - Failed/correction evidence has not been erased.
  - Documentation/status claims do not exceed observed proof.
  - All global gates exit 0.
  - T19 independent adversarial whole-system verdict is CONFIRM and T20 cold-agent handoff succeeds.
guardrails:
- Do not replace the existing one-authority fabric with separate uncoordinated policy engines.
- Do not introduce a new `.sea` grammar construct merely to model a backend/provider/runtime target; prefer projections/adapters/mappings.
- Do not make OpenShell, OpenAPPA, Gauntlet, or Cognate donor/reference checkouts runtime/build dependencies of SEA-Forge.
- Do not vendor/copy substantial third-party code without recording commit, path, license, and required notices.
- Do not regress current ActionGrant move-only semantics, canonical policy hashing, safe path handling, Landlock fail-closed
  TCP behavior, integrity ledger, environment pinning, or existing server/runtime/sandbox proofs while evolving them.
- Do not let child-controlled input select a weaker backend, wider network/filesystem/env scope, or raw credential value.
- Do not put raw credentials into prompts, normal child env when avoidable, events, logs, artifacts, RealityTrace payloads,
  or errors.
- Do not silently convert unavailable enforcement into Local/unconfined execution.
- Do not treat policy allow, process exit 0, observation delivery, or logged evidence as domain settlement by itself.
- Do not retry a non-idempotent operation after an indeterminate external commit without reconciliation evidence.
- Do not merge platform-specific mechanisms into stable semantic types when CapabilityReport/adapter boundaries can preserve
  the distinction.
- 'Do not update CURRENT_STATUS to `settled` or `next: none` until T19 and T20 gates/confirmation pass.'
handoff_contract:
  must_report:
  - settled capabilities/requirements
  - explicitly unsettled or deferred items
  - current operational system state
  - requirement-to-evidence index
  - known limitations
  - rollback/recovery instructions where relevant
  - important decisions/discoveries that changed the execution model
  - exact next executable action or 'none — plan settled'
  - donor provenance/attribution for any copied code or adapted pattern
  - claimed platform/backend capability matrix
  settled_next_action_rule: The next executable action MUST be set to `none — plan settled` only after the final required
    conformance/confirmation task succeeds.
