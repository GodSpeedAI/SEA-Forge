    authority: normative
  implementation_brief:
    intended_repository_path: .agents/reports/sea-forge-trusted-daemon/implementation-brief.yaml
    authority: non_normative_execution_context
    conflict_rule: The normative specification governs. Any conflict MUST be surfaced as a blocked decision rather than silently
      resolved by the implementing agent.
  supporting_sources:
  - path: AGENTS.md
    role: Repository execution invariants, gates, safety boundaries, and local memory contract.
  - path: .agents/CURRENT_STATUS.md
    role: Mutable evidence of current implementation state; may be stale and never overrides the target spec.
  - path: .agents/specs/spec-minimum.md
    role: Existing minimum-kernel contracts that must not regress unless the new normative spec explicitly supersedes them.
  - path: .agents/specs/spec-full.md
    role: Existing full-system contracts and earned implementation evidence to preserve or explicitly supersede.
  - path: justfile
    role: Canonical project command surface; this plan reuses it rather than creating duplicate global gates.
  - path: .agents/evidence/sea-forge-trusted-daemon/T00/donor-manifest.yaml
    role: Pinned donor/reference provenance and license/copy policy created by T00.
  - path: .agents/evidence/sea-forge-trusted-daemon/T00/donor-pattern-map.yaml
    role: Pattern-level mapping from OpenShell, OpenAPPA, Gauntlet, and Cognate into SEA-Forge abstractions; non-normative.
target_settlement: SEA-Forge runs as a trusted local daemon boundary for governed consequence. Every supported consequential
  request is canonicalized, evaluated against one exact policy/semantic/trajectory snapshot, and either denied/escalated/remediated/unsupported
  or issued an exact non-widenable EnforcementGrant. Execution proceeds only when projection fidelity and backend CapabilityReport
  prove the required filesystem/process/network/credential/information/evidence guarantees. Information restrictions survive
  agent/subagent trajectories; raw credentials remain behind a trusted broker; egress and containment are grant-derived; execution/evidence
  correlate through Cognate/RealityTrace where present; Gauntlet can navigate governance outcomes without authorizing itself;
  stale state, restart, unsupported targets, and indeterminate commits fail safely. The entire claim is replayable, adversarially
  tested, independently confirmed, and does not depend on `.tmp/ref/` donors at runtime/build time.
operating_contract:
  core_principle: 'Preserve one semantic authority fabric above all adapters and enforcement mechanisms: donor patterns, application
    policy, runtime convenience, and backend availability may narrow or implement a decision, but none may invent meaning,
    authority, declassification, or a weaker enforcement interpretation.'
  rules:
  - Execute tasks by dependency, not by narrative order.
  - Independent tasks MAY run in parallel only after all declared dependencies are settled.
  - Every task MUST leave the repository in a coherent state with all applicable global gates green.
  - A task is not complete because code exists, a process starts once, the builder reports success, or a happy-path test passes.
  - A passing gate proves only what that gate actually observes.
  - High-risk P3 work requires fresh independent/adversarial confirmation.
  - Do not generalize from one observation unless the normative requirement is itself general.
  - Do not silently widen domain, schema, API, config, service, or authority surfaces when an existing representation can
    preserve the required distinction.
  - Runtime/machine/provider-specific facts belong in the project's established config/secret hierarchy rather than scattered
    hardcoding.
  - Preserve failed evidence and correction history.
  - T00 MUST copy/clone the approved donors/references into ignored `.tmp/ref/` at exact pinned commits before donor-derived
    implementation work begins.
  - Donor trees under `.tmp/ref/` are read-only evidence/reference inputs, never production runtime/build dependencies, submodules,
    or sources of normative authority.
  - When a task borrows a donor pattern or substantial code, record exact donor path, commit, license, adopted invariant,
    SEA-Forge adaptation, and any rejected donor assumptions in task evidence.
  - Prefer existing SEA-Forge crates/types/ports. Create a new crate or public abstraction only when the current boundary
    would violate a normative requirement or dependency invariant.
  - Do not change `.sea` grammar for a new backend/provider/projection unless a genuine missing semantic distinction is demonstrated
    and the source spec is explicitly revised.
  - Keep kernel crates synchronous and free of HTTP/async dependencies unless the repository's normative boundary is explicitly
    changed; async/network implementation belongs in server/adapters.
  - Authority and isolation remain distinct controls; inability to enforce one is not repaired by claiming the other.
  - Never weaken an acceptance condition because a donor or platform cannot satisfy it; classify unsupported/narrower capability
    instead.
  claim_states:
  - OBSERVED
  - INFERRED
  - DECIDED
  - ASSUMED
  - UNKNOWN
  correction_protocol:
  - Preserve the failed evidence.
  - 'Classify the failure: implementation, oracle/test, representation, missing prerequisite, environmental confound, or source-spec
    ambiguity.'
  - Determine whether the governing requirement/invariant remains valid.
  - Correct the smallest falsified layer.
  - Rerun the original teeth/falsification check.
  - Rerun the original confirmation path.
  - Append the correction round; do not erase the failed round.
  - Do not weaken acceptance merely because the implementation repeatedly fails it.
  scope_control: A newly discovered issue enters the current plan only when it blocks a normative requirement or is itself
    required by the source specification. Valuable but independent discoveries become future debt/plans. Attractive architecture
    with no requirement is rejected from current scope.
