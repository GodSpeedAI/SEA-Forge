tasks:
  T00:
    title: 'T00: Freeze baseline, mirror donors, and bind proof surfaces'
    initial_status: ready
    depends_on: []
    proof_level: P1
    confirmation: builder
    settles: []
    changes: 'Creates the execution baseline without changing daemon semantics: records the exact SEA-Forge branch/commit
      and gate results; copies the approved donor/reference repositories into ignored `.tmp/ref/` at pinned commits; records
      licenses and a donor-pattern map; binds this plan to the source spec hash; and establishes task-scoped evidence/preregistration/report
      locations.'
    proves: A cold agent can reproduce the starting state, inspect every donor locally without network rediscovery, know which
      donor patterns are relevant, and run the repository's existing gates before modifying the trusted boundary.
    does_not_prove: Does not prove any new daemon capability, donor pattern correctness inside SEA-Forge, or that the current
      implementation conforms to the target spec.
    hot_context:
    - AGENTS.md
    - .agents/CURRENT_STATUS.md
    - .agents/specs/spec-minimum.md
    - .agents/specs/spec-full.md
    - justfile
    - crates/sea-forge-authority/src/lib.rs
    - crates/sea-forge-runtime/src/lib.rs
    - crates/sea-forge-sandbox/src/
    - crates/sea-forge-server/src/
    - .gitignore (`.tmp/` is already ignored)
    - 'source spec: .agents/specs/sea-forge.trusted-daemon-target.spec.yml'
    steps:
    - Install/freeze the exact source spec at `.agents/specs/sea-forge.trusted-daemon-target.spec.yml`; verify SHA-256 `09822b59756cc842db410c91f030d373b7f3bf6e1114c9a7e7c977062492e70b`.
      If bytes differ, STOP and update this plan hash rather than proceeding.
    - Record `git status`, branch, HEAD, toolchain, and existing global-gate results in the T00 evidence record; do not assume
      the historical CURRENT_STATUS commit is current.
    - Create `.tmp/ref/` if absent. Treat it as disposable, read-only donor/reference space; never commit it, add it as a
      submodule, or make production code depend on it.
    - Mirror/pin `NVIDIA/OpenShell` to `.tmp/ref/openshell` at `912a077bd641272016fb8b2fd58209f6c7c6f194`; record Apache-2.0
      license obligations before copying substantial code.
    - Mirror/pin `archestra-ai/OpenAPPA` to `.tmp/ref/openappa` at `6710c7f22ba2c94ae1b269cd4c5330bc5c24d322`; record MIT
      license obligations before copying substantial code.
    - Mirror/pin `GodSpeedAI/Gauntlet` to `.tmp/ref/gauntlet` at `fe75108d62129ffb179b6773b67f3ee92213e44d` for its sandbox/port
      patterns; this is an internal donor, not a runtime dependency.
    - Mirror/pin `GodSpeedAI/Cognate` branch `cognate/harness` to `.tmp/ref/cognate` at `32ea1e8db1575f619dacca5730cf260a9090e43e`
      as an integration reference, not a code donor by default.
    - Write `.agents/evidence/sea-forge-trusted-daemon/T00/donor-manifest.yaml` with repo, remote, commit, license, local
      path, relevant subsystems, and `copy_policy` (`pattern_only` vs `code_allowed_with_notice`).
    - 'Write `.agents/evidence/sea-forge-trusted-daemon/T00/donor-pattern-map.yaml` identifying at minimum: OpenShell credential
      broker, egress/supervisor, atomic policy snapshot, hardening; OpenAPPA trajectory IFC, remedy plans, checked subagent
      returns, canonical tool identity, confined results; Gauntlet sandbox port/capability model; Cognate Policy/ActionPolicy/SemanticRef/RealityTrace
      seams.'
    - For each donor pattern, record `adopt`, `adapt`, or `reject` and the SEA-Forge abstraction it maps to. Donor architecture
      MUST NOT silently become canonical merely because code exists.
    - Create or validate the task-scoped evidence, preregistration, and reports roots. Update CURRENT_STATUS only after baseline
      evidence exists.
    gate:
    - devbox run -- just context-check
    - devbox run -- just proof
    - devbox run -- just ci
    - test "$(sha256sum .agents/specs/sea-forge.trusted-daemon-target.spec.yml | awk '{print $1}')" = "09822b59756cc842db410c91f030d373b7f3bf6e1114c9a7e7c977062492e70b"
    - test -d .tmp/ref/openshell && test -d .tmp/ref/openappa && test -d .tmp/ref/gauntlet && test -d .tmp/ref/cognate
    teeth:
    - attack: Change one byte of the local source spec and rerun the SHA binding check.
      expected: T00 refuses to settle; plan execution cannot proceed against an unbound spec.
    - attack: Point one `.tmp/ref/*` donor at the wrong commit or omit its license/commit from donor-manifest.yaml.
      expected: Donor baseline gate fails; later tasks may not cite or copy that donor.
    - attack: Attempt to add `.tmp/ref/` content to git.
      expected: Repository ignore/status check shows donor trees are not tracked; any tracked donor tree blocks T00.
    redesign_trigger: If the current SEA-Forge branch has materially different crate boundaries or already implements a target
      capability beyond the source spec's evidence claims, stop and reconcile the spec/plan representation before writing
      parallel replacements.
    evidence: .agents/evidence/sea-forge-trusted-daemon/T00/
    done_when:
    - Baseline global gates are recorded with exact pass/fail status.
    - All four reference trees are present at the pinned commits or an explicit user-approved repin is recorded.
    - Donor manifest and pattern map are reviewable and license-aware.
    - The source spec hash is frozen and matches this plan.
    - All applicable global gates remain green.
  T01:
    title: 'T01: Canonical request and operation identity'
    initial_status: blocked
    depends_on:
    - T00
    proof_level: P2
    confirmation: builder_with_teeth
    settles:
    - REQ-GOAL-002
    - REQ-AUTH-006
    - REQ-OPID-001
    - REQ-OPID-002
    - REQ-OPID-003
    - REQ-ADAPT-001
    - REQ-ADAPT-002
    - REQ-ADAPT-003
    changes: Introduces or tightens the stable CanonicalActionRequest/OperationIdentity boundary and adapter normalization
      so policy evaluates the same identity that execution uses.
    proves: Host-native aliases, MCP/provider spellings, CLI names, and adapter-specific encodings cannot create a second
      semantic identity for the same consequential action or widen an unknown action into an allowed one.
    does_not_prove: Does not yet prove atomic policy snapshots, exact grant freshness, physical enforcement, or information-flow
      state.
    hot_context:
    - crates/sea-forge-core/src/types.rs
    - crates/sea-forge-authority/src/lib.rs
    - crates/sea-forge-server/src/case_dispatch.rs
    - .tmp/ref/openappa/appa-runtime-api/src/lib.rs (canonical tool identity pattern)
    - .agents/evidence/sea-forge-trusted-daemon/T00/donor-pattern-map.yaml
    preregistration:
      required: true
      artifact: .agents/preregistrations/sea-forge-trusted-daemon/sea-forge.trusted-daemon-target-T01.prereg.yaml
      claim: Host-native aliases, MCP/provider spellings, CLI names, and adapter-specific encodings cannot create a second
        semantic identity for the same consequential action or widen an unknown action into an allowed one.
      falsifier: Any supported path can evaluate one canonical identity but execute another, or any ambiguous/unknown alias
        reaches a privileged side effect.
      known_confounds: []
      confirmation_condition: The task's positive gate and declared teeth pass against the frozen claim; review finds no alternate
        path that violates the invariant.
    steps:
    - Inventory every current consequential entry path and the native identity it supplies to authority/execution.
    - Define the smallest canonical operation/resource/request representation in existing core types; prefer extending established
      AuthorityAction/Operation types over parallel domain models.
    - Implement deterministic normalization and reject ambiguous/unknown consequential aliases.
    - Require adapters to prove native->canonical mapping before authority; retain native spelling only for dispatch/diagnostics.
    - At execution, compare the canonical operation/arguments/resource scope to the identity authorized; reject mismatches.
    - Add shared adapter conformance fixtures so a replacement adapter must produce equivalent canonical requests.
    gate:
    - cargo test -p sea-forge-core --all-features --locked canonical
    - cargo test -p sea-forge-authority --all-features --locked canonical
    - cargo test -p sea-forge-server --all-features --locked canonical
    teeth:
    - attack: Submit the same operation through two supported native aliases.
      expected: Both normalize to one canonical identity and receive equivalent authority behavior.
    - attack: Use an ambiguous/unregistered alias that resembles an allowed operation.
      expected: Request is rejected before authority/execution; no fallback to a broader operation.
    - attack: Authorize one canonical argument/resource spelling then mutate it before dispatch.
      expected: Execution rejects the mismatch and produces no consequential side effect.
    redesign_trigger: If current AuthorityAction/Operation cannot represent canonical identity without conflating domain meaning
      with transport spelling, stop and revise the source spec/core model rather than adding stringly typed alias exceptions.
    evidence: .agents/evidence/sea-forge-trusted-daemon/T01/
    done_when:
    - Canonical identity is used end-to-end on all currently governed execution paths.
    - Adapter conformance tests cover alias equivalence and ambiguity rejection.
    - Unknown consequential operations remain fail-closed.
    - All applicable global gates remain green.
  T02:
    title: 'T02: Exact PolicyRevision and atomic authorization snapshot'
    initial_status: blocked
    depends_on:
    - T00
    proof_level: P2
    confirmation: peer
    settles:
    - REQ-CONFIG-001
    - REQ-CONFIG-004
    - REQ-POL-001
    - REQ-POL-002
    - REQ-POL-003
    - REQ-POL-004
    - REQ-SEC-005
    changes: Makes behaviorally relevant policy identity/revision explicit, deterministic, and durable; authorization reads
      one coherent policy/semantic/trajectory snapshot; reload activates only fully validated revisions.
    proves: A decision can be reconstructed against exactly one governing policy identity, and policy reload cannot create
      mixed-generation authorization or rewrite prior evidence.
    does_not_prove: Does not prove grant binding across execution, trajectory IFC semantics, or backend enforcement sufficiency.
    hot_context:
    - crates/sea-forge-authority/src/lib.rs (`hash_canonical`, AuthorityPolicyBundle, policy_bundle_hash)
    - crates/sea-forge-server/src/config.rs
    - crates/sea-forge-ledger/
    - .tmp/ref/openshell (policy generation / authorization snapshot patterns)
    - .tmp/ref/openappa/appa-runtime/src/engine.rs and appa-policy policy identity patterns
    preregistration:
      required: true
      artifact: .agents/preregistrations/sea-forge-trusted-daemon/sea-forge.trusted-daemon-target-T02.prereg.yaml
      claim: A decision can be reconstructed against exactly one governing policy identity, and policy reload cannot create
        mixed-generation authorization or rewrite prior evidence.
      falsifier: A decision can be produced from mixed policy generations, or an old decision can no longer identify its exact
        governing policy after reload.
      known_confounds: []
      confirmation_condition: The task's positive gate and declared teeth pass against the frozen claim; review finds no alternate
        path that violates the invariant.
    steps:
    - Characterize which existing policy fields are behaviorally relevant and which deployment hints must not perturb semantic
      identity.
    - Create/normalize PolicyRevision with deterministic canonical policy hash and exact source identities.
    - Bind authority evaluation to one coherent snapshot of policy, semantic source identity, and any relevant durable state
      revision.
    - Change reload to validate candidate revision completely before activation; preserve last-known-good on invalid reload.
    - Persist revision/hash on decisions and durable evidence; historical records remain immutable after reload.
    - Add concurrency tests where reload races with evaluation and ensure no mixed-generation result can be constructed.
    gate:
    - cargo test -p sea-forge-authority --all-features --locked policy
    - cargo test -p sea-forge-server --all-features --locked reload
    - cargo test -p sea-forge-ledger --all-features --locked
    teeth:
    - attack: Modify a behaviorally relevant policy rule without changing human version text.
      expected: Canonical policy hash changes and new decisions carry the new PolicyRevision.
    - attack: Change only a non-behavioral deployment hint classified outside policy identity.
      expected: Semantic policy identity remains unchanged.
    - attack: Race reload between policy check and metadata/decision construction.
      expected: Decision carries one coherent generation or retries; never combines generations.
    - attack: Reload invalid policy.
      expected: Last valid revision remains authoritative; failure is observable and no permissive fallback occurs.
    redesign_trigger: If policy identity cannot be defined without hashing volatile/non-semantic deployment data, separate
      policy semantics from deployment configuration before continuing.
    evidence: .agents/evidence/sea-forge-trusted-daemon/T02/
    done_when:
    - Policy identity is deterministic across byte/ordering-equivalent semantic configuration.
    - Reload and historical-evidence behavior are proven under race and invalid-reload cases.
    - Decision records carry exact revision/hash.
    - All applicable global gates remain green.
  T03:
    title: 'T03: EnforcementGrant v2 and pre-commit freshness'
    initial_status: blocked
    depends_on:
    - T01
    - T02
    proof_level: P3
    confirmation: independent_adversarial
    settles:
    - REQ-GOAL-003
    - REQ-OUT-002
    - REQ-OUT-003
    - REQ-OUT-004
    - REQ-CONFIG-011
    - REQ-AUTH-001
    - REQ-AUTH-002
    - REQ-AUTH-003
    - REQ-AUTH-004
    - REQ-AUTH-005
    - REQ-SEC-001
    - REQ-SEC-002
    changes: 'Evolves the existing move-only ActionGrant into the target EnforcementGrant contract while preserving current
      fail-closed controls: exact actor/operation/resource/context, policy revision/hash, semantic source identity, relevant
      trajectory state, expiry, enforcement requirements, and evidence obligations.'
    proves: Privileged execution cannot occur from a detached advisory allow, a forged/widened grant, or a grant whose bound
      policy/semantic/trajectory/operation state is stale or mismatched.
