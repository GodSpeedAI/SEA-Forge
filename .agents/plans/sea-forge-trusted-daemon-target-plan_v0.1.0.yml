      artifact: .agents/preregistrations/sea-forge-trusted-daemon/sea-forge.trusted-daemon-target-T17.prereg.yaml
      claim: SEA-Forge remains local-first/backend-pluggable without Docker/VM as the universal default; Windows local IPC
