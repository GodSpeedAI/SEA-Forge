verification:
  global_gates:
  - id: G-CONTEXT
    command: devbox run -- just context-check
  - id: G-CHECK
    command: devbox run -- just check
  - id: G-TEST
    command: devbox run -- just test
  - id: G-PROOF
    command: devbox run -- just proof
  - id: G-CI
    command: devbox run -- just ci
  gate_binding_rule: Reuse existing `just` recipes and crate-level cargo tests as the implementation surface. New integration
    names MAY be added behind the existing `just integration <name>` entry point; do not duplicate fmt/lint/typecheck/security/test
    logic in new scripts. A task-specific test may be added where the behavior does not yet have an oracle.
  proof_levels:
    P0: Mechanical/deterministic change. Requires a narrow direct gate plus applicable global gates.
    P1: Normal behavioral work. Requires positive behavior, a meaningful teeth/falsification check, and applicable global
      gates.
    P2: Invariant-sensitive work. Requires an explicit or preregistered claim, meaningful adversarial/negative evidence, an
      evidence artifact, applicable global gates, and review of a plausible alternate failure path.
    P3: Settlement-critical work. Requires frozen preregistration, builder evidence, explicit adversarial attacks, fresh independent
      confirmation, and correction/re-confirmation after any failed confirmation.
