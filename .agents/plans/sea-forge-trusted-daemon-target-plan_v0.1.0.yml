schema: agent.development_plan
schema_version: '1.0'
metadata:
  id: sea-forge.trusted-daemon-target
  title: SEA-Forge Trusted Daemon Development Settlement Plan
  status: draft
  version: 0.1.0
  created: '2026-09-30'
  purpose: Project the trusted-daemon normative specification into a dependency-ordered settlement graph that preserves the
    current full-spec substrate, uses pinned donor repositories as local references under `.tmp/ref/`, and reaches a verified
    end state where semantic authority, information flow, credentials, egress, containment, projection fidelity, evidence,
    Cognate, and Gauntlet compose through one fail-closed daemon boundary.
  execution_activation_gate: 'The source spec file currently declares `metadata.status: draft`. Before T00 can settle for
    implementation, the user/owner MUST freeze/approve the exact spec bytes. If approval changes the file bytes (including
    metadata), recompute the SHA-256 in this plan and revalidate traceability; do not execute against a mismatched hash.'
