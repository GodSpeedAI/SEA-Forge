mechanical_discriminator_rule_frozen:
  rule: >-
    A probe observation is mechanically classified verification_failed_nonsettlement
    if and only if ALL hold, evaluated deterministically from preserved records:
    (1) the typed terminal is a bounded non-settlement (not settled, not a run
    error); (2) the run's settlement_committed count is 0; (3) at least one
    evidence_produced artifact of the run, hash-verified at its pinned sha256,
    has content recording a failing verification (failures > 0).
  symmetry_property: >-
    Honest boundary probes cannot trigger the rule: honest runs produce
    passing reports (failures: 0) or no artifacts at all, and honest
    partial-progress runs have settlements > 0. Verified against all 12
    preserved probes of route t23-route-001 before freezing: happy@1 (0
    dispatches, 0 artifacts) false; happy@2 (1 settlement) false; happy@3 (2
    settlements) false; happy@4..@8 (settled) false; lying@2/@4/@5/@8 (0
    settlements, failing artifact pinned sha256 08c3dff5…e5e0d2 and siblings)
    true — exactly the lying family.
  corroborating_not_required: >-
    The same-unit repeat-dispatch pattern (e.g. AK-901 dispatched 3x with 0
    settlements on lying@4) remains in the judgment surface as corroborating
    evidence but is NOT a rule conjunct (lying@2 legitimately fires with a
    single dispatch at r=2).
  role: >-
    The mechanical label is the GOAL evaluation input (deterministic route
    evaluator, the same layer that evaluates baseline and boundary). Learned
    judgment labels are recorded beside it per the corrected surface of
    addendum-2 and feed selection, the claims report, and the payment
    evaluation — never the goal.
