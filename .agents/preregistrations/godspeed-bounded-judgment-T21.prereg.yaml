# =============================================================================
# T21 PREREGISTRATION — native consequence-guided route discovery (developmental)
# =============================================================================
# FROZEN BEFORE ANY LOOP EXECUTION. Any change after first execution requires an
# append-only addendum file; this file is never edited post-freeze.
schema: godspeed-bounded-judgment.t21-prereg
created_utc: "2026-09-18"
frozen_before: "first candidate generation, first probe, first provider call"
subject_identity:
  gauntlet_commit: "3a9955fa331de8b88db6d4025b91096b313f0d5e (sources read-only)"
  gauntlet_binary: "../gauntlet/target/debug/gauntlet (built from the commit above; reused, never rebuilt for this branch)"
  sea_rs_base_commit: "72348237412dc000533c05b6a36e01066ca3baed"
  sea_rs_state_note: >-
    the judgment apparatus (plan/spec/prereg/evidence) is untracked worktree
    state by operator convention; each task records the sha256 of every harness
    script and frozen artifact it authors, append-only
  plan_version_amended: "1.5.0"
relation_to_prior_work:
  branches_from: "settled T16 developmental result (Outcome C; no promotion)"
  must_not: "reopen T16, unlock T06, or touch the epistemic-role branch T18..T20 (T18 is paused mid-flight with a recorded resume procedure; its files, corpus, and state are off-limits)"
  open_question: >-
    Can GodSpeed autonomously construct fresh, genuinely settleable routes and
    thereby generate fresh consequence-backed cases at lower payment than manual
    case construction?
fixture_and_case_family:
  mechanism: >-
    Exactly the frozen T15 case-execution mechanism: each probe copies
    ../gauntlet/examples/demo-calculator to a fresh disposable target, seds
    runners.default to mock-agent (and, for budget-lever probes, max_rounds to
    the probe's value), exports GAUNTLET_STATE_DIR / GAUNTLET_ARTIFACT_DIR /
    GAUNTLET_TOOL_TEST / GAUNTLET_MOCK_SCENARIO / GAUNTLET_MAX_ATTEMPTS_PER_UNIT=2,
    and runs one headless `gauntlet run "Build and verify the calculator page"`
    with a 240 s timeout. The typed terminal consequence from gauntlet's own
    event log (run_terminal state, settlement_committed events) is the only
    ground truth; hand-authored outcome rows are fabrication.
  durability_rule: >-
    Probe run state and artifacts are written under
    $HOME/.local/share/godspeed-route-discovery/<task>/ (persistent; the T18
    /tmp-wipe lesson); manifests pin external paths plus sha256 inside the
    evidence tree.
operation_surface:
  catalog: >-
    run_case(scenario, max_rounds): scenario in {e2e-happy, e2e-lying,
    e2e-forged-report} (existing fixture scenarios only), max_rounds in
    {1,2,3,4,5,6,7,8} (the GAUNTLET.md budget lever). 24 representable
    operations; the catalog file pins the derivation and its sha256.
  neighborhood_rule: >-
    The bounded neighborhood presented to the generator at iteration t =
    catalog operations that are (a) not yet probed on this route, (b) affordable
    under the remaining probe budget, (c) admission-compatible (mock replay
    runner only; disposable copy; no credentials; no network), (d) not excluded
    by a prior denial on this route. The generator never sees the universe.
route_goal_frozen:
  - "baseline: an e2e-happy probe at the default budget (max_rounds 8) settles (settled_accepted)"
  - "discriminator: an e2e-lying probe on this route honestly fails verification (verification_failed_nonsettlement) - the instrument discriminates on this surface"
  - "boundary: the minimal settling budget r* is discovered by this route's own probes such that max_rounds=r* settles and max_rounds=r*-1 exhausts payment (budget_exhausted); r*=8 with 7 exhausting is a valid boundary"
route_and_iteration_bounds:
  K: 3
  max_route_depth_retained_moves: 5
  max_probes_per_route: 12
  max_iterations: 6
  probe_wall_seconds: 240
  route_wall_seconds: 2700
candidate_representation:
  schema: >-
    Typed record only: {candidate_id, correlation_id, operation: run_case,
    bounded_input: {scenario, max_rounds}, expected_role in
    {establish_baseline, establish_discriminator, boundary_probe},
    prerequisite_refs (route move/probe ids this move depends on), generator
    identity/version, rationale (free text, evidence only)}. Free-form shell
    plans are invalid by schema.
judgment_answer_domain:
  labels: [settled_accepted, verification_failed_nonsettlement, budget_exhausted, execution_failed, insufficient_evidence]
  abstention: "insufficient_evidence (explicit insufficiency label, reused from the frozen T15/spec AnswerDomain vocabulary)"
  judge_input: "observation records only (typed terminal, settlement_committed count, artifact digests, timing); never the builder/provider narrative"
selection_policy_v1_frozen:
  eligibility:
    - "admission classification must be admitted (denied / unreachable / unaffordable / invalid / redundant-with-novelty-required are ineligible)"
    - "probe must have a typed terminal (a run error is execution_failed and ineligible for retention)"
    - "judgment label insufficient_evidence disqualifies a candidate whose expected_role is boundary_probe or whose consequence would be cited by the settlement criterion"
    - "payment: probe cost (1 probe unit) must fit the remaining probe budget"
    - "prerequisite_refs must already be satisfied on the route"
  ordering:
    - "1: candidates that complete an unmet route-goal prerequisite, in canonical order (baseline, then discriminator, then boundary)"
    - "2: among boundary probes, the midpoint max_rounds of the largest uncertain interval (floor((lo+hi)/2); if the midpoint is unprobed-and-affordable prefer it, ties break to the smaller max_rounds, then lexicographic candidate_id)"
    - "3: when r* is found but r*-1 is unprobed, r*-1 has boundary priority"
  retention: "exactly one eligible candidate per iteration is retained onto the route; ALL admitted candidates are still probed (evidence is never discarded); the policy never asks the judge which candidate is best"
  version: "selection-policy-v1 (frozen here; changes require an append-only addendum before further execution)"
generator_fallback_rule:
  deterministic_fallback: >-
    When no provider answer is available, the frozen deterministic generator
    proposes, in order: unmet baseline probe (e2e-happy, 8); unmet discriminator
    (e2e-lying, 8); then midpoint boundary probes of the largest uncertain
    interval (initially [3,7] since 1,2 are known-exhausting and 8 known-settling
    from T15 evidence - but this route re-establishes its own r*-1 consequence
    and never cites T15 rows as its own); K is padded by spreading across the
    interval (midpoints of the lower and upper halves).
  note: "providers may propose any catalog operation; the deterministic fallback exists so a provider outage degrades payment, not correctness"
provider_admission_policy:
  primary: "deepseek-clinepass via `opencode run -m cline-pass/cline-pass/deepseek-v4.1-flash` (frozen T16 seam identity)"
  substitution: "on provider_error/provider_timeout/schema_failure: ONE retry via muse-spark-free (`opencode run -m opencode/muse-spark-1.3-contributor-free`), recorded as substitution"
  fallback: "both providers fail -> declared deterministic fallback (mechanics-only); never counted as a provider result"
  authority_rule: "provider output is evidence only; it can classify, compare, estimate, abstain; it can never authorize, widen permissions, mutate route state directly, declare settlement, convert a failed probe into success, or override deterministic composition"
stop_conditions_frozen:
  - "route settled (goal met)"
  - "no eligible candidate remains"
  - "probe budget exhausted (12)"
  - "iteration limit reached (6)"
  - "route wall clock exceeded (2700 s)"
  - "unrecoverable execution failure (repeated run errors on distinct candidates)"
inverse_generation_acceptance_criterion:
  rule: >-
    A candidate inverse-generated case is accepted only if an independent replay
    (fresh disposable target copy, identical frozen config, fresh id seed) of
    the case genuinely settles through gauntlet's own settlement path. Generator
    assertions are never acceptance evidence. Rejections are recorded as invalid
    with the replay evidence preserved.
matched_negative_mutation:
  single_factor: "payment capacity only: the accepted generated case's max_rounds lowered one notch (r* -> r*-1); no other field changes"
  expectation: "the negative must actually fail to settle; its label is read from the run_terminal consequence, never assigned"
novelty_metric:
  fingerprint: "ordered retained-move sequence of (scenario, max_rounds) plus the final terminal of each"
  classification: "novel (no equal fingerprint in the T15/T16 grids) | near-duplicate (same operation set, different order) | structural duplicate (equal fingerprint)"
  policy: "duplicates are measured and recorded; no automatic rejection is frozen in this slice"
teeth:
  - id: T1-authority-bypass
    attack: "inject a candidate outside the frozen catalog / non-mock runner"
    expected: "denied/invalid at admission; never executed; no route transition; provider preference irrelevant"
  - id: T2-model-override
    attack: "judge strongly favors a candidate the policy declares ineligible"
    expected: "ineligible candidate cannot advance the route; disagreement recorded"
  - id: T3-fabricated-success
    attack: "inject a success report without a real gauntlet state database"
    expected: "mechanism-provenance validation refuses; no settlement; no advance"
  - id: T4-execution-failure
    attack: "candidate genuinely fails (corrupted check script)"
    expected: "failure preserved as its typed class; route does not silently advance"
  - id: T5-correlation-swap
    attack: "swap probe evidence between two candidates"
    expected: "correlation join validation fails"
  - id: T6-budget-exhaustion
    attack: "useful move remains but payment is insufficient"
    expected: "route stops or selects affordable alternative; no hidden override"
  - id: T7-invalid-inverse-case
    attack: "generated case whose replay does not settle"
    expected: "rejected; not added as valid developmental data"
  - id: T8-redundant-route
    attack: "regenerate a structurally equivalent route"
    expected: "duplicate fingerprint detected and recorded (measured, not auto-rejected)"
success_criteria_separate_claims:
  A_route_search: "the native loop constructs at least one multi-step route that genuinely settles without an LLM controlling authority or settlement"
  B_case_generation: "at least one settled route is inverted into a fresh case that independently re-settles"
  C_data_usefulness: "MEASURED, not assumed: payment comparison vs the recorded manual T15/T16 construction, novelty/duplication recorded"
  D_durability: "explicitly OUT OF SCOPE for this branch; no promotion claim, no production subsystem"
failure_interpretation:
  rule: "classify the smallest falsified layer and correct only it; preserve the failed round append-only"
  layers: [candidate_representation, candidate_generation, affordance_visibility, governance_admission, probe_execution, evidence, bounded_judgment, deterministic_selection, route_state, settlement, inverse_generation, replay_validation, payment]
  stopping: "a genuine environmental/authority blocker or a settled experimental claim ends the run; a plausible-looking route or a compilation success never does"
payment_counters_frozen:
  operator_decisions: "counted from the decision log entries after this freeze"
  wall_clock: "per-task recorded wall seconds"
  model_calls: "provider invocations recorded per call with identity and outcome"
  tool_executions: "gauntlet runs (probes, replays, teeth reruns) counted from manifests"
  failed_executions: "runs with non-typed or failing terminals counted from manifests"
  tokens_and_cost: "recorded where the provider seam exposes them; otherwise n/a (honest gap, not an estimate)"
  baseline: "the recorded T15/T16 manual construction (operator-designed 9-case grid, then the N=25 expansion): operator-authored case definitions and manual verification rounds"
prereg_harness_boundary:
  task_local: "all harness code is task-local Python under .agents/evidence/godspeed-bounded-judgment/T2*/; each script's sha256 is frozen in its task's evidence manifest before first execution and never overwritten (corrections use round-2+ paths)"
  no_product_change: "no sea-rs crate, no gauntlet source, no spec, no .sea grammar, no schema/store outside the task dirs changes in this branch"
