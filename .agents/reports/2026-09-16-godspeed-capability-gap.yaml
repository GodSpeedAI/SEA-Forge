      - "FACT sea-forge-capability/src/promotion.rs:73,80,89 — compute_policy_hash, save_policy, load_policy already implement this pattern"
    cheapest_valid_solution: "versioned rule file consumed by the existing settlement path; reuse the CapabilityPromotionPolicy save/load/hash pattern"
    value: high
    implementation_cost: low
    migration_cost: low
    uncertainty: low
    reversibility: easy

