schema: godspeed.capability_gap
schema_version: "1.0"
created: "2026-09-16"
status: review_artifact   # evidence, not a plan; no implementation is authorised by this file
source_review: "2026-09-16-godspeed-judgment-plane-adversarial-review.md"
source_spec_reviewed: ".agents/specs/GODSPEED_JUDGMENT_PLANE_SPEC.yaml"
template_respected: ".agents/specs/AGENT_SPEC_TEMPLATE.yaml"

evidence_discipline:
  legend:
    FACT: "repository or machine evidence directly establishes it (path or path:line cited)"
    INFERENCE: "evidence strongly suggests it; competing explanations named"
    ASSUMPTION: "required but not established; recorded as a gap"
    ROADMAP: "intentionally future work"
  non_claims:
    - "production readiness is not claimed from unit tests"
    - "provider replaceability is not claimed from the existence of a port trait"
    - "learning is not claimed while no weights, policy, or model behaviour change"
    - "settlement is not claimed merely because downstream code consumed a value"

target_machine:
  role: deployment_target
  identity: "NVIDIA Jetson AGX Orin 64 GB (SM87), unified CPU/GPU memory"
  evidence: "FACT edgeai/AGENTS.md:7"
  inference_stack:
    - "FACT llama.cpp GGUF SM87 — edgeai/README.md"
    - "FACT vLLM AWQ; default Qwen3.6-35B-A3B-AWQ-4bit — edgeai/README.md:140"
    - "FACT launcher OpenAI-compatible 127.0.0.1:18001, memory-aware admission — edgeai/README.md:83-90"
  optional_services:
    - "FACT nats:2.10-alpine + sea-bridge — edgeai/deploy/jetson/docker-compose.yml:331,348"
    - "FACT ruvector-postgres:arm64-local — edgeai/deploy/jetson/docker-compose.knowledge.yml:6"
  developer_host_separate:
    note: "development host has NO inference and NO database; its capacity does not constrain the design"
    evidence: "FACT ss -tlnp; which ollama psql nats-server; no GGUF/safetensors model on disk"

capabilities:
  - id: CAP-001
    capability: "bounded typed question with a declared answer domain"
    current_state: ABSENT
    production_requirement: MUST_HAVE_BEFORE_PRODUCTION
    gap: "CEP Question requires only question_id + question_form; question_type is an unconstrained string; no answer-domain, scale, or probability field exists"
    evidence:
      - "FACT cep/schemas/cep-semantic-envelope.schema.json:1385"
      - "FACT cep/spec/CEP-0005-question-model.md:178-207"
      - "FACT cep/spec/CEP-0005-question-model.md:336-352 (17-value enum exists in prose only)"
      - "FACT sxr-core/src/record_kinds.csv: question.declared, authority_class='declared evaluation context'"
    cheapest_valid_solution: "additive AnswerDomain field in the existing CEP Question envelope section"
    value: critical
    implementation_cost: low
    migration_cost: low
    uncertainty: low
    reversibility: easy

  - id: CAP-002
    capability: "uncertainty-preserving judgment output (distribution / abstention)"
    current_state: ABSENT
    production_requirement: MUST_HAVE_BEFORE_PRODUCTION
    gap: "every judgment collapses to a decision at the moment of recording"
    evidence:
      - "FACT gauntlet-domain/src/verification.rs:26-33 — VerificationRecord.outcome is a 3-valued Outcome"
      - "FACT live DB sample: verification_record@v1 payload has no probability field"
      - "FACT sea-forge-core/src/types.rs:1101 — confidence is a String"
      - "FACT sea-forge-capability/src/promotion.rs:345,363 — confidence is a deterministic weighted product"
      - "FACT cross-repo grep for probability|likelihood|posterior found no typed probability in non-test code"
    cheapest_valid_solution: "additive distribution map plus an explicit abstention arm on verification_record@v1"
    value: critical
    implementation_cost: low
    migration_cost: low
    uncertainty: low
    reversibility: easy
  - id: CAP-003
    capability: "loop correlation identity"
    current_state: ABSENT
    production_requirement: MUST_HAVE_BEFORE_PRODUCTION
    gap: "no shared value survives the round trip meaning -> judgment -> authority -> execution -> settlement; correlation is by run_id string convention across four systems"
    evidence:
      - "FACT sea-forge-core/src/types.rs:394-397 Determinism{policy_bundle_hash, action_request_hash, identity_binding_hash}"
      - "FACT gauntlet-ports/src/agent_runner.rs:240-258 ContextEnvelope{body,digest}"
      - "FACT sxr-core/src/types.rs:21-36 LedgerPosition"
      - "FACT no shared correlation type found in any of the 11 repositories"
    cheapest_valid_solution: "one field bound at case admission, echoed by sea-rs run_id, Gauntlet run_id, sxr snapshot/run refs, CEP envelope scope"
    value: critical
    implementation_cost: low
    migration_cost: low
    uncertainty: low
    reversibility: easy

  - id: CAP-004
    capability: "HTTP model provider on the judgment path"
    current_state: PARTIALLY_EXISTS
    production_requirement: MUST_HAVE_BEFORE_PRODUCTION
    gap: "Gauntlet (owner of the judgment contract) can invoke providers only as OS processes; SEA-Forge (owner of the HTTP provider) has no judgment contract"
    evidence:
      - "FACT gauntlet-adapter-agent-cli/src/config.rs:4-15,39-44 — command template, GAUNTLET_CLI_AGENT_CMD, no default, no fallback"
      - "FACT sea-forge-agent/src/provider.rs:118-184 — OpenAiCompatibleProvider POSTs /v1/chat/completions"
      - "FACT sea-forge-agent/tests/provider_contract.rs — drives the provider against a real in-process HTTP server"
      - "FACT sea-forge-agent/src/network.rs:35-48 — loopback HTTP via allow_loopback_test; production requires HTTPS"
      - "FACT provider.rs is consumed only by delegation.rs and sea-forge-server/src/agent_probe.rs"
    cheapest_valid_solution: "one HTTP AgentRunner adapter under gauntlet/crates/adapters, reusing the existing transport shape"
    value: high
    implementation_cost: low
    migration_cost: low
    uncertainty: low
    reversibility: easy

  - id: CAP-005
    capability: "model identity and surface hash on judgment records"
    current_state: ABSENT
    production_requirement: MUST_HAVE_BEFORE_PRODUCTION
    gap: "historical judgments cannot be attributed to a model; no decision-surface hash exists"
    evidence:
      - "FACT live DB sample: role_invocation payload carries model: null"
      - "FACT live DB sample: verification_record@v1 carries instrument{name,version,deterministic} but no provider/model identity"
      - "FACT gauntlet-domain/src/role_invocation.rs:110-131 has context_envelope_digest but no decision-surface hash"
    cheapest_valid_solution: "populate forward-only; mark historical rows unattributed rather than fabricating attribution"
    value: high
    implementation_cost: low
    migration_cost: low
    uncertainty: low
    reversibility: moderate

