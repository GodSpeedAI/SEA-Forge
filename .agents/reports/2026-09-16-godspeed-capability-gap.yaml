not_built:
  rationale: "explicit architectural refusals, each with a reason"
  items:
    - what: "a judgment runtime, service, or daemon"
      why: "the judgment path is a library call inside an existing process; a service adds deployment, auth, tenancy and failure modes for zero capability on a single-box appliance"
    - what: "a third provider port"
      why: "two ports already exist with typed failures, cancellation, budgets and per-port contract suites"
    - what: "CaseAssessment / JudgmentComposer / JudgmentObservation as new types"
      why: "SettlementClaim+SettlementEvent, sea-forge-settlement, and VerificationRecord already carry these distinctions; new nouns create a second truth"
    - what: ".sea grammar changes"
      why: "ApplicationContract + ReferenceDefinition are sufficient to materialise a surface; the spec itself defers compilation to roadmap (spec:1410-1416)"
    - what: "a new event schema or CEP version bump for the first slice"
      why: "sxr pins the CEP envelope schema by sha256 (sxr-core/src/embedded_schema.rs:15); a bump breaks a hash-pinned conformance contract for no slice-1 gain"
    - what: "a new database or message broker on the judgment path"
      why: "Gauntlet SQLite already holds the consequence chain; Postgres/NATS/PGMQ/ruVector are absent from the judgment path today"
    - what: "a training pipeline or weight updates"
      why: "no mechanism exists and none is needed to prove bounded judgment; claiming learning today would be false"
    - what: "a sixth Agent Memory Ledger service"
      why: "five ledger implementations already exist; the correct action is one ownership decision, not another store"
    - what: "deleting, rewriting, or re-languaging any repository"
      why: "every repository inspected is internally coherent; this is a wiring problem, not a code problem"
    - what: "DomainForge DecisionSurface compilation"
      why: "roadmap; requires evidence that a derived artifact is insufficient first"

next_action:
  id: PROOF-1
  action: "Build a read-only, replayable measurement harness over Gauntlet's 16 existing run databases"
  question_answered: "does a bounded question with a declared answer domain, answered by two materially independent providers, carry information about the recorded settlement that the existing 3-valued deterministic rung does not?"
  writes_production_code: false
  changes_schema: false
  adds_service: false
  modifies_persisted_data: false
  required_evidence:
    - "machine-readable dataset: one row per recoverable historical judgment"
    - "coverage report: reconstructibility per run and per missing field"
    - "calibration report: Brier, reliability by label, abstention rate, provider disagreement rate, deterministic-rung baseline"
    - "explicit falsification statement if the distribution carries no information"
  decisions_unlocked:
    informative_distribution: "build the HTTP adapter and the AnswerDomain field"
    no_information_gain: "reject the uncertainty requirement and redirect effort to CAP-010/011/013"
    corpus_not_reconstructible: "fix provenance (CAP-005) and export (CAP-015) first; judgment is premature"
    providers_disagree_completely: "the first decision surface is wrong; choose one from residual rows instead"
