    The architectural reduction stands. This revision narrows CLAIMS and SCOPE: it
    separates proven reuse from asserted universality, scopes falsification to the level
    actually examined, replaces an unearned calibration claim with an exploratory pilot
    measurement, separates the two authorities inside a derived surface, demotes Judgment
