final_self_check:
  purpose: "Independent verification of the eleven corrections, recorded with the specification."
  statements:
    - statement: "VerificationRecord is the first carrier, not asserted as the eternal universal judgment abstraction."
      holds: true
      where: "core_domain_model.entities[JudgmentObservation].universality_clause; rejected_or_merged_ledger; NONGOAL-008; roadmap_boundaries.judgment_carrier_generalization"
    - statement: "One failed probabilistic surface cannot falsify the whole capability class."
      holds: true
      where: "core_domain_model.entities[ScopeOfFalsification]; REQ-JUDG-023; REQ-OUT-006/007; proof_1_definition.admissible_outcomes[C]"
    - statement: "The pilot does not claim calibration."
      holds: true
      where: "proof_and_observability.pilot_measurement_metrics; REQ-VERIFY-012; REQ-VERIFY-004; CLAIM-003.explicitly_not_claiming; roadmap_boundaries.judgment_calibration"
    - statement: "DomainForge remains sole semantic authority."
      holds: true
      where: "REQ-AUTH-006; system_overview.components[DecisionSurface].dual_basis_requirement; NONGOAL-010"
    - statement: "Evaluation context cannot silently become semantic authority."
      holds: true
      where: "REQ-AUTH-006; NONGOAL-010; REQ-SEC-004.reinforced_by"
    - statement: ".sea grammar remains unchanged."
      holds: true
      where: "roadmap_boundaries[DomainForge-compiled DecisionSurfaces].current_requirement; correction C8"
    - statement: "No new judgment service, database, or provider port is required."
      holds: true
      where: "architecture_concern.what_it_is_not; NONGOAL-007; NONGOAL-009; rejected_or_merged_ledger[JudgmentProvider]"
    - statement: "Loop-wide correlation remains first-class."
      holds: true
      where: "REQ-PROV-021 (blocking); REQ-PROV-022; system_overview.components[LoopCorrelationIdentity]"
    - statement: "Jev compatibility is separated into interface, operational, and model-quality claims."
      holds: true
      where: "CLAIM-006.levels A/B/C; roadmap_boundaries[TypeSafe Jev provider].comparability_levels"
    - statement: "CEP physical placement of AnswerDomain remains contingent on compatibility evidence."
      holds: true
      where: "REQ-JUDG-024; core_domain_model.entities[Question].compatibility; U1 (OPEN)"
    - statement: "PROOF-1 can produce a useful result even if the original judgment hypothesis fails."
      holds: true
      where: "proof_1_definition.admissible_outcomes[A/B/C/E] each carry a bounded conclusion and a next step; OUT-007"
    - statement: "The specification still reflects the repository-grounded reduction discovered by the adversarial review."
      holds: true
      where: "correction_ledger.net_effect_on_the_reduction; correction_ledger.architectural_conclusions_reversed = none"
  conclusion: >-
    All twelve statements hold. No architectural conclusion from the adversarial review was
    reversed. No requirement was weakened. This proposal remains a PROPOSAL: baseline
    v0.1.0 stays authoritative until accepted, and neither PROOF-1 nor any implementation
    work is authorised by this file.
