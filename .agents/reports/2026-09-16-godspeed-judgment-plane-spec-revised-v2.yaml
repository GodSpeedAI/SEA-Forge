# =============================================================================
# GODSPEED JUDGMENT PLANE — CORRECTED PROPOSED NORMATIVE SPECIFICATION (v2)
# =============================================================================
# PROVENANCE (nothing is overwritten)
#   baseline_normative : .agents/specs/GODSPEED_JUDGMENT_PLANE_SPEC.yaml  (v0.1.0, draft, UNCHANGED)
#   template           : .agents/specs/AGENT_SPEC_TEMPLATE.yaml            (UNCHANGED)
#   previous_proposal  : 2026-09-16-godspeed-judgment-plane-spec-revised.yaml      (v0.2.0, RETAINED)
#   previous_delta     : 2026-09-16-godspeed-spec-delta.yaml                      (RETAINED)
#   review             : 2026-09-16-godspeed-judgment-plane-adversarial-review.md (RETAINED)
#   this_file          : corrected proposal v0.3.0  (supersedes v0.2.0 AS A PROPOSAL ONLY)
#   correction_note    : 2026-09-16-godspeed-spec-correction-note.md
#
# WHAT THIS FILE IS
#   A SPEC CORRECTION, not an implementation and not a new repository review. It
#   corrects eleven places where v0.2.0 asserted more than the evidence supports.
#
# RULES OBSERVED
#   1. Stable requirement IDs are PRESERVED VERBATIM. No baseline ID is renumbered or reused.
#   2. New IDs are introduced ONLY where the corrected distinction did not previously exist.
#   3. Rejected or merged items remain recorded; nothing is silently dropped.
#   4. Every material change carries `corrected_in_v0_3_0` and the reason it was over-broad.
#   5. No implementation, no PROOF-1 execution, no production change is authorised by this file.
# =============================================================================

schema: agent.spec
schema_version: "1.0"

correction_ledger:
  purpose: >-
    A reader must be able to see, in the specification itself, exactly which v0.2.0
    statements exceeded the evidence and what replaced them.
  corrections:
    - id: C1
      subject: VerificationRecord
      v0_2_0_over_reach: >-
        v0.2.0 rejected a generic judgment record because VerificationRecord was treated
        as the universal replacement for any bounded probabilistic judgment.
      corrected_position: >-
        Slice 1 MUST reuse VerificationRecord unless evidence demonstrates it cannot
        preserve the required distinction. Reuse is PROVEN; universality is NOT. No new
        generic probabilistic-result type may be introduced until a concrete
        non-verification use case demonstrates semantic insufficiency.
      preserves_the_reduction: true
    - id: C2
      subject: falsification scope
      v0_2_0_over_reach: >-
        v0.2.0 declared that no information gain on the first surface would FALSIFY the
        bounded-judgment hypothesis and collapse the specification.
      corrected_position: >-
        A negative result falsifies a SURFACE, not the capability class. A system-level
        rejection requires evidence spanning materially different judgment shapes.
      preserves_the_reduction: true
    - id: C3
      subject: pilot measurement terminology
      v0_2_0_over_reach: >-
        v0.2.0 required a CALIBRATION report from a corpus of 17 settled judgments with
        incomplete model attribution and lower effective diversity than 16 runs.
      corrected_position: >-
        The first output is a bounded-judgment PILOT MEASUREMENT report. The term
        calibration is reserved for a later evidence level with a sufficient corpus,
        representative variation, attribution, and held-out evaluation.
      preserves_the_reduction: true
    - id: C4
      subject: DecisionSurface authority
      v0_2_0_over_reach: >-
        v0.2.0 derived DecisionSurface from DomainForge plus Gauntlet without stating
        which of the two owns semantic possibility and which owns the question.
      corrected_position: >-
        DomainForge owns semantic possibility and identity. Gauntlet/CEP evaluation
        context owns the question asked of that world. A derived surface MUST carry both
        bases distinguishably. Gauntlet MUST NOT become a second semantic authority.
      preserves_the_reduction: true
    - id: C5
      subject: Judgment Plane as a noun
      v0_2_0_over_reach: >-
        v0.2.0 rejected the runtime component but left the phrase ambiguous enough to be
        read as a deployable thing.
      corrected_position: >-
        Judgment Plane names an ARCHITECTURAL CONCERN only. It MUST NOT imply a daemon,
        microservice, database, deployment unit, provider port, or independent
        persistence subsystem.
      preserves_the_reduction: true
    - id: C6
      subject: loop correlation identity
      v0_2_0_over_reach: >-
        v0.2.0 described the correlation identity as one field echoed at four boundaries,
        which implied a forced identical field in every subsystem.
      corrected_position: >-
        The requirement is JOINABILITY, not a field name. The mechanism (direct echo,
        envelope projection, mapping table, or another lossless mechanism) is
        implementation-defined unless an existing repository contract forces one.
      preserves_the_reduction: true
    - id: C7
      subject: Jev comparability
      v0_2_0_over_reach: >-
        v0.2.0 used Jev-comparable language without separating interface, operational,
        and model-quality claims.
      corrected_position: >-
        Three separate claims A (interface), B (operational), C (model quality). Only A
        currently has architectural support. B requires the proving slice and target
        hardware evidence. C is UNPROVEN.
      preserves_the_reduction: true
    - id: C8
      subject: the reduction itself
      v0_2_0_over_reach: none
      corrected_position: >-
        The architectural reductions stand unchanged: no judgment service, no third
        provider port, no new database, no .sea grammar change, Authority remains with
        SEA-Forge, composition stays outside the model, evidence is never permission.
      preserves_the_reduction: true
    - id: C9
      subject: AnswerDomain physical placement
      v0_2_0_over_reach: >-
        v0.2.0 stated AnswerDomain is realized in CEP-0005 and relocated Question into
        CEP, as though CEP compatibility were already established.
      corrected_position: >-
        The DISTINCTION is normative: every bounded question MUST have an explicit,
        versioned answer domain. The CARRIER is implementation-defined for slice 1 and
        subject to compatibility evidence. CEP is the preferred semantic home only if
        compatibility and ownership are proven. U1 remains OPEN.
      preserves_the_reduction: true
    - id: C10
      subject: PROOF-1 governing question and outcomes
      v0_2_0_over_reach: >-
        v0.2.0 gave PROOF-1 a single pass/fail framing and one over-general failure
        conclusion.
      corrected_position: >-
        PROOF-1 answers a two-part question and has five admissible outcomes (A-E), each
        with its own bounded conclusion and its own forbidden inference.
      preserves_the_reduction: true
    - id: C11
      subject: pilot metrics
      v0_2_0_over_reach: >-
        v0.2.0 listed metrics without the mandatory disclosure set, inviting
        population-level reading of a tiny sample.
      corrected_position: >-
        Descriptive metrics MAY be computed; a mandatory disclosure block MUST accompany
        them; inferential-looking precision MUST NOT be used to imply a population
        conclusion; unstable metrics MUST be labelled unstable.
      preserves_the_reduction: true
  net_effect_on_the_reduction: >-
    No architectural conclusion from the adversarial review is reversed. Every reduction
    is preserved. The corrections narrow CLAIMS and SCOPE; they do not widen the system.
  requirement_ids_changed: none_renumbered
  requirement_ids_amended: [REQ-OUT-006, REQ-JUDG-020, REQ-PROV-021, REQ-VERIFY-004]
  requirement_ids_added: [REQ-OUT-007, REQ-JUDG-023, REQ-JUDG-024, REQ-AUTH-006, REQ-PROV-022, REQ-VERIFY-012, CLAIM-006, NONGOAL-008, NONGOAL-009, NONGOAL-010]
  architectural_conclusions_reversed: none

