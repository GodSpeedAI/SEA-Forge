architectural_concern:
  corrected_in_v0_3_0: C5
  name: "Judgment Plane"
  what_it_is: >-
    The architectural responsibility that preserves the distinction between represented
    state, bounded learned inference, deterministic composition, and authority.
  what_it_is_not: >-
    It is NOT a daemon, microservice, database, deployment unit, third provider port, or
    independent persistence subsystem. It MUST NOT be scheduled, deployed, scaled, or
    operated as a unit, because it has no runtime identity of its own.
  physical_realization: >-
    Spans existing contracts in Gauntlet (invocation boundary, judgment record,
    verification ladder), CEP and RealityTrace (question, claim, evidence and settlement
    record kinds), DomainForge (semantic identity), SEA-Forge (authority, settlement,
    ledger), and the existing evidence substrates.
  normative_use_rule: >-
    A requirement MAY refer to the Judgment Plane as a responsibility boundary. A
    requirement MUST NOT require a component, service, port, store, or deployment artifact
    to exist under that name.
  resolves_apparent_contradiction: >-
    'GodSpeed needs bounded judgment' and 'GodSpeed does not need a new Judgment Plane
    component' are both true because the first is a CAPABILITY requirement and the second
    is a REALIZATION constraint.
  evidence:
    - "FACT the judgment path is a library call inside an existing process at every current invocation site"
    - "FACT two provider ports already exist, each with typed failure, cancellation, budgets and contract suites"
    - "FACT the target is a single appliance"

