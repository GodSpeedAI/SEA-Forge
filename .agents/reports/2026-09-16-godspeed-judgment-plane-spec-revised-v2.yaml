unresolved_questions:
  status: open
  corrected_in_v0_3_0: [C1, C2, C7, C9]
  items:
    - id: U1
      question: "Can an additive optional answer-domain field coexist with the RealityTrace-pinned CEP envelope schema hash without a CEP amendment?"
      class: ASSUMPTION
      status: OPEN - deliberately not settled by this specification
      impact: "Determines whether the answer domain is physically carried in CEP or in an existing evaluation artifact."
      carrier_options: ["additive CEP field if compatibility is proven", "existing result-contract artifact", "another existing hash-addressed evaluation artifact"]
      must_not: "The specification MUST NOT require physical storage in CEP-0005 before compatibility is demonstrated."
      close_by: "read the record-kind conformance validator and trace whether one run emits both artifacts"
    - id: U2
      question: "Do any of the 16 run databases contain records of kind observation, comparison, residual, or promotion_decision?"
      class: FACT_PARTIAL
      impact: "Determines how many historical judgments are reconstructible."
      close_by: "one read-only query across all 16 databases"
    - id: U3
      question: "Is the authority-gated model probe's Accepted settlement an operational settlement or a probe-local result?"
      class: INFERENCE
      impact: "Determines whether any existing path already treats model output as settlement."
      close_by: "read the probe implementation and its caller in full"
    - id: U4
      question: "Can the Gauntlet crate graph depend on the SEA-Forge agent crate, or must the HTTP transport be reimplemented?"
      class: ASSUMPTION
      impact: "Determines whether the one new adapter reuses existing transport code or duplicates a small wire shape."
      close_by: "read the dependency policy and one existing adapter"
    - id: U5
      question: "What is the real bounded-question latency and model-swap cost on the target appliance?"
      class: ASSUMPTION
      impact: "Determines whether per-question invocation is economic at the model rung, and is required for comparability level B."
      close_by: "read the appliance benchmark artifacts, then measure on target"
    - id: U6
      question: "Which noun will carry probabilistic judgment, and how will the existing deterministic judgment usages be named?"
      class: DECISION_REQUIRED
      impact: "BLOCKS the addition of any probabilistic type into a crate that already exports a deterministic judgment noun."
      owner: "architecture decision, ask-first because it is a public-interface naming change"
    - id: U7
      question: "Does uncertainty carry incremental information over the deterministic instrument, on the first surface?"
      class: EVIDENCE_REQUIRED
      impact: "Decides whether probabilistic judgment is promoted for that surface. It does NOT decide the capability class."
      scope: surface
      close_by: "PROOF-1, once authorised"
    - id: U8
      question: "Which other judgment shape should be examined if the first surface shows no gain?"
      class: DECISION_REQUIRED
      corrected_in_v0_3_0: C2
      impact: "Determines whether a capability-class conclusion can ever be recorded."
      requirement: "must be a materially different shape from the first (binary or proposition, multiclass choice or classification, ordered score or rubric)"
      owner: "architecture decision, informed by the shape most likely to carry uncertainty"
    - id: U9
      question: "Are several named loop components intended to be connected, or intentionally out of the runtime path?"
      class: DECISION_REQUIRED
      impact: "Determines whether their current absence is a defect or a scope decision."
      owner: "operator confirmation"

