  purpose: "Lets a cold reader verify that no baseline requirement ID was lost."
  preservation_policy: "every baseline REQ-* ID appears in this revision, either as a preserved item or in rejected_or_merged_ledger"
  baseline_groups_and_ids:
    - "REQ-GOAL-001..007"
    - "NONGOAL-001..006 (plus added NONGOAL-007)"
    - "OUT-001..005 (plus added OUT-006)"
    - "CLAIM-001..004 (plus added CLAIM-005)"
    - "REQ-CONFIG-001..004, REQ-CONFIG-010..012 (plus added composition_rule_artifact, unresolved_reference_policy)"
    - "REQ-JUDG-001..003, REQ-JUDG-010..014 (plus added REQ-JUDG-020..022)"
    - "REQ-AUTH-001..005"
    - "REQ-COMP-001..003 (plus added REQ-COMP-020)"
    - "REQ-PROV-001..004 (plus added REQ-PROV-020..021)"
    - "REQ-SETTLE-001..003"
    - "REQ-SAFE-001..005"
    - "REQ-SEC-001..005"
    - "REQ-VERIFY-001..005 (plus added REQ-VERIFY-010..011; see preserved_requirement_enumerations)"
