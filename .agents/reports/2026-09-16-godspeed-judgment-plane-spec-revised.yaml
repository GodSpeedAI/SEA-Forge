    - "RECOV-001..004 (baseline spelling has no REQ- prefix)"

preserved_requirement_enumerations:
  purpose: >-
    Groups retained verbatim so that the completeness check (every baseline REQ id present)
    is mechanically verifiable. Texts are preserved; current_state annotations are added.
  outcome_contract:
    change_disposition: keep
    items:
      - id: REQ-OUT-001
        text: "Every successful request MUST produce a judgment record conforming to the stable schema."
      - id: REQ-OUT-002
        text: "Every judgment record MUST identify the DecisionSurface and semantic projection used."
        current_state: "REQUIREMENT EXISTS; NO IMPLEMENTATION SITE CAN SATISFY IT - no surface identity is persisted on any judgment record."
        enforced_by: [REQ-PROV-020]
      - id: REQ-OUT-003
        text: "Every individual judgment MUST be constrained to the declared output type and value set."
        current_state: "PARTIAL - the output type is constrained by a result contract; the value set cannot be constrained because no AnswerDomain is declared."
        enforced_by: [REQ-JUDG-020]
      - id: REQ-OUT-004
        text: "Provider metadata MUST be preserved below the stable abstraction without changing its meaning."
        current_state: "PARTIAL - instrument name and version are preserved; provider and model identity are not."
        enforced_by: [REQ-PROV-020]
      - id: REQ-OUT-005
        text: "The output MUST distinguish judgment result from downstream authority decision and settlement."
        current_state: "SATISFIED - the judgment record is separate from the authority verdict and from the settlement record."
      - id: REQ-OUT-006
        text: "The system MUST be able to report an explicit FALSIFICATION of the bounded-judgment hypothesis when measurement shows the distribution carries no information over the existing deterministic instrument."
        change_disposition: add
        evidence: "the review's PROOF-1 acceptance criteria require a reachable falsification outcome"
  outcome_verified:
    change_disposition: keep
    items:
      - id: REQ-VERIFY-001
        text: "The same frozen request can be replayed with provenance sufficient to explain input and output."
        current_state: "PARTIAL - replay is possible within one component; the request is not frozen across components."
        enforced_by: [REQ-PROV-021]
      - id: REQ-VERIFY-002
        text: "At least two providers can satisfy the same stable contract without upstream semantic changes."
        current_state: "PARTIALLY SATISFIED - three real runners exist behind one port, and one HTTP provider exists behind another port; no cross-port semantic comparison has been performed."
        enforced_by: [REQ-VERIFY-011]
      - id: REQ-VERIFY-003
        text: "Provider failure yields a typed non-authoritative state and never permissive fallback."
        current_state: "SATISFIED - typed error taxonomies exist; provider failure settles Rejected rather than Accepted."
      - id: REQ-VERIFY-004
        text: "Historical Gauntlet cases can compare pre-consequence judgment with later settlement."
        current_state: "PARTIALLY SATISFIED - the schema and correlation exist; the corpus is thin (17 settled judgments) and model identity is absent."
        enforced_by: [REQ-PROV-020]
      - id: REQ-VERIFY-005
        text: "SEA-Forge can consume judgment evidence without delegating ALLOW authority to the model."
        current_state: "SATISFIED BY CONSTRUCTION, UNPROVEN BY TEST."
        enforced_by: [REQ-VERIFY-010]
  security_boundaries:
    change_disposition: keep
    items:
      - id: REQ-SEC-001
        text: "Model/provider output MUST be treated as untrusted data until schema and semantic validation succeed."
      - id: REQ-SEC-002
        text: "Judgment providers MUST have no ambient privilege to perform downstream domain actions."
      - id: REQ-SEC-003
        text: "Provider secrets MUST be supplied through approved secret/config boundaries and excluded from evidence."
      - id: REQ-SEC-004
        text: "Untrusted context MUST NOT be able to redefine DecisionSurface values, provider configuration, or authority policy."
      - id: REQ-SEC-005
        text: "Downstream privileged action MUST cross the existing SEA-Forge authority boundary."
    current_state: "SHAPE SATISFIED - credentials use indirection, network destinations are validated, and tool calls re-enter authority."
  repeatability_variation:
    change_disposition: keep
    preservation_note: "Retained verbatim. VAR-007 already encodes the no-fabrication discipline that REQ-JUDG-013 states."
    items:
      - id: VAR-001
        case: "Known historical blockage with represented and affordable outcome."
        expected: "Bounded judgment produced; later settlement comparison available."
        corpus_availability: "FACT 16 run DBs exist; 17 settled judgments available for this case class."
      - id: VAR-002
        case: "Represented but unaffordable or blocking case."
        expected: "Judgment remains within declared classes and uncertainty is explicit."
      - id: VAR-003
        case: "Capability-deficit case."
        expected: "No invented capability or authority; deficit can be represented as judgment evidence."
      - id: VAR-004
        case: "Unrepresented or unknown case."
        expected: "The system does not coerce the case into a known class when declared evidence rules say insufficient."
        enforced_by: [REQ-JUDG-020]
      - id: VAR-005
        case: "Same frozen request evaluated by two providers."
        expected: "Both outputs normalize to the same stable schema and remain semantically comparable."
        enforced_by: [REQ-VERIFY-011]
      - id: VAR-006
        case: "Provider returns a malformed or out-of-domain value."
        expected: "Result is rejected; no downstream authority progression."
        enforced_by: [REQ-JUDG-020]
      - id: VAR-007
        case: "Provider supplies a result without a probability distribution."
        expected: "Result may be represented if the contract permits, but probability MUST remain absent."
      - id: VAR-008
        case: "Settlement later contradicts a high-confidence judgment."
        expected: "The original judgment remains immutable; the contradiction becomes calibration and development evidence."
        current_state: "SATISFIED IN DESIGN - all judgment stores are append-only; the calibration consumer does not yet exist."
  required_recovery_cases:
    change_disposition: keep
    items:
      - id: RECOV-001
        case: "Provider timeout or unavailable."
        expected: "Bounded retries if configured, then a typed failure; no hidden permissive fallback."
      - id: RECOV-002
        case: "Evidence persistence fails after a valid provider result."
        expected: "The request is incomplete or failed for durable use; the raw result MUST NOT silently become authority evidence."
      - id: RECOV-003
        case: "Semantic pack or surface version mismatch."
        expected: "Reject before provider invocation or downstream consumption."
        enforced_by: [REQ-JUDG-021, RECOV-003]
      - id: RECOV-004
        case: "Duplicate request identity with different content."
        expected: "Conflict error; never overwrite prior evidence."
  safety_requirements:
    change_disposition: keep
    note: "Texts preserved from the baseline safety group; not reproduced here in full to avoid duplication with the baseline, which remains authoritative for these five."
    ids: [REQ-SAFE-001, REQ-SAFE-002, REQ-SAFE-003, REQ-SAFE-004, REQ-SAFE-005]
