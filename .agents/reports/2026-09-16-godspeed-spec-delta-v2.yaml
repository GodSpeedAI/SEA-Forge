  carried_from_v1:
    note: "introduced in the v1 delta and retained unchanged in substance"
    items:
      - {id: REQ-JUDG-020, purpose: "explicit declared answer domain per question"}
      - {id: REQ-JUDG-021, purpose: "declared unresolved-reference policy; no placeholder identity"}
      - {id: REQ-JUDG-022, purpose: "typed place to hold a distribution or an explicit abstention"}
      - {id: REQ-PROV-020, purpose: "provider, model, surface and semantic identity on every judgment"}
      - {id: REQ-PROV-021, purpose: "loop correlation identity (blocking)"}
      - {id: REQ-COMP-020, purpose: "versioned, hash-addressable composition rules"}
      - {id: REQ-VERIFY-010, purpose: "adversarial authority non-bypass test"}
      - {id: REQ-VERIFY-011, purpose: "cross-provider semantic comparison"}
      - {id: CLAIM-005, purpose: "no learning claim while nothing changes weights"}
      - {id: NONGOAL-007, purpose: "no new component, port, schema, database or DSL construct where one already exists"}
  added_in_v0_3_0:
    note: "introduced only because the corrected distinction did not previously exist"
    items:
      - id: REQ-OUT-007
        corrects: C2
        purpose: "a scoped non-promotion outcome so a bounded negative result is expressible"
      - id: REQ-JUDG-023
        corrects: C2
        purpose: "a negative result MUST declare its scope of falsification; a capability-class conclusion needs at least two materially different judgment shapes"
      - id: REQ-JUDG-024
        corrects: C9
        purpose: "the answer-domain requirement is carrier-independent, and the carrier must be declared, recorded and versioned"
      - id: REQ-AUTH-006
        corrects: C4
        purpose: "contributing evaluation context MUST NOT confer semantic authority; DomainForge remains sole"
      - id: REQ-PROV-022
        corrects: C6
        purpose: "the correlation mechanism is implementation-defined and must be proven lossless by a joinability test"
      - id: REQ-VERIFY-012
        corrects: [C3, C11]
        purpose: "pilot reporting discipline: mandatory disclosure block, reserved terminology, instability statements"
      - id: CLAIM-006
        corrects: C7
        purpose: "comparability MUST be claimed at an explicit level (interface, operational, model quality)"
      - id: NONGOAL-008
        corrects: C1
        purpose: "neither asserting a universal carrier from one family nor forbidding a future carrier without evidence"
      - id: NONGOAL-009
        corrects: C5
        purpose: "the Judgment Plane MUST NOT be realized as a deployable unit"
      - id: NONGOAL-010
        corrects: C4
        purpose: "evaluation context MUST NOT become semantic authority"
  amended:
    items:
      - id: REQ-OUT-006
        corrects: C2
        was: "a falsification of the bounded-judgment hypothesis"
        now: "a negative result at an explicitly declared scope, never generalized beyond it"
      - id: REQ-JUDG-020
        corrects: C9
        was: "the answer domain is realized in CEP-0005"
        now: "the answer domain is required; the carrier is declared, recorded and versioned (REQ-JUDG-024)"
      - id: REQ-PROV-021
        corrects: C6
        was: "one field echoed at four boundaries"
        now: "joinability without heuristic string matching; mechanism implementation-defined"
      - id: REQ-VERIFY-004
        corrects: C3
        was: "historical replay supports the capability claim"
        now: "historical replay establishes MEASURABILITY only, with corpus limits stated in the same artifact"

propositions:
  change_from_v1: >-
    All fifteen propositions from the v1 delta are carried. Six had their CONCLUSION
    narrowed because PROOF-1 was previously given too much epistemic authority, and two had
    the Jev-comparability reading separated into claim levels. No verdict changed from TRUE
    to FALSE or the reverse except where noted, and no architectural conclusion was reversed.
  items:
    - id: PROP-01
      proposition: "GodSpeed actually needs a new Judgment Plane"
      verdict: "TRUE but NARROW"
      confidence: high
      changed_from_v1: "the phrase Judgment Plane is now explicitly an architectural concern, resolving the language ambiguity"
    - id: PROP-02
      proposition: "Judgment Plane deserves its own runtime component"
      verdict: FALSE
      confidence: high
      changed_from_v1: none
    - id: PROP-03
      proposition: "JudgmentObservation deserves a new type"
      verdict: "FALSE FOR SLICE 1; NOT UNIVERSALLY ESTABLISHED"
      confidence: "high for the slice, low for universality"
      changed_from_v1: >-
        v1 stated an unqualified FALSE. The evidence supports the slice-1 conclusion and
        does NOT support extending it to non-verification judgment families.
      corrected_in_v0_3_0: C1
    - id: PROP-04
      proposition: "CaseAssessment deserves a new type"
      verdict: FALSE
      confidence: high
      changed_from_v1: none
    - id: PROP-05
      proposition: "DomainForge should compile DecisionSurfaces"
      verdict: PREMATURE
      confidence: medium-high
      changed_from_v1: >-
        additionally clarified that DomainForge owns SEMANTIC possibility while the
        evaluation context owns the QUESTION, so a future compiler has a defined boundary
      corrected_in_v0_3_0: C4
    - id: PROP-06
      proposition: "SEA-Forge is the correct authority owner"
      verdict: TRUE
      confidence: high
      changed_from_v1: "strengthened by REQ-AUTH-006, which extends the same boundary to semantic authority"
      corrected_in_v0_3_0: C4
    - id: PROP-07
      proposition: "Gauntlet is the correct execution and orchestration owner"
      verdict: "TRUE, with an unprotected ownership"
      confidence: high
      changed_from_v1: "clarified that Gauntlet's evaluation context confers no semantic authority, which limits how far its ownership extends"
      corrected_in_v0_3_0: C4
    - id: PROP-08
      proposition: "RealityTrace is the correct consequence and evidence owner"
      verdict: "TRUE IN PROTOCOL, UNPROVEN IN RUNTIME"
      confidence: medium
      changed_from_v1: none
    - id: PROP-09
      proposition: "Agent Memory Ledger is the correct developmental-memory owner"
      verdict: FALSE AS STATED
      confidence: medium-high
      changed_from_v1: none
    - id: PROP-10
      proposition: "Existing event schemas can remain stable"
      verdict: "TRUE FOR SLICE 1"
      confidence: high
      changed_from_v1: "additional support: the answer domain need not be physically in CEP, so no CEP version change is required to begin"
      corrected_in_v0_3_0: C9
    - id: PROP-11
      proposition: "A local Qwen provider can approximate the desired interface sufficiently for development"
      verdict: "TRUE for interface; reliability and latency must be measured"
      confidence: "high on interface, medium on reliability"
      changed_from_v1: "the reserved level-B claim now makes the unmeasured part explicit"
      corrected_in_v0_3_0: C7
    - id: PROP-12
      proposition: "Jev can eventually be added as a pure adapter"
      verdict: "TRUE at interface level only"
      confidence: medium-high
      changed_from_v1: >-
        v1 asserted affordability without separating claim levels. Adding the adapter would
        support level A; level B requires target evidence; level C is unproven.
      corrected_in_v0_3_0: C7
    - id: PROP-13
      proposition: "Historical Gauntlet data is sufficient for calibration"
      verdict: FALSE
      confidence: high
      changed_from_v1: "reinforced: the output is now named a pilot measurement, and calibration is roadmap-gated"
      corrected_in_v0_3_0: C3
    - id: PROP-14
      proposition: "The stack is close enough to production that convergence beats simplification"
      verdict: "TRUE, with named exceptions"
      confidence: medium-high
      changed_from_v1: none
    - id: PROP-15
      proposition: "Separate repositories provide useful modularity rather than accidental fragmentation"
      verdict: MIXED
      confidence: medium
      changed_from_v1: none
  summary:
    true: [PROP-01, PROP-06, PROP-07, PROP-10, PROP-11, PROP-12, PROP-14]
    false: [PROP-02, PROP-03, PROP-04, PROP-09, PROP-13]
    partial_or_deferred: [PROP-05, PROP-08, PROP-15]
    highest_confidence_falsification: PROP-13
    most_consequential_narrowing: PROP-03

