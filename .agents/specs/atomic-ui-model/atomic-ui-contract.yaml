# Atomic UI IR Contract
# Source Authority: /home/sprime01/projects/sea-rs/.sea/interaction/interaction-model.sea
# Behavioral Authority: /home/sprime01/projects/sea-rs/.agents/specs/behavioral-interaction-proof/contract.yaml
