        behavioral_phase: "IS1"
        elements: ["cell_identity_display", "actor_attribution_display", "self_model_hash_display", "cell_status_indicator"]
        idm_concept: "CellIdentity, SelfModelSnapshot"
      - region_id: "readiness_overview"
