# Behavioral Interaction Proof Contract
# Governing Framework: IS1–IS8 Semantic Interaction Phases
# Authority: /home/sprime01/projects/sea-rs/.sea/interaction/interaction-model.sea
# Standard: /home/sprime01/projects/project-topology-architect/skills/deriving-behavioral-interaction-proofs

version: "1.0.0"
governing_model:
  source: ".sea/interaction/interaction-model.sea"
  authority: "canonical"
  namespace: "sea_forge.interaction"

phases:
  IS1_context_selection:
    ordinal: 1
    purpose: "Select or supply the governed cell, actor, case, semantic model, source, provider, and work context, together with the immutable snapshots that context depends on."
    captures: "Only context needed to expose the next consequential move."
    required_fields:
      - actor
      - cell_root
      - operative_context

  IS2_preflight:
    ordinal: 2
    purpose: "Validate readiness, availability, dependency, compatibility, and limit constraints before a protected action is attempted."
    captures: "Preconditions, required parameters, version/schema compatibility, limit checks."
    required_fields:
      - checks
      - readiness_state

  IS3_authority_resolution:
    ordinal: 3
    purpose: "Resolve disclosure, policy, eligibility, separation of duty, and the exact grant before any effect, including read-only disclosure."
    captures: "Role authority, approval requirements, escalation paths, prohibitions, obligations. Note: Capability != Authority."
    required_fields:
      - required_role
      - grant_scope
      - separation_of_duty

  IS4_capability_invocation:
    ordinal: 4
    purpose: "Invoke exactly one typed, bounded behavior inside the granted boundary. Intent is never interpolated into an untyped command or path."
    captures: "Executable binding, invocation bounds, parameters. If capability lacks implementation, mark status: unresolved."
    required_fields:
      - capability_id
      - boundary_spec

  IS5_state_and_artifact_effect:
    ordinal: 5
    purpose: "Append a governed state transition or create an attributable artifact. Read-only interaction produces a source-linked projection rather than new truth."
    captures: "State transition tuple (from -> to), immutable appended records, generated artifacts."
    required_fields:
      - expected_state
      - artifacts

  IS6_evidence_inspection:
    ordinal: 6
    purpose: "Expose records, hashes, provenance, freshness, assurance, missing conditions, and disclosure limits. Process exit and narration are evidence inputs, not acceptance."
    captures: "Attributable records, hashes, cryptographic receipts, criteria-to-observation pairings."
    required_fields:
      - required_evidence
      - evidence_classes

  IS7_settlement_or_decision:
    ordinal: 7
    purpose: "Evaluate the declared completion rule or reach an explicit allow, deny, escalate, approve, reject, park, quarantine, adopt, or other governed decision. Settlement remains separate from execution termination."
    captures: "Evaluation against completion condition, independent settlement judgment."
    required_fields:
      - criterion
      - settlement_evaluator

  IS8_next_affordance_selection:
    ordinal: 8
    purpose: "Offer only actions that are simultaneously visible, reachable, permitted, and settleable in the new context, or end at an explicit terminal condition."
    captures: "Derivation of current spendable affordances based on current state, authority, and settlement."
    required_fields:
      - current_affordances
      - blocked_affordances

affordance_gates:
  definition: "A named action is available only when all seven gates hold simultaneously: visible, reachable, authorized, payable, executable, recoverable, settleable."
  gates:
    - visible
    - reachable
    - authorized
    - payable
    - executable
    - recoverable
    - settleable

blocked_reasons:
  - missing_precondition
  - unauthorized
  - unpayable
  - missing_capability
  - unrecoverable
  - no_settlement_access
  - policy_prohibited

operation_classes:
  epistemic:
    definition: "Improves representation or reduces uncertainty without altering authoritative case state."
    flow: "case -> inquiry -> evidence -> changed representation -> changed affordance field"
  consequential:
    definition: "Alters authoritative case or world state through governed commitment and execution."
    flow: "represented possibility -> commitment -> governed execution -> observed consequence -> evidence -> settlement"

interaction_kinds:
  - single_choice
  - multi_choice
  - entity_resolution
  - open_input
  - commitment
  - validation
  - execution
  - observation
  - evidence_review
  - settlement
  - navigation
  - cancel

evidence_classes:
  - declared
  - observed
  - inferred
  - proposed
  - unknown
