schema: agent.spec
schema_version: "1.0"

metadata:
  id: casework.live-cursor-v4
  title: GodSpeed Casework Live Cursor V4
  status: approved
  version: "0.1.0"
  created: "2026-10-08"
  revised: "2026-10-09"
  owner: GodSpeed casework
  normative_language: RFC 2119
  purpose: >-
    Specify the bounded, restart-safe live and historical case projection
    boundary for GodSpeed Casework V4. This supplement refines the parent
    cognitive-environment specification only for live cursor, capture identity,
    bootstrap, recovery, Store/SSE, and their readiness evidence.
  approval_record:
    path: .agents/evidence/casework-live-wiring/T09/resume-2026-09-30/c2-six-recommendations-operator-approval-oct08.md
    scope: six recommendation-level architecture and public-contract areas approved
    exact_candidate_hash_read_or_approved: false
    implementation_status: held
  additional_policy_approval:
    path: .agents/evidence/casework-live-wiring/T09/resume-2026-09-30/c2-bounded-reader-additional-policy-operator-approval-oct08.md
    scope: four bounded-reader policy decisions approved for normative incorporation
    exact_candidate_hash_read_or_approved: false
    implementation_status: held
  candidate_basis:
    path: .agents/evidence/casework-live-wiring/T09/resume-2026-09-30/live-cursor-v4-complete-candidate-revision7-oct08.md
    sha256: ad82478fbe008358841b3be2ff0e29139f0327f1dd7cbbcbaf798a2795bd09b6
    independent_design_review: .agents/evidence/casework-live-wiring/T09/resume-2026-09-30/live-cursor-v4-complete-candidate-revision7-independent-review-oct08.md
    design_review_result: approved_design_proposal_only
