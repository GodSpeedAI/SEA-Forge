  whole_loop_acceptance:

    canonical_golden_scenario:
      requirement: >
        One deterministic work request traverses every required canonical edge
        without semantic shims standing in for absent production integrations.

      required_observations:
        - one_work_request_id_end_to_end
        - one_resolvable_domain_model_identity_end_to_end
        - cited_context
        - explicit_authority_decision
        - observed_real_execution
        - operational_settlement
        - independent_proof_result
        - expected_vs_observed_realitytrace_record
        - provisional_developmental_evidence
        - explicit_developmental_settlement_decision
        - durable_developmental_memory
        - changed_next_navigation_state

      prohibited_shortcuts:
        - synthetic_EvidenceRecorded_inserted_only_by_test
        - direct_capability_promotion_from_proof
        - direct_capability_promotion_from_operational_settlement
        - mock_replacing_the_boundary_currently_under_test
        - fallback_domain_hash
        - undocumented_manual_state_edit
        - gen1_reference_path_substituted_for_production_path

    variation_requirement:
      statement: >
        Whole-loop success once proves integration, not capability. After the
        canonical golden scenario settles, repeat under declared variation before
        promoting any claim of durable system capability.

      minimum_variation_classes:
        - success
        - authority_denial_or_escalation
        - proof_failure
        - execution_failure_or_timeout
        - interruption_and_recovery
        - duplicate_or_replayed_event
        - semantically_invalid_or_wrong_domain_identity

  completion_criteria:
    all_required: true

    criteria:
      - all_P0_edges_CONFIRMED
      - all_P1_edges_CONFIRMED
      - all_P0_invariants_CONFIRMED
      - all_P1_invariants_CONFIRMED
      - canonical_golden_scenario_passes_without_test_only_semantic_bridge
      - required_variation_scenarios_pass
      - no_open_P0_or_P1_counterexample
      - current_state_delta_is_empty_for_frozen_scope

    final_verdicts:
      CONFIRM: >
        Frozen canonical runtime is implemented and has survived its required
        integration, end-to-end, variation, provenance, recovery, and adversarial
        evidence.

      NOT_CONFIRM: >
        One or more frozen P0/P1 edges, invariants, or whole-loop criteria remain
        absent, partial, contradicted, unknown, or falsified.

  change_control:
    freeze_rule: >
      After preregistration, implementation work MUST NOT modify this target merely
      because current code differs from it.

    legitimate_revision_requires:
      - explicit_human_authorization
      - stated_reason
      - semantic_diff
      - affected_edges_and_invariants
      - migration_effect
      - new_preregistration_version

    implementation_disagreement_rule: >
      If implementation evidence suggests the frozen model is wrong, stop and
      report the contradiction. Do not silently adapt the target to make the run pass.