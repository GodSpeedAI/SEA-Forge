catalog: sea-forge-workbench-api
status: target-unmapped
protocol: sea-forge.workbench
protocol_version: 1.0-draft
generated_at: '2026-07-24'
notes:
- Method names and semantic boundaries are target contracts.
- A repository-grounding pass must map, merge, rename, or reject methods against existing server types and request
  enums.
- No method may weaken authority, disclosure-before-retrieval, settlement, evidence, or ledger invariants.
