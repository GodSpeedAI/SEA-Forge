# =============================================================================
# AGENT-FACING NORMATIVE SPECIFICATION: WORKBENCH FRONTEND REMEDIATION
# =============================================================================
# Standard: AGENT_SPEC_TEMPLATE.yaml v1.0
# Target: SEA Forge Workbench Desktop Frontend (`workbench/apps/desktop`)
# Purpose: Inform fixing the delta between intended design and implementation.
# =============================================================================

schema: agent.spec
schema_version: "1.0"

metadata:
  id: "spec-workbench-frontend-remediation"
  title: "SEA Forge Workbench Frontend Delta Remediation Specification"
  status: "approved"
  version: "0.2.0"
  created: "2026-09-04"
  revised: "2026-09-04"
  revision_note: >-
    v0.2.0 corrects requirements that were unimplementable or self-contradictory against the
    verified repository state: the design-token contrast remedy (the token sheet is a gated
    byte-copy of the design-system source), the journey-ribbon step vocabulary (live route
    steps and canonical lifecycle steps are disjoint), the case-horizon retry affordance
    (no kernel method and no `cancelled` execution standing exist), the delegation dispatch
    payload (the server refuses a `Delegate` without `request_id`), and three states that had
    been collapsed to a false negative (unknown active work, unverifiable separation of duty,
    and failed preflight).
  scope: >-
    SEA Forge Workbench desktop frontend (Tauri 2 + React 19 + TypeScript + Astryx/SEA Forge Design System)
    located under `workbench/apps/desktop/` and UI packages under `workbench/packages/`.
  purpose: >-
    Define the normative behavioral, functional, visual, and architectural requirements to remediate
    the confirmed deltas identified in the Frontend Audit (`.agents/reports/frontend-audit-workbench-2026-09-04.md`),
    enabling an operator to actively author cases, dispatch agent delegations, decide approvals safely,
    search navigable entities via keyboard, and observe accurate cell state.
  owner: "SEA Forge Frontend Architecture Team"

  normative_language: "RFC 2119"
  normative_keywords:
    - MUST
    - MUST_NOT
    - REQUIRED
    - SHOULD
    - SHOULD_NOT
    - RECOMMENDED
    - MAY
    - OPTIONAL
  implementation_defined_meaning: >-
    Behavior is part of the implementation contract but this specification does not prescribe one
    universal mechanism. The implementation MUST document the selected behavior and prove conformance
    to the surrounding requirements.

# -----------------------------------------------------------------------------
# SOURCE CONTEXT
# -----------------------------------------------------------------------------
sources:
  primary_brief:
    role: "Normative audit report establishing ground truth and confirmed defects"
    expected_path: ".agents/reports/frontend-audit-workbench-2026-09-04.md"

  evidence_source:
    role: "Visual and interaction grammar, density rules, color tokens, and state vocabularies"
    path: ".agents/specs/frontend/DESIGN.md"

  wireframe_spec:
    role: "Screen-level wireframes, user journeys P1–P35, and primary interaction flows"
    path: ".agents/specs/frontend/sea-forge-primary-path-screen-wireframe-interaction-spec-v0.1.md"

  ux_epic:
    role: "16 journey areas with 128 durable user stories"
    path: ".agents/specs/frontend/sea-forge-governed-workbench-ux-epic-v0.1.md"

  component_contract:
    role: "Layering boundaries, state ownership, component interfaces, and test requirements"
    path: ".agents/specs/frontend/sea-forge-workbench-frontend-architecture-component-contract-v0.1.md"

  existing_implementation:
    role: "Active implementation code to remediate"
    location: "workbench/apps/desktop/"

  verified_ground_truth:
    role: >-
      Facts re-read from the repository on 2026-09-04 and treated as authoritative over any
      narrative in the audit report. Requirements below are written against these, not against
      recollection.
    facts:
      - "`workbench/packages/sea-forge-ui-tokens/sea-forge.tokens.css` is a byte-for-byte copy-projection of `.agents/specs/frontend/colors_and_type.css`; `packages/sea-forge-ui-tokens/scripts/check-drift.mjs` fails `just workbench-contracts-gate` on any divergence, and `workbench/AGENTS.md` forbids hand-editing it."
      - "Measured contrast of `--fg-tertiary` (#64748B): 3.93:1 on `--surface-workspace` (#0B1220), 3.73:1 on `--surface-panel` (#111827), 3.08:1 on `--surface-panel-elevated` (#1F2937). DESIGN.md's note misprints `--surface-panel` as #0B1220; the token values themselves are correct."
      - "`ReadinessView[\"overall\"]` already admits `\"stale\"`, and `ReadinessPage.overallLabel` already returns `\"Readiness stale\"`. Only `overallVariant` collapses it."
      - "`CaseCreationWorkbench` already renders `\"Re-run preflight\"` on stale and already gates commit on `state === \"preflight_ok\"`. Only the status-pill ternary is wrong."
      - "`AppShell` already computes a three-state `inboxCount` and passes it to `GlobalHeader`; only the `Sidebar` pass-through is missing."
      - "`AppShell.tsx` already installs a window `keydown` handler that guards INPUT/TEXTAREA/contentEditable and binds `/` to focusing `#searchButton`. It must be modified, not duplicated."
      - "`ApprovalGovernanceContext.requester` is `authority_decision.identity_binding.principal` — byte-identical to the value `sea-forge-server::identity::approval_submitter` compares against when it refuses `IdentityRefusal::SelfApproval`. The UI predicate therefore mirrors the kernel predicate exactly."
      - "`ApprovalGovernanceContext.eligible_actors` is always empty (`sfwp/approvals.rs:197`, asserted by `conformance_case_episode.rs:583`). It MUST NOT be used to gate the Approve button."
      - "`SfwpCommand::Delegate` takes `endpoint`, `instruction`, `max_turns` (required), and optional `run_id`, `model`, `token_budget`, `policy`, `entity`, `process`, `request_id`. `requires_durable_locator` includes `Request::Delegate`, so a dispatch without a non-empty `request_id` is refused with `durable_locator_required` and no side effect."
      - "`ExecutionStanding` is `pending | enabled | active | completed | failed | terminated`. There is no `cancelled`."
      - "`/cases/new` declares no `validateSearch`, so typed search parameters cannot be passed to it."
      - "Live `journeyStep` values are `Readiness, Thoth, Assets, Domain, Cases, Inbox, Operations`; `JourneyRibbon.GOVERNED_STEPS` are `Authority, Domain, Draft, Preflight, Execution, Evidence, Settlement`. Only `Domain` is common to both."
      - "Baseline suite measured 2026-09-04: 22 desktop files / 152 tests, 1 ui-components file / 17 tests — 169 total, all passing."
      - "`workbench` root `test` script chains two packages, so `bun run test <Filter>` from `workbench/` applies the filter to the ui-components leg only. Per-suite filtering MUST run from `workbench/apps/desktop`."

# -----------------------------------------------------------------------------
# 0. SPEC FRAME
# -----------------------------------------------------------------------------
spec_frame:
  quality_gate_questions:
    - "What should be built?"
    - "What result should it produce?"
    - "How will we know the result is real?"
    - "What capability should become reliably available after repeated successful use?"
    - "What evidence proves the capability claim?"
    - "What fails safely?"
    - "What must repeat until reliable?"
    - "What changes when evidence disagrees with the design?"

  proof_loop:
    mermaid: |-
      flowchart LR
        Audit["Audit Report Deltas"] --> Spec["Remediation Spec (This File)"]
        Spec --> Impl["Targeted Code Changes"]
        Impl --> Gates["Static Checks (Contracts, Lint, Typecheck)"]
        Gates --> Tests["Vitest Test Suite (Desktop + UI)"]
        Tests --> Browser["Live Browser Probe (Dev Server + E2E)"]
        Browser -->|passes| Settle["Operational Desktop Workbench"]
        Browser -->|fails| Fix["Fix Delta"]
        Fix --> Impl

# -----------------------------------------------------------------------------
# 1. PROBLEM STATEMENT
# -----------------------------------------------------------------------------
problem_statement:
  system_name: "SEA Forge Workbench Desktop Frontend"

  problem_summary: >-
    The desktop workbench successfully negotiates SFWP wire contracts and renders core view layouts,
    but several critical functional bugs, blocking UI modals, read-only dead-ends, and spec deviations
    prevent operators from actively driving governed cases, managing delegations, and trusting UI status.
    Specifically: clicking search halts the browser with `alert()`; preflight stale states show false green;
    the inbox badge is hardcoded to 1; delegation contracts cannot be dispatched into execution;
    case plan items cannot be inspected or retried; and approvals lack separation-of-duty protection.

  job_to_be_done:
    actor: "Local Developer / Governed System Operator"
    trigger: "Opening the SEA Forge desktop GUI to inspect cell state, author cases, and manage runs"
    job: "Navigate smoothly via keyboard/search, author cases with reliable preflight feedback, dispatch agent delegations, and approve operations safely without browser halts or false indicators"
    outcome: "A fully operational, evidence-accurate, non-blocking desktop client interface"

  current_failure_modes:
    - "AppShell: search button invokes native `alert()`, freezing the browser window until dismissed."
    - "CaseCreationWorkbench: stale preflight state is shadowed by `preflight?.ok`, displaying false-green 'Preflight passed' instead of 'Rejected as stale'."
    - "Sidebar: inbox badge is hardcoded to `1`, deceiving the operator about pending approval work even when queue is empty."
    - "ApprovalInboxPage: requester can approve their own request in the UI, violating separation of duty."
    - "DelegationWorkbench: provides only read-only contract preview, with no dispatch button to initiate execution."
    - "CaseHorizonPage: plan items are static labels and links; operators cannot inspect proof in drawer or trigger retries."
    - "ReadinessPage: 'stale' readiness state is collapsed into 'degraded' by `overallVariant`, losing the distinct temporal invalidation signal."
    - "GlobalHeader: active work pill is hardcoded to static text 'None running' — asserting zero on a cell whose runs were never read — and context chips are dead buttons."
    - "JourneyRibbon: renders the current step and then the whole canonical list, so the step appears twice and no step is marked complete."
    - "CaseCreationWorkbench: a failed preflight (`preflight.ok === false`) falls through to the label 'Not yet run', reporting a performed-and-refused check as an unperformed one."
    - "ApprovalInboxPage: when an approval has no resolvable `governance`, the requester is unknown, so a requester comparison silently passes and Approve stays enabled — while the kernel refuses with `separation_of_duty_unverifiable`. Unknown is being rendered as permitted."

  why_existing_approaches_fail: >-
    Previous implementation iterations focused on satisfying static JSON contract gates and basic page
    snapshots, leaving interaction handlers stubbed with `alert()`, hardcoding badge values, omitting
    precondition checks in the UI, and neglecting interactive command dispatch buttons.

  important_boundary:
    is: >-
      A targeted, non-destructive frontend remediation of `workbench/apps/desktop/` and `workbench/packages/`
      that preserves ports-and-adapters architecture, SFWP wire contracts, and fail-closed security.
    is_not: >-
      A rewrite of the frontend stack, an alteration of backend Rust crates (`crates/`), a fabrication of
      unbacked backend methods, or an introduction of speculative abstractions.
    successful_execution: >-
      The user can launch the desktop app, press `/` to open a command palette, author a case and observe
      accurate preflight stale transitions, dispatch an agent delegation to an active run, approve or reject
      pending actions with separation of duty enforced, and see accurate dynamic badges and active work counts.
    false_success_boundary: >-
      Passing unit tests by mocking away interactions or keeping buttons inert; displaying mock data on
      unbacked surfaces; claiming completion while `alert()` remains in codebase.

# -----------------------------------------------------------------------------
# 2. GOALS AND NON-GOALS
# -----------------------------------------------------------------------------
requirements:
  goals:
    - id: REQ-GOAL-001
      text: "Eliminate native `alert()` from `AppShell.tsx` and implement a fully functional, keyboard-accessible Command Palette modal."
    - id: REQ-GOAL-002
      text: "Fix preflight stale state shadowing in `CaseCreationWorkbench.tsx` so 'Rejected as stale' is displayed when state is stale."
    - id: REQ-GOAL-003
      text: "Bind Sidebar inbox badge dynamically to real pending approval count, hiding the badge when zero or loading."
    - id: REQ-GOAL-004
      text: "Enforce separation of duty in `ApprovalInboxPage.tsx` by disabling the Approve button when the actor is the requester."
    - id: REQ-GOAL-005
      text: "Implement active dispatch capability in `DelegationWorkbench.tsx` via `ProtectedActionButton` calling `sfwp_command` with verb `delegate`."
    - id: REQ-GOAL-006
      text: "Add item-level inspection in `EvidenceDrawer` and retry navigation in `CaseHorizonPage.tsx`."
    - id: REQ-GOAL-007
      text: "Add distinct 'stale' variant support to `GovernedStatusPill` and update `ReadinessPage.tsx` to preserve 'stale' readiness."
    - id: REQ-GOAL-008
      text: "Wire GlobalHeader active work indicator to live running operations and attach inspection handlers to header context chips."
    - id: REQ-GOAL-009
      text: "Update `JourneyRibbon.tsx` to visually reflect completed, active, and upcoming steps along the governed lifecycle."
    - id: REQ-GOAL-010
      text: >-
        Bring small essential metadata text to WCAG AA (4.5:1) by changing token *usage* in the
        desktop CSS modules — never by editing the gated token copy-projection.

  non_goals:
    - id: NONGOAL-001
      text: "Do NOT fabricate mock backend responses or invent client-side data for unbacked surfaces (`/models`, `/memory`, etc.)."
    - id: NONGOAL-002
      text: "Do NOT modify Rust kernel crates (`crates/sea-forge-core`, `crates/sea-forge-server`)."
    - id: NONGOAL-003
      text: "Do NOT replace the UI framework (React 19, Vite, TanStack Router, TanStack Query) or styling architecture (Vanilla CSS Modules)."
    - id: NONGOAL-004
      text: "Do NOT weaken or bypass any route guards or authority preconditions."
    - id: NONGOAL-005
      text: >-
        Do NOT hand-edit `workbench/packages/sea-forge-ui-tokens/sea-forge.tokens.css`, and do NOT
        change any token value in `.agents/specs/frontend/colors_and_type.css`. The first is a gated
        byte-copy of the second; changing either is a design-system authority decision outside this
        remediation (see `roadmap_boundaries.design_token_value_revision`).
    - id: NONGOAL-006
      text: >-
        Do NOT add case plan-item dispatch, park, cancel, or retry controls. No SFWP method backs
        them (`system.describe` publishes no such method), and a control that cannot reach the kernel
        would be a button that lies.

# -----------------------------------------------------------------------------
# 3. OUTCOME CONTRACT
# -----------------------------------------------------------------------------
outcome_contract:
  output_produced:
    primary_output: >-
      Updated frontend source files in `workbench/apps/desktop/src/` and `workbench/packages/`
      implementing the specified remediations with accompanying tests.

    requirements:
      - id: REQ-OUT-001
        text: "New component `workbench/apps/desktop/src/shell/CommandPalette.tsx` and module CSS."
      - id: REQ-OUT-002
        text: "Updated `AppShell.tsx`, `Sidebar.tsx`, `GlobalHeader.tsx`, `JourneyRibbon.tsx` in `workbench/apps/desktop/src/shell/`."
      - id: REQ-OUT-003
        text: "Updated `CaseCreationWorkbench.tsx`, `ApprovalInboxPage.tsx`, `ReadinessPage.tsx`, `DelegationWorkbench.tsx`, `CaseHorizonPage.tsx` in `workbench/apps/desktop/src/pages/`."
      - id: REQ-OUT-004
        text: "Updated `GovernedStatusPill.tsx` in `workbench/packages/sea-forge-ui-components/src/`."
      - id: REQ-OUT-005
        text: >-
          Updated CSS modules under `workbench/apps/desktop/src/` (and, where they carry the same
          defect, `workbench/packages/sea-forge-ui-components/src/`) that replace `var(--fg-tertiary)`
          with `var(--fg-secondary)` on essential text below 18px (below 14px bold). No token file is
          modified; `sea-forge.tokens.css` and `colors_and_type.css` remain byte-identical.

  outcome_verified:
    condition: >-
      All unit and component tests pass (`bun run test`), typechecking and linting pass (`bun run check`),
      contracts gate passes (`just workbench-contracts-gate`), and live browser verification confirms
      interactive behaviors without browser alerts or dead ends.

    signals:
      - id: REQ-VERIFY-001
        text: >-
          `grep -rn 'alert(' workbench/apps/desktop/src/` returns zero matches. Plain `grep`, not
          `git grep`: the palette is a newly created file and is untracked until committed, which
          `git grep` would not read.
      - id: REQ-VERIFY-002
        text: >-
          `cd workbench && bun run test` passes with no regression from the measured 2026-09-04
          baseline (152 desktop + 17 ui-components = 169), and every row of
          `validation_matrix.core_conformance` is covered by at least one new passing test.
          The total is derived from that coverage, not asserted as a fixed number.
      - id: REQ-VERIFY-003
        text: "Clicking search button or pressing `/` opens the CommandPalette dialog; pressing Escape closes it."
      - id: REQ-VERIFY-004
        text: "When a preflighted draft in CaseCreationWorkbench receives stale status, the pill renders 'Rejected as stale' (blocked)."
      - id: REQ-VERIFY-005
        text: "When approval requester equals active actor, the Approve button is disabled and displays separation of duty warning."

    false_completion_conditions:
      - "Replacing `alert()` with a `console.log()` instead of a functioning command palette."
      - "Inverting ternary in CaseCreationWorkbench but breaking the 'Preflight passed' display on successful runs."
      - "Hiding the inbox badge entirely instead of rendering dynamic counts when approvals exist."
      - "Disabling the Approve button globally rather than conditionally when requester matches actor."

  consumer_and_handoff:
    consumers:
      - "Governed system operator driving desktop workbench"
      - "Automated Playwright and E2E evaluation test runners"

    handoff_complete_when:
      - "`just workbench-contracts-gate` passes."
      - "`cd workbench && bun run check` passes with zero errors."
      - "`cd workbench && bun run test` passes."
      - "Live browser smoke test confirms search, delegation, approval, and case creation flows."

    unverified_state: "degraded"
    unverified_surface:
      - "CommandPalette keyboard shortcuts"
      - "Delegation dispatch confirmation"

# -----------------------------------------------------------------------------
# 4. CAPABILITY CLAIM
# -----------------------------------------------------------------------------
capability_claim:
  applicability: "operational_reliability_only"
  owner: "Operator driving SEA Forge desktop applications"

  delta: >-
    Operators transition from an inspect-only client with blocking alert modals and false-positive badges
    to an interactive, evidence-grounded desktop control center where actions, contracts, preflight states,
    and duty separations conform strictly to governed specifications.

  why_in_scope: >-
    Ensures the SEA Forge Workbench is genuinely usable for its intended mission control tasks.

  proven_only_if:
    - "The user can author, preflight, and commit a case with faithful stale detection."
    - "The user can configure and dispatch an agent delegation directly from the GUI."
    - "The user can navigate across all surfaces using keyboard command search (`/`)."
    - "The user cannot approve operations they authored as requester."

  not_proven_by:
    - "Static HTML inspection alone."
    - "Passing tests that mock out UI state transitions."

  learning_claim: >-
    Operational reliability only. No autonomous machine learning claim is made.

