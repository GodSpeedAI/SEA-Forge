      claim: "CommandPalette provides full keyboard-driven navigation across all desktop routes."
      level: "evidence_backed"
      required_evidence: "Component test in `CommandPalette.test.tsx` verifying arrow keys, search filtering, and Enter navigation."
      current_evidence: "Audit finding 4.1 confirmed alert() call in AppShell.tsx:140."
      gap: "Implementation of CommandPalette component and removal of alert()."

    - id: CLAIM-002
      claim: "CaseCreationWorkbench faithfully displays 'Rejected as stale' upon stale server response."
      level: "evidence_backed"
      required_evidence: "Unit test in `CaseCreationWorkbench.test.tsx` reproducing stale preflight state."
      current_evidence: "scripts/workbench-e2e-case-authoring.sh:31-34 notes ternary shadowing bug."
      gap: "Reordering conditional checks in CaseCreationWorkbench.tsx."

    - id: CLAIM-003
      claim: "ApprovalInboxPage strictly enforces separation of duty in UI."
      level: "evidence_backed"
      required_evidence: "Test in `ApprovalInboxPage.test.tsx` asserting disabled Approve button when actorId == requester."
      current_evidence: "ApprovalInboxPage.tsx:148 does not check requester identity."
      gap: "Adding identity vs requester comparison and notice markup."

    - id: CLAIM-004
      claim: "DelegationWorkbench can dispatch an agent run through Tauri bridge."
      level: "evidence_backed"
