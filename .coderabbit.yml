# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews and comments only. It does not block merges and never
# pushes commits (DomainForge #145: autofix bumped every package version).
reviews:
  request_changes_workflow: false
  fail_commit_status: false
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    unit_tests:
      enabled: false
    docstrings:
      enabled: false
    simplify:
      enabled: false
    resolve_merge_conflict:
      enabled: false
