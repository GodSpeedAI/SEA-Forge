name: ARM probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04-arm, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Facts
        run: |
          uname -m
          ldd --version | head -1
          cat /etc/os-release | grep PRETTY
          nproc
