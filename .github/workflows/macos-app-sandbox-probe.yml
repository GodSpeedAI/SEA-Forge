name: macos-app-sandbox-probe

on:
  push:
    branches:
      - ci/macos-app-sandbox-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: App Sandbox evidence probe
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record host facts
        run: |
          mkdir -p evidence
          {
            echo "sw_vers:"; sw_vers
            echo "uname -m: $(uname -m)"
            echo "csrutil status: $(csrutil status 2>&1 || true)"
            echo "clang: $(clang --version | head -1)"
          } | tee evidence/host.txt

      - name: Run probe
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/evidence
        run: bash probes/macos-app-sandbox/run.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app-sandbox-evidence
          path: evidence/
