name: OpenShell Windows build

# Builds the pinned upstream OpenShell release (the version DomainForge
# projections target) for Windows x64: gateway with the in-tree MXC compute
# driver, CLI, prover, and upstream's real-wxc-exec integration test binary.
# GitHub's Windows images lack MXC isolation sessions, so the binaries are
# exercised on a real Windows 11 host from this artifact; this job only builds
# and records digests. Nothing here is shipped in SEA-Forge releases.
on:
  push:
    branches: [ci/openshell-windows]
    paths: [.github/workflows/openshell-windows.yml]
  workflow_dispatch:
    inputs:
      ref:
        description: OpenShell tag to build
        default: v0.1.3

permissions:
  contents: read

jobs:
  build:
    name: openshell (windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      OPENSHELL_REF: ${{ inputs.ref || 'v0.1.3' }}
      CARGO_TERM_COLOR: never
      Z3_SYS_Z3_VERSION: "5.1.0"
    steps:
      - name: Checkout NVIDIA/OpenShell at the pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/OpenShell
          ref: ${{ env.OPENSHELL_REF }}
          # The CLI version string comes from git tags (openshell-core/build.rs).
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          experimental: true

      # OpenShell's cargo config names sccache as the rustc wrapper.
      - name: Install sccache (as upstream CI does)
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Install the repository's Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc

      - name: Build gateway and CLI (upstream script)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tasks/scripts/windows-msvc.ps1 build x86_64-pc-windows-msvc

      - name: Build prover and the real-wxc-exec test binary
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $env:LIBCLANG_PATH = "$vs\VC\Tools\Llvm\x64\bin"
          if (-not (Test-Path "$env:LIBCLANG_PATH\libclang.dll")) { $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin" }
          cargo build --release --target x86_64-pc-windows-msvc --bin openshell-prover --features openshell-prover/prebuilt-z3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --release --target x86_64-pc-windows-msvc -p openshell-driver-mxc --test wxc_exec_real --no-run --message-format=json | Out-File -Encoding utf8 test-build.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Stage artifact with digests
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force dist
          $rel = "target\x86_64-pc-windows-msvc\release"
          Copy-Item "$rel\openshell.exe","$rel\openshell-gateway.exe","$rel\openshell-prover.exe" $out
          Get-ChildItem $rel -Filter *.dll | Copy-Item -Destination $out
          $test = Get-Content test-build.json | ForEach-Object { try { $_ | ConvertFrom-Json } catch {} } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'wxc_exec_real' -and $_.executable } |
            Select-Object -First 1
          Copy-Item $test.executable "$out\wxc_exec_real.exe"
          Copy-Item crates\openshell-driver-mxc\examples\* $out -Recurse
          & "$out\openshell.exe" --version | Tee-Object "$out\VERSION.txt"
          git rev-parse HEAD | Out-File -Encoding ascii "$out\SOURCE_COMMIT.txt"
          $sums = Get-ChildItem $out -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" }
          $sums | Out-File -Encoding ascii "$out\SHA256SUMS"
          Get-Content "$out\SHA256SUMS"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openshell-windows-x64
          path: dist
