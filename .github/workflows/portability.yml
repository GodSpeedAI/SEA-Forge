name: Portability

# Native Windows build/test lane. macOS runs the full `just ci` sweep in
# ci.yml; this workflow covers the Windows MSVC target, which has no devbox.
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: verify (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustc -Vv

      - name: Workspace check (keep going, all errors)
        shell: bash
        run: cargo check --workspace --all-targets --locked --keep-going 2>&1 | tee check.log

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-check-log
          path: check.log

      - name: Control-plane unit tests (OS identity, pipes, jobs)
        shell: bash
        run: cargo test --locked -p sea-forge-os -p sea-forge-core -p sea-forge-changeset -p sea-forge-server --lib

      - name: Release binaries
        shell: bash
        run: cargo build --release --locked -p sea-forge-cli -p sea-forge-server

      - name: Upload Windows binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-binaries
          path: |
            target/release/sea-forge.exe
            target/release/sea-forge-server.exe
          if-no-files-found: error
