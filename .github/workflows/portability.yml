name: Portability

# Native Windows and macOS build/test lanes. The Linux sweep runs in ci.yml;
# this workflow covers the Windows MSVC target (no devbox) and the macOS App
# Sandbox jail (sea-forge-sandbox on a real macOS runner).
# Documentation-only changes skip it: it is not a required check, and a pull
# request is already covered by the pull_request trigger (so no feat/** push).
on:
  pull_request:
    paths-ignore:
      - '**/README.md'
      - '*.md'
      - '.agents/CURRENT_STATUS.*'
      - '.agents/reports/**'
      - '.agents/plans/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/README.md'
      - '*.md'
      - '.agents/CURRENT_STATUS.*'
      - '.agents/reports/**'
      - '.agents/plans/**'
  workflow_dispatch:
    inputs:
      field_case_guest_reset:
        description: Run the Field Case publication guest-reset proof on Linux/ext4
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: verify (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Link-creation prerequisites that are missing fail the test instead of
      # printing SKIPPED. The hosted runner is elevated, so symlinks must work.
      SEA_FORGE_REQUIRE_LINK_PRIVILEGE: "1"
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustc -Vv

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
          # Only main writes the cache; pull requests restore it read-only.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Workspace check (keep going, all errors)
        shell: bash
        run: cargo check --workspace --all-targets --locked --keep-going 2>&1 | tee check.log

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-check-log
          path: check.log

      - name: Control-plane unit tests (OS identity, pipes, jobs)
        shell: bash
        run: cargo test --locked -p sea-forge-os -p sea-forge-core -p sea-forge-changeset -p sea-forge-server --lib -- --nocapture

      - name: Release binaries
        shell: bash
        run: cargo build --release --locked -p sea-forge-cli -p sea-forge-server

      - name: Upload Windows binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-binaries
          path: |
            target/release/sea-forge.exe
            target/release/sea-forge-server.exe
          if-no-files-found: error

      - name: Changeset reparse-point and hard-link tests
        shell: bash
        run: cargo test --locked -p sea-forge-changeset --test changeset_windows -- --nocapture

      - name: Safe-write hard-link and junction tests
        shell: bash
        run: cargo test --locked -p sea-forge-sandbox --test safe_write_windows -- --nocapture

      - name: Local sandbox job-object tests
        shell: bash
        run: cargo test --locked -p sea-forge-sandbox --test windows_local_job -- --test-threads=1 --nocapture

      - name: Identity E2E (real OS identity, pipe DACL, squatting)
        shell: pwsh
        run: |
          $server = (Resolve-Path target/release/sea-forge-server.exe).Path
          & (Resolve-Path scripts/windows/identity-e2e.ps1).Path -ServerExe $server -Work 'C:\sfe2e'
          exit $LASTEXITCODE

      - name: Upload identity E2E log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-identity-e2e-log
          path: |
            C:\sfe2e\identity-e2e.log
            C:\sfe2e\*.log
          if-no-files-found: warn

  macos:
    name: verify (macos app sandbox jail)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustc -Vv

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-jail
          # Only main writes the cache; pull requests restore it read-only.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build sandbox binaries (incl. sea-forge-jail-launcher)
        shell: bash
        run: cargo build --locked -p sea-forge-sandbox --bins

      - name: App Sandbox jail escape tests
        shell: bash
        run: cargo test --locked -p sea-forge-sandbox --test macos_app_sandbox_jail -- --test-threads=1 --nocapture

      - name: Sandbox unit tests
        shell: bash
        run: cargo test --locked -p sea-forge-sandbox --lib

  field-case-guest-reset:
    name: Field Case guest reset (Linux/ext4)
    if: github.event_name == 'workflow_dispatch' && inputs.field_case_guest_reset
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install disposable guest prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            busybox-static cpio e2fsprogs linux-image-virtual qemu-system-x86 xz-utils zstd
          kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*-generic' | sort -V | tail -1)
          test -n "$kernel"
          sudo install -m 0644 "$kernel" "$RUNNER_TEMP/field-case-kernel"
          echo "GUEST_KERNEL_RELEASE=${kernel##*/vmlinuz-}" >> "$GITHUB_ENV"

      - name: Build staged-publication probe
        run: |
          rustup show active-toolchain || rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          cargo test --locked -p sea-forge-case-runner --lib --no-run --message-format=json > "$RUNNER_TEMP/probe-build.jsonl"
          probe=$(python3 -c 'import json, sys; paths = [row["executable"] for row in map(json.loads, sys.stdin) if row.get("reason") == "compiler-artifact" and row.get("executable") and row["target"]["name"] == "sea_forge_case_runner" and row["profile"]["test"]]; assert len(paths) == 1, paths; print(paths[0])' < "$RUNNER_TEMP/probe-build.jsonl")
          echo "FIELD_CASE_PROBE=$probe" >> "$GITHUB_ENV"

      - name: Reset and recover the guest at each publication boundary
        run: |
          python3 scripts/fde-case-crash-linux.py \
            --probe "$FIELD_CASE_PROBE" --kernel "$RUNNER_TEMP/field-case-kernel" \
            --kernel-release "$GUEST_KERNEL_RELEASE" --output "$RUNNER_TEMP/field-case-crash-evidence"

      - name: Upload guest serial logs and disk configuration
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: field-case-linux-guest-reset
          path: |
            ${{ runner.temp }}/field-case-crash-evidence/
            ${{ runner.temp }}/probe-build.jsonl
          if-no-files-found: warn
