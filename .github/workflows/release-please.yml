name: Release

# Tag/release/binary causal chain:
#
#   ordinary PR ──merge──▶ main ──▶ release-please UPDATES the standing release PR
#                                                       (no tag, no release)
#   maintainer merges release PR ──▶ main ──▶ release-please CUTS the tag,
#                                                       creates the GitHub Release,
#                                                       sets release_created=true,
#                                                       sets tag_name=vX.Y.Z
#                                  └─▶ release-binaries (same workflow) fires,
#                                                       checks out the tag,
#                                                       verifies version sync,
#                                                       builds the shipped binaries,
#                                                       attaches a tarball and
#                                                       SHA256SUMS to the release.
#
# Nothing triggers a merge by way of a tag. The tag is an EFFECT of the
# maintainer merging the standing release PR.
#
# SEA-Forge is not published to crates.io. Its releases ship binaries on the
# GitHub Release. To (re)attach binaries to an existing tag, run this workflow
# from the Actions UI (workflow_dispatch) with `tag` set, e.g. v0.2.0.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)attach binaries to, e.g. v0.2.0. Leave empty to run release-please only."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Release runs are NEVER cancelled — cancelling mid-upload could leave a
# release with partial assets. A new push to main updates the standing
# release PR instead, which does not interrupt an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # tag + release + commit version bump
      pull-requests: write  # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Prefer the RELEASE_PLEASE_TOKEN PAT: a release PR opened with it
          # triggers CI, so the required CI / gate check runs (F-009).
          # Fallback: the job's GITHUB_TOKEN (contents:write + pull-requests:write,
          # this repo only) when the secret is absent. GitHub creates the release
          # PR's pull_request runs in an approval-required state for a PR opened or
          # updated by GITHUB_TOKEN: a maintainer approves those runs (Actions tab)
          # so CI / gate and conventional-commit execute. See
          # docs/skills/release-management.md §7.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  release-binaries:
    name: release-binaries (GitHub Release)
    needs: [release-please]
    # Fires when release-please created a release in THIS run, or when a
    # maintainer dispatches this workflow with `tag` to (re)attach binaries to
    # an existing release. Output verified at action SHA 5c625bfb (v4.4.1) README "Root component outputs".
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tag != '') ||
      needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # gh release upload
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
          # The build runs dependency build scripts: keep the write credential out of it.
          persist-credentials: false

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true

      - name: Setup pinned toolchain
        run: devbox run -- just setup

      - name: release-check (manifest versions vs tag)
        # Verify the tag matches the workspace version before shipping binaries.
        # release-check strips the "v" from the tag.
        run: devbox run -- just release-check "$RELEASE_TAG"

      - name: Build release binaries
        # Only the product entry points ship: the `sea-forge` CLI (crates/sea-forge-cli)
        # and the `sea-forge-server` daemon. Sandbox helper binaries are not shipped.
        run: devbox run -- cargo build --release --locked -p sea-forge-cli -p sea-forge-server

      - name: Package tarball and SHA256SUMS
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          stage="sea-forge-${version}-x86_64-unknown-linux-gnu"
          archive="${stage}.tar.gz"
          rm -rf dist
          mkdir -p "dist/${stage}"
          cp target/release/sea-forge target/release/sea-forge-server LICENSE "dist/${stage}/"
          tar -C dist -czf "dist/${archive}" "${stage}"
          (cd dist && sha256sum "${archive}" > SHA256SUMS && sha256sum -c SHA256SUMS)
          tar -tzf "dist/${archive}"

      - name: Attach binaries to the GitHub Release
        # The write token is scoped to this step only.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="sea-forge-${version}-x86_64-unknown-linux-gnu.tar.gz"
          gh release upload "$RELEASE_TAG" "dist/${archive}" dist/SHA256SUMS \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Binary attach failure report
        if: failure()
        run: |
          echo "::error::Binaries not attached for tag ${RELEASE_TAG}."
          echo "If the upload step failed while replacing existing assets, the release may lack the tarball or carry a SHA256SUMS that does not match it."
          echo "Recovery: rerun this workflow from the Actions UI (workflow_dispatch) with tag=${RELEASE_TAG}; a successful rerun re-uploads both assets."
