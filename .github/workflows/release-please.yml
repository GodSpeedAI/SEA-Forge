name: Release

# Tag/release/binary causal chain:
#
#   ordinary PR ──merge──▶ main ──▶ release-please UPDATES the standing release PR
#                                                       (no tag, no release)
#   maintainer merges release PR ──▶ main ──▶ release-please CUTS the tag,
#                                                       creates the GitHub Release,
#                                                       sets release_created=true,
#                                                       sets tag_name=vX.Y.Z
#                                  └─▶ release-binaries (same workflow) fires,
#                                                       calls package.yml: builds the
#                                                       deb/tarball, macOS pkg/dmg and
#                                                       Windows setup.exe/zip on their own
#                                                       runners and install-tests each one.
#                                  └─▶ publish-release (after every package passes)
#                                                       writes SHA256SUMS, attests
#                                                       provenance, attaches all assets.
#
# Nothing triggers a merge by way of a tag. The tag is an EFFECT of the
# maintainer merging the standing release PR.
#
# SEA-Forge is not published to crates.io. Its releases ship binaries on the
# GitHub Release. To (re)attach binaries to an existing tag, run this workflow
# from the Actions UI (workflow_dispatch) with `tag` set, e.g. v0.2.0.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)attach binaries to, e.g. v0.2.0. Leave empty to run release-please only."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Release runs are NEVER cancelled — cancelling mid-upload could leave a
# release with partial assets. A new push to main updates the standing
# release PR instead, which does not interrupt an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # tag + release + commit version bump
      pull-requests: write  # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Prefer the RELEASE_PLEASE_TOKEN PAT: a release PR opened with it
          # triggers CI, so the required CI / gate check runs (F-009).
          # Fallback: the job's GITHUB_TOKEN (contents:write + pull-requests:write,
          # this repo only) when the secret is absent. GitHub creates the release
          # PR's pull_request runs in an approval-required state for a PR opened or
          # updated by GITHUB_TOKEN: a maintainer approves those runs (Actions tab)
          # so CI / gate and conventional-commit execute. See
          # docs/skills/release-management.md §7.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  release-binaries:
    name: release-binaries (build and install-test packages)
    # Reusable workflow: builds every package on its own runner and install-tests it there.
    # Runs when release-please created a release in THIS run, or when a maintainer dispatches
    # this workflow with `tag` to (re)attach binaries to an existing release.
    needs: [release-please]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tag != '') ||
      needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      upload: true
    permissions:
      contents: read       # the reusable workflow only reads; publishing happens below

  publish-release:
    name: release-binaries (GitHub Release)
    needs: [release-please, release-binaries]
    # Publish only when every package was built and install-tested.
    if: needs.release-binaries.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write      # gh release upload
      id-token: write      # Sigstore signing of the provenance attestation
      attestations: write  # store the attestation on the repository
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
          # Keep the write credential out of the checkout.
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Every package was built from the release tag
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse HEAD)"
          for os in linux macos windows; do
            built="$(cat "dist/built-from-${os}.txt")"
            test "$built" = "$tag_commit" || { echo "::error::${os} packages built from ${built}, tag ${RELEASE_TAG} is ${tag_commit}"; exit 1; }
            rm "dist/built-from-${os}.txt"
          done

      - name: SHA256SUMS over every asset
        run: |
          set -euo pipefail
          cd dist
          ls -l
          version="${RELEASE_TAG#v}"
          # Every package family must be present for this version (macOS may be universal or arm64).
          for pattern in "sea-forge_${version}_amd64.deb" "sea-forge-${version}-x86_64-unknown-linux-gnu.tar.gz" \
                         "sea-forge-${version}-macos-*.pkg" "sea-forge-${version}-macos-*.dmg" \
                         "sea-forge-${version}-x86_64-pc-windows-msvc-setup.exe" "sea-forge-${version}-x86_64-pc-windows-msvc.zip"; do
            found=$(compgen -G "$pattern" | wc -l)
            test "$found" -ge 1 || { echo "::error::missing asset matching ${pattern}"; exit 1; }
          done
          sha256sum $(ls | grep -v '^SHA256SUMS$') > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Compare the built commit with the run commit
        # Provenance names the run's commit (GITHUB_SHA). A dispatch from main that re-attaches an
        # older tag builds the tag's commit instead, so its provenance would name the wrong source.
        id: source
        run: |
          set -euo pipefail
          built="$(git rev-parse HEAD)"
          if [ "$built" = "$GITHUB_SHA" ]; then
            echo "attest=true" >> "$GITHUB_OUTPUT"
          else
            echo "attest=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Built ${built} for ${RELEASE_TAG} but this run is for ${GITHUB_SHA}; no provenance attestation is attached (it would name the wrong commit)."
          fi

      - name: Attest build provenance
        # Signed SLSA provenance (Sigstore, keyless) binding every asset digest to this workflow
        # and to the commit it was built from (equal to the run commit, checked above).
        if: steps.source.outputs.attest == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attach packages to the GitHub Release
        # The write token is scoped to this step only.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Binary attach failure report
        if: failure()
        run: |
          echo "::error::Binaries not attached for tag ${RELEASE_TAG}."
          echo "If the upload step failed while replacing existing assets, the release may lack some packages or carry a SHA256SUMS that does not match them."
          echo "Recovery: rerun this workflow from the Actions UI (workflow_dispatch) with tag=${RELEASE_TAG}; a successful rerun re-uploads every asset."
