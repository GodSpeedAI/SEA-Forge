name: Security

# Advisory-only security workflow. Findings here are NOT a required input to
# the CI gate (per CI/CD directive Phase 7). They surface on every PR and on
# a weekly schedule. Blocking enforcement is owned by `just security`
# (cargo-deny advisories + gitleaks) inside the CI gate, not by this workflow.
#
# Coverage:
#   - dependency-review on PRs that change Cargo.lock or lockfiles in the
#     github-actions ecosystem. Requires the GitHub dependency graph, which
#     is enabled by Dependabot (.github/dependabot.yml).
#   - cargo-deny advisories on a weekly schedule. This is the network-bound
#     half of `just security`; running it on a timer keeps PR-time CI offline.
#
# What is intentionally NOT here:
#   - CodeQL: Rust coverage is limited and would duplicate `cargo clippy
#     -D warnings`. Skipped by design; see docs/ci-cd-architecture.md.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'  # weekly, Monday 04:17 UTC (off-peak)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Advisory: comment-only. Fail only on severe (critical) advisories
          # so routine low-severity findings do not block PRs; the weekly
          # cargo-deny job below is the authoritative tracker.
          fail-on-severity: critical

  cargo-deny-advisories:
    name: cargo-deny advisories (weekly)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true

      - name: Setup pinned toolchain
        run: devbox run -- just setup

      - name: cargo deny check advisories
        # Pulls the RustSec advisory database. This is the network-bound half
        # of `just security`; PR-time CI deliberately stays offline.
        run: devbox run -- cargo deny check advisories
