# Gitleaks configuration for SEA Forge.
#
# Extends the default gitleaks ruleset with allowlists for reviewed false
# positives. Each is scoped as narrowly as the scan mode allows: by commit
# AND path for history, by rule AND path AND exact value where a shallow CI
# checkout rescans the same bytes under a new commit. A path-only allowlist
# admits any new secret staged at that path, which
# scripts/security/staged-secret-canaries.sh checks. Source-tree test
# fixtures carry inline `// gitleaks:allow` comments instead.
title = "SEA Forge"

[extend]
useDefault = true

# The former path-only allowlist for `.entire/metadata/` and numbered
# transcript directories was removed in round 3 (2026-10-18): a history scan
# without it reports no finding at those paths, and it silently admitted any
# NEW secret staged there (staged-secret-canaries.sh).

# T17 gate-remediation additions (2026-09-18): commits that predate the
# request-admission/redaction hardening contain simulated credentials in test
# fixtures and the transcript-redaction sentinel corpus. All are fake values
# asserted against by tests (e.g. `sk-live-…` is a synthetic token in a
# delegation test; SECRET_SENTINELS exists precisely so transcripts are
# redacted against a canonical fake-key corpus). Verified not real during the
# bounded-judgment T17 gate remediation; commit-scoped so any NEW occurrence
# in these paths still fails.
#
# Round 3 (2026-10-18): without `condition = "AND"` gitleaks matched commit OR
# path, so any new secret in these files passed. It is now AND-scoped. The
# casework merge bd661c9 re-introduced four of the same fixture values and is
# listed for that reason; current-tree identifiers are covered below by value.
[[allowlists]]
description = "test fixtures and redaction sentinels with simulated credentials"
condition = "AND"
targetRules = ["generic-api-key", "private-key"]
commits = [
  "bd661c909d579e80e2ed7ee3cc18012535f50b4a",
  "c371fc1733d9b27f24331fd9ba83128c42b6c15c",
  "4bda7946fc7bdf5e93aa89fe0594ddde154380a6",
  "87e475b22fc6921fd7b39d791277d9401ef59b1a",
]
paths = [
  '''crates/sea-forge-server/tests/fixtures/t04_governed_work_request\.json''',
  '''crates/sea-forge-server/tests/convergence_t11_whole_loop\.rs''',
  '''crates/sea-forge-server/tests/convergence_t12_variation\.rs''',
  '''crates/sea-forge-agent/src/delegation\.rs''',
  '''crates/sea-forge-server/tests/conformance_m16\.rs''',
  '''crates/sea-forge-ledger/src/types\.rs''',
  '''crates/sea-forge-ledger/tests/conformance_m0_ledger\.rs''',
]

# Idempotency identifiers in current test fixtures (not credentials). Scoped
# by value so a shallow CI checkout, which scans them under a new commit,
# still passes while any other value in these files fails.
[[allowlists]]
description = "idempotency identifiers in convergence and T04 fixtures"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^crates/sea-forge-server/tests/fixtures/t04_governed_work_request\.json$''',
  '''^crates/sea-forge-server/tests/convergence_t11_whole_loop\.rs$''',
  '''^crates/sea-forge-server/tests/convergence_t12_variation\.rs$''',
]
regexes = [
  '''^late-for-inv1-key$''',
  '''^late-for-inv1$''',
  '''^d4f6ee099ca7183729e183407f39484496384c83b6a2525a5f38a21adf80e8fb$''',
  '''^8483dcae69d6668a6164801fe06a904538f62ef524d509247c799e32347feec6$''',
]

# --- casework-environment plan, T00 remediation (operator-approved 2026-09-19) --------------
# `just security` reported 14 `generic-api-key` findings at revision 6ce518f. They are
# identifier-class matches introduced by the sibling Godspeed bounded-judgment plan's committed
# evidence, not by this plan. Five independent adversarial verification rounds
# (.agents/evidence/godspeed-casework-cognitive-environment/T00/T00-verification-round-{1..5}-NOT_CONFIRM.md)
# reviewed them; the corrected re-measurement reads the real bytes at the recorded column offsets
# and prints no matched value: the matched field is named `key` (observation records) or
# `idempotency_key` (gate logs), and each value is 13-16 characters of lower-case alnum with
# hyphens, all containing digits (entropy 3.55-3.75) - the shape of a record/idempotency
# identifier, not of credential material. The records themselves are immutable evidence
# (.agents/AGENTS.md), so they cannot be rewritten to remove the match.
#
# Deliberately narrow, following the commit-scoped precedent above: condition = AND so the
# allowlist requires the commit AND the path AND the rule to all match. Any NEW occurrence in
# these paths - or any occurrence elsewhere - still fails the gate.
# The second commit is the same-parent sibling carrying the same 14 byte-identical historical
# evidence lines at these paths and line numbers; add its identity without broadening any scope.
[[allowlists]]
description = "casework T00: identifier-class generic-api-key matches in the bounded-judgment plan's evidence at 6ce518f (operator-approved 2026-09-19; analysis in .agents/evidence/godspeed-casework-cognitive-environment/T00/gate-baseline-seafoerge.md)"
condition = "AND"
commits = ["6ce518fcd9b01bc5a7037f80f5d8986a33cd2924", "44b5a0b36399fffbd685de7d93bda1933ed75c96"]
targetRules = ["generic-api-key"]
paths = [
  '''^\.agents/evidence/godspeed-bounded-judgment/T18/observations\.jsonl$''',
  '''^\.agents/evidence/godspeed-bounded-judgment/T27/observations\.jsonl$''',
  '''^\.agents/evidence/godspeed-bounded-judgment/repeatability/observations\.jsonl$''',
  '''^\.agents/evidence/godspeed-bounded-judgment/T00/gate-SEA_CHECK-fmt-drift\.txt$''',
  '''^\.agents/evidence/godspeed-bounded-judgment/T00/gate-SEA_CHECK\.log$''',
  '''^\.agents/evidence/godspeed-bounded-judgment/T00/gate-SEA_CI\.log$''',
]

# T10/T12 live-ladder evidence (2026-10-11): retained browser traces and harness-cell snapshots.
# Verified by inspection: matches are `idempotency_key` values in throwaway harness-cell ledgers and
# UI snapshot field names (frame_token, embedding_token, navigation_token, navigation_api_key)
# captured in trace zips. HARs carry no cookie or authorization headers. No real credentials.
# Round 3: every finding these paths cover is generic-api-key (75 in
# history), so other rules (tokens, private keys) are no longer suppressed.
[[allowlists]]
description = "casework live-ladder run evidence (harness cells, trace zips)"
targetRules = ["generic-api-key"]
paths = [
  '''^\.agents/evidence/casework-live-wiring/T10/.*''',
  # T09 resume records that discuss gitleaks false positives. Matches are prose ("Unauthenticated, ..."),
  # source file names and a test file name; the commit-pinned .gitleaksignore fingerprints for them
  # cannot match in a shallow single-commit CI checkout.
  '''^\.agents/evidence/casework-live-wiring/T09/resume-2026-09-30/.*''',
]

# Historical evidence from the godspeed-bounded-judgment gauntlet (immutable by repository rule, so the
# files cannot be edited). Inspected 2026-10-04 and again 2026-10-05: the generic-api-key hits are test-fixture
# event-type strings and benchmark observation rows where "key" is a 16-hex row id and long tokens are answer
# labels; none is a credential. Commit-fingerprint entries in .gitleaksignore cannot cover these in CI, because a
# shallow pull-request checkout scans them under a new commit hash. Scoped to this one rule and directory.
[[allowlists]]
description = "benchmark and gate evidence under godspeed-bounded-judgment (verified false positives)"
targetRules = ["generic-api-key"]
paths = [
  '''^\.agents/evidence/godspeed-bounded-judgment/''',
]

