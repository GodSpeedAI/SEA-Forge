[workspace]
resolver = "2"
members = [
    "crates/sea-forge-core",
    "crates/sea-forge-cli",
    "crates/sea-forge-domain",
    "crates/sea-forge-authority",
    "crates/sea-forge-planner",
    "crates/sea-forge-sandbox",
    "crates/sea-forge-runtime",
    "crates/sea-forge-trace",
    "crates/sea-forge-evidence",
    "crates/sea-forge-settlement",
    "crates/sea-forge-capability",
    "crates/sea-forge-extension",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92.0"
license-file = "LICENSE"
repository = "https://github.com/GodSpeedAI/SEA-rs"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
wait-timeout = "0.2"
