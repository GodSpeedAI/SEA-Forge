[workspace]
resolver = "2"
members = [
    "crates/sea-forge-core",
    "crates/sea-forge-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sea-forge/sea-rs"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
