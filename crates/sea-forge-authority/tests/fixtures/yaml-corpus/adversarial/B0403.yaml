version: "0.1"
default: deny
allow_degraded: false
identity:
  source: local-slice-default
  allow_unresolved: false
policy_engines:
  - engine: opa
    fail_mode: closed
    required: false
integrity_ledger:
  min_witnesses: 1
rules:
  - name: allow-read
    verdict: allow
    actor_role: operator
    operation_kind: file_read
    path_prefix: /work
    argv0: sh
    requires_approval: false
  - name: deny-write
    verdict: deny
    actor_role: agent
    operation_kind: file_write
    boundary_constraints:
      network:
        - none
bomb:
  l0: &a0 [s, s, s, s, s, s, s, s]
  l1: &a1 [*a0, *a0, *a0, *a0, *a0, *a0, *a0, *a0]
  l2: &a2 [*a1, *a1, *a1, *a1, *a1, *a1, *a1, *a1]
  l3: &a3 [*a2, *a2, *a2, *a2, *a2, *a2, *a2, *a2]
  l4: &a4 [*a3, *a3, *a3, *a3, *a3, *a3, *a3, *a3]
  l5: &a5 [*a4, *a4, *a4, *a4, *a4, *a4, *a4, *a4]
  l6: &a6 [*a5, *a5, *a5, *a5, *a5, *a5, *a5, *a5]
  root: *a6
