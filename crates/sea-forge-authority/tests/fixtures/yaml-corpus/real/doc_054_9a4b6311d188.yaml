version: "0.1"
identity:
  source: test
  allow_unresolved: false
identity_bindings:
  - principal: operator_local
    actor_type: human
    role: operator
  - principal: security_officer
    actor_type: human
    role: R-SO
  - principal: unprivileged_operator
    actor_type: human
    role: operator
sod_rules:
  - name: write_requires_security_officer
    requester_role: operator
    approver_role: R-SO
    operation_kind: write_file
rules:
  - name: escalate-write
    verdict: escalate
    actor_role: operator
    operation_kind: write_file
    path_prefix: ""
  - name: allow-execute
    verdict: allow
    actor_role: operator
    operation_kind: execute_command
    argv0: sh
    sandbox_class: jail
  - name: resolve-approval
    verdict: allow
    actor_role: R-SO
    operation_kind: approval_resolution
