version: "0.1"
identity:
  source: test-binding
  allow_unresolved: false
rules:
  - name: allow-model-write
    verdict: allow
    actor_role: operator
    operation_kind: write_file
    path_prefix: ""
  - name: allow-self-validate
    verdict: allow
    actor_role: operator
    operation_kind: execute_command
    argv0: sea-forge
