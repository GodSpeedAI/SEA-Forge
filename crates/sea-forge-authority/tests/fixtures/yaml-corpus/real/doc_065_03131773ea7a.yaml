version: "0.1"
policy_surfaces:
  external_api:
    mode: deny-by-default
    allow_hosts: [127.0.0.1]
rules:
  - name: allow-agent-task
    verdict: allow
    actor_role: operator
    operation_kind: agent_task
  - name: allow-write
    verdict: allow
    actor_role: operator
    operation_kind: write_file
    path_prefix: ""
