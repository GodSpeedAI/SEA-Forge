version: "0.1"
policy_surfaces:
  external_api:
    mode: deny-by-default
    allow_hosts: [argv]
settlement_authorities:
  - authority_ref: swe_seed_test
    adapter: swe_seed
    command: ["{bin}", "internal-test-swe-seed"]
    timeout_secs: 10
    trust_anchor_ref: test-anchor
    declarer_actor_id: swe_seed_verifier
    permitted_declarer_roles: [R-AA]
    standing_basis: test-attested-verifier
    may_issue_strong: true
rules:
  - name: allow-agent-task
    verdict: allow
    actor_role: operator
    operation_kind: agent_task
  - name: allow-acp-permission
    verdict: allow
    actor_role: operator
    operation_kind: sandbox_execution
