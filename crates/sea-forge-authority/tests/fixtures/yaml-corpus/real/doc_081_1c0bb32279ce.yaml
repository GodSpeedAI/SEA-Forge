version: "0.1"
policy_surfaces:
  external_api:
    mode: deny-by-default
    allow_hosts: [argv]
rules:
  - name: allow-agent-task
    verdict: allow
    actor_role: operator
    operation_kind: agent_task
  - name: escalate-acp-permission
    verdict: escalate
    actor_role: operator
    operation_kind: sandbox_execution
    requires_approval: true
