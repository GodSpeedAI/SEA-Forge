version: "0.1"
policy_surfaces:
  external_api:
    mode: deny-by-default
    allow_hosts: [127.0.0.1]
rules:
  - name: allow-agent-task
    verdict: allow
    actor_role: operator
    operation_kind: agent_task
  - name: allow-command
    verdict: allow
    actor_role: operator
    operation_kind: execute_command
    argv0: sh
    sandbox_class: jail
