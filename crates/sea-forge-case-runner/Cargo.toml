[package]
publish = false
name = "sea-forge-case-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Synchronous lifecycle primitives for SEA Forge cases."

[dependencies]
sea-forge-core = { path = "../sea-forge-core", version = "0.5.0" }
sea-forge-planner = { path = "../sea-forge-planner", version = "0.5.0" }
sea-forge-ledger = { path = "../sea-forge-ledger", version = "0.5.0" }
sea-forge-authority = { path = "../sea-forge-authority", version = "0.5.0" }
sea-forge-sandbox = { path = "../sea-forge-sandbox", version = "0.5.0" }
sea-forge-runtime = { path = "../sea-forge-runtime", version = "0.5.0" }
sea-forge-settlement = { path = "../sea-forge-settlement", version = "0.5.0" }
sea-forge-spec-pipeline = { path = "../sea-forge-spec-pipeline", version = "0.5.0" }
sea-forge-changeset = { path = "../sea-forge-changeset", version = "0.5.0" }
sea-forge-evidence = { path = "../sea-forge-evidence", version = "0.5.0" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
jsonschema = { version = "0.58.6", default-features = false }

[dev-dependencies]
tempfile.workspace = true
proptest = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
inotify = { version = "0.11", default-features = false }

[lints]
workspace = true
