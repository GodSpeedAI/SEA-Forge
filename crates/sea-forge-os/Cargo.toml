[package]
publish = false
name = "sea-forge-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "SEA Forge OS bindings (Windows FFI): the only crate in the workspace that may contain unsafe code."

# F33 resolved: the async named-pipe constructor moved to the server edge
# (`sea-forge-server/src/pipe_edge.rs`); this crate exposes only the
# synchronous windows-sys primitives, so tokio never enters a kernel graph.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    # Wdk_* gates the ntdll declarations (NtCreateFile, NtSetInformationFile,
    # OBJECT_ATTRIBUTES) used for handle-anchored (RootDirectory-relative)
    # file creation and rename; no new crate is added.
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[lints]
workspace = true
