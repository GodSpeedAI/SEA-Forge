[package]
publish = false
name = "sea-forge-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "SEA Forge OS bindings (Windows FFI): the only crate in the workspace that may contain unsafe code."

[features]
# Tokio named-pipe server constructor, enabled only by sea-forge-server. Cargo
# unifies features per build, so in a Windows server build the kernel crates'
# copy of this crate also links tokio (their code never calls it). Open: review
# pass 3 F33; the fix is an edge-only adapter outside the kernel graph.
tokio-pipes = ["dep:tokio"]

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net"], optional = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
