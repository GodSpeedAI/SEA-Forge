[package]
name = "sea-forge-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SEA Forge concurrent case server (M3)."

[dependencies]
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
chrono.workspace = true
getrandom.workspace = true
sea-forge-agent = { path = "../sea-forge-agent", version = "0.1.0" }
sea-forge-authority = { path = "../sea-forge-authority", version = "0.1.0" }
sea-forge-case-runner = { path = "../sea-forge-case-runner", version = "0.1.0" }
sea-forge-core = { path = "../sea-forge-core", version = "0.1.0" }
sea-forge-extension = { path = "../sea-forge-extension", version = "0.1.0" }
sea-forge-ledger = { path = "../sea-forge-ledger", version = "0.1.0" }
sea-forge-self-model = { path = "../sea-forge-self-model", version = "0.1.0" }
sea-forge-settlement = { path = "../sea-forge-settlement", version = "0.1.0" }
sea-forge-planner = { path = "../sea-forge-planner", version = "0.1.0" }
sea-forge-runtime = { path = "../sea-forge-runtime", version = "0.1.0" }
sea-forge-sandbox = { path = "../sea-forge-sandbox", version = "0.1.0" }
sea-forge-thoth = { path = "../sea-forge-thoth", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "process", "sync", "time", "fs", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
