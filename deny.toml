# cargo-deny configuration (Shell-SPEC §10.3).
# Denies rejected licenses, yanked crates, known advisories, wildcard
# dependencies, and dependencies from unapproved sources.
#
# The RustSec advisory database is fetched at runtime; therefore
# `cargo deny check advisories` requires network access.
# The bans, licenses, and sources checks can run offline.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "LicenseRef-SEA-Forge",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]

confidence-threshold = 0.8

# Explicitly approved, exact-version exception.
#
# Dependency path:
# domainforge-core 0.13.0 -> xxhash-rust 0.8.16
#
# BSL-1.0 is the Boost Software License 1.0. This exception applies only
# to xxhash-rust 0.8.16; upgrading the crate requires another review.
exceptions = [
    {
        name = "xxhash-rust",
        version = "=0.8.16",
        allow = ["BSL-1.0"],
    },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
