# cargo-deny configuration (Shell-SPEC §10.3).
# Denies unmaintained/unmaintained-3 crates, rejected licenses, and known
# advisories. Rust advisories database is fetched at run time; `cargo deny
# check advisories` requires network. `bans`/`licenses`/`sources` are offline.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "LicenseRef-SEA-Forge",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

# SEA Forge uses a nonstandard source-available license. Bind the custom SPDX
# reference to the exact controlling text; cargo-deny rejects the clarification
# automatically if that file changes.
[[licenses.clarify]]
crate = "sea-forge-core"
expression = "LicenseRef-SEA-Forge"
license-files = [
    { path = "../../LICENSE", hash = 0x58d205c2 },
]

[[licenses.clarify]]
crate = "sea-forge-cli"
expression = "LicenseRef-SEA-Forge"
license-files = [
    { path = "../../LICENSE", hash = 0x58d205c2 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
