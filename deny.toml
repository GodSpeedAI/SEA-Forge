# cargo-deny configuration (Shell-SPEC §10.3).
# Denies rejected licenses, yanked crates, known advisories, wildcard
# dependencies, and dependencies from unapproved sources.
#
# The RustSec advisory database is fetched at runtime; therefore
# `cargo deny check advisories` requires network access.
# The bans, licenses, and sources checks can run offline.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "LicenseRef-SEA-Forge",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    # CDLA-Permissive-2.0: Community Data License Agreement Permissive 2.0.
    # Carried by webpki-roots (Mozilla root CA bundle), a transitive dep of
    # reqwest's rustls-tls feature approved for sea-forge-agent (M12). It is
    # a permissive license, not copyleft.
    "CDLA-Permissive-2.0",
]

confidence-threshold = 0.8

# Explicitly approved, exact-version exception.
#
# Dependency path:
# domainforge-core 0.15.0 -> xxhash-rust 0.8.18
#
# BSL-1.0 is the Boost Software License 1.0. This exception applies only
# to xxhash-rust 0.8.18; upgrading the crate requires another review.
# (Bumped from 0.8.16 in Task 3 of the Workbench plan: adding `schemars` to
# the workspace caused Cargo's unified resolver to bump this unrelated
# transitive dep's lockfile entry within its existing `^0.8` requirement.)
exceptions = [
    {
        name = "xxhash-rust",
        version = "=0.8.18",
        allow = ["BSL-1.0"],
    },
]

# SEA Forge uses a nonstandard source-available license. Bind the custom SPDX
# reference to the exact controlling text; cargo-deny rejects the clarification
# automatically if that file changes.
[[licenses.clarify]]
crate = "sea-forge-core"
expression = "LicenseRef-SEA-Forge"
license-files = [
    { path = "../../LICENSE", hash = 0x58d205c2 },
]

[[licenses.clarify]]
crate = "sea-forge-cli"
expression = "LicenseRef-SEA-Forge"
license-files = [
    { path = "../../LICENSE", hash = 0x58d205c2 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
