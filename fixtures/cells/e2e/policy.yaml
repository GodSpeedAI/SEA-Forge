# E2E cell authority policy (plan casework-live-wiring-production T03).
#
# Installed by `just casework-cell-init` as <cell>/authority/active-policy.json
# for the disposable E2E cell under .sea-forge/casework-live/ only. It grants
# the operator role exactly the operation kinds the E2E journeys need:
#
#   - write_file               the e2e-sentry-chain / e2e-signoff-gate
#                              templates' governed writes (their only
#                              operation kind)
#   - approval_resolution      resolving the approvals authority escalations
#                              open (approval.decide / approve / reject
#                              authorize against this same file)
#   - discretionary_task_add   case.add_item for CJ03's discretionary work
#                              (SEAM-1); the proposer is re-verified server-side
#   - case_reopen              case.reopen for the CJ07 lifecycle leg
#   - case_terminate           case.terminate for the CJ07 lifecycle leg
#   - human_task_completion    human_task.complete for the sign-off gate
#
# The four case-mutation kinds were missing when the cell was first seeded
# (T05 finding: every case.add_item / case.reopen / case.terminate /
# human_task.complete was refused with `input_error: authority decision does
# not grant this action`); they mirror the T04 integration tests' policy
# (crates/sea-forge-server/tests/sfwp_case_mutations.rs).
#
# Everything else stays denied by default. No rule here weakens any policy
# outside this temp cell.
version: "0.1"
identity_bindings:
  - principal: operator_local
    actor_type: human
    role: operator
rules:
  - name: allow-e2e-write-file
    verdict: allow
    actor_role: operator
    operation_kind: write_file
    path_prefix: ""
  - name: allow-e2e-approval-resolution
    verdict: allow
    actor_role: operator
    operation_kind: approval_resolution
  - name: allow-e2e-discretionary-add
    verdict: allow
    actor_role: operator
    operation_kind: discretionary_task_add
  - name: allow-e2e-reopen
    verdict: allow
    actor_role: operator
    operation_kind: case_reopen
  - name: allow-e2e-terminate
    verdict: allow
    actor_role: operator
    operation_kind: case_terminate
  - name: allow-e2e-human-task
    verdict: allow
    actor_role: operator
    operation_kind: human_task_completion
