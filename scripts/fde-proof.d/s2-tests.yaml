# S2-gate tests of the episode loop (WP-21a). Not part of the frozen S1 pre-registration
# (.agents/preregistrations/fde-s1/); the runner reads this list for `--slice s2`, runs
# scripts/fde-proof.d/s2/<ID>.sh, and does not verify an anchored pre-registration (none exists
# for S2 yet; the run records that).
tests:
  - {id: NT-13, what: "kind of an existing freeze is immutable; exploratory never settles S or F"}
  - {id: NT-17, what: "a frozen reference derived from a result is refused (best effort)"}
  - {id: NT-18, what: "model anchored after the first run event is MODEL_ANCHOR_LATE"}
  - {id: NT-32, what: "no execution without a freeze (I-1 execution gate)"}
  - {id: NT-33, what: "a partial freeze (record, RealityTrace, anchor) does not run"}
  - {id: NT-34, what: "program execution needs a decision bound to the execution digest"}
  - {id: NT-48, what: "an anchor published by an executor credential is refused"}
  - {id: AT-03, what: "Field Case open, revise, strategy, activities (document, revisions, template)"}
  - {id: AT-09, what: "independent settlement by a verifier outside the executor's chain (human-settlement A3 clause is WP-31: PARTIAL)"}
  - {id: AT-10, what: "dispositions map to lifecycle; episode-level never closes; blocked move names dimension and authorizer"}
  - {id: AT-11, what: "gates: four states, reassess on evidence change, nothing advances automatically"}
  - {id: AT-15, what: "continuation states next move, authorizer and settlement condition (programmatic part)"}
  - {id: NT-10, what: "no self-settlement on the delegation chain (I-2)"}
  - {id: NT-11, what: "hard gate not waivable without an approval"}
  - {id: NT-22, what: "suspended case refuses freeze, settlement, delegation and non-lifting dispositions"}
  - {id: NT-23, what: "no close without a close disposition"}
